rule_files: [rules.yaml]
evaluation_interval: 5m
tests:
  - name: Steady syslog ingestion stays quiet
    interval: 1h
    input_series:
      - series: vl_rows_ingested_total{job="victoria-logs-single-server",type="syslog_udp"}
        values: 0+10x72
    alert_rule_test:
      - alertname: UniFiSyslogSilent
        eval_time: 72h
        exp_alerts: []
  - name: Ingestion that stops for two days fires
    interval: 1h
    input_series:
      - series: vl_rows_ingested_total{job="victoria-logs-single-server",type="syslog_udp"}
        values: 0+10x24 240+0x60
    alert_rule_test:
      - alertname: UniFiSyslogSilent
        eval_time: 60h
        exp_alerts: []
      - alertname: UniFiSyslogSilent
        eval_time: 84h
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: VictoriaLogs has received no UniFi syslog for two days
              description: >-
                No rows arrived on the syslog listener (10.32.130.3 UDP/514).
                Check the console's SIEM export target, the victoria-logs-syslog
                Service and CiliumPolicyDrops for the victoria-logs-single pod.
  - name: A listener that never received a row fires
    interval: 1h
    input_series:
      - series: vl_rows_ingested_total{job="victoria-logs-single-server",type="other"}
        values: 0+10x3
    alert_rule_test:
      - alertname: UniFiSyslogSilent
        eval_time: 30m
        exp_alerts: []
      - alertname: UniFiSyslogSilent
        eval_time: 2h
        exp_alerts:
          - exp_labels: {job: victoria-logs-single-server, severity: warning, type: syslog_udp}
            exp_annotations:
              summary: VictoriaLogs has received no UniFi syslog for two days
              description: >-
                No rows arrived on the syslog listener (10.32.130.3 UDP/514).
                Check the console's SIEM export target, the victoria-logs-syslog
                Service and CiliumPolicyDrops for the victoria-logs-single pod.
