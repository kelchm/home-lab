rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  - name: Missing target, retries, capacity, drops and silence are detected
    interval: 1m
    input_series:
      - series: kube_daemonset_status_desired_number_scheduled{namespace="observability",daemonset="fluent-bit"}
        values: 3+0x30
      - series: up{job="fluent-bit",node="n1",endpoint="http"}
        values: 1+0x30
      - series: up{job="fluent-bit",node="n1",endpoint="http-v1"}
        values: 1+0x30
      - series: up{job="fluent-bit",node="n2",endpoint="http"}
        values: 1+0x30
      - series: up{job="fluent-bit",node="n2",endpoint="http-v1"}
        values: 1+0x30
      - series: fluentbit_output_retries_total{job="fluent-bit",node="n1",name="victorialogs"}
        values: 0+5x30
      - series: fluentbit_output_chunk_available_capacity_percent{job="fluent-bit",node="n1",name="victorialogs"}
        values: 20+0x30
      - series: fluentbit_output_dropped_records_total{job="fluent-bit",node="n1",name="victorialogs"}
        values: 0 40+0x29
      - series: fluentbit_input_records_total{job="fluent-bit",node="n2",name="pods"}
        values: 500+0x30
    promql_expr_test:
      - expr: count(ALERTS{alertname="FluentBitCollectorTargetMissing",alertstate="firing"})
        eval_time: 6m
        exp_samples: [{labels: '{}', value: 1}]
      - expr: count(ALERTS{alertname="FluentBitBufferNearCapacity",alertstate="firing"})
        eval_time: 3m
        exp_samples: [{labels: '{}', value: 1}]
      - expr: count(ALERTS{alertname="FluentBitDeliveryRetrying",alertstate="firing"})
        eval_time: 21m
        exp_samples: [{labels: '{}', value: 1}]
      - expr: count(ALERTS{alertname="FluentBitRecordsDropped",alertstate="firing"})
        eval_time: 2m
        exp_samples: [{labels: '{}', value: 1}]
      - expr: ALERTS{alertname="FluentBitRecordsDropped",alertstate="firing"}
        eval_time: 20m
        exp_samples: []
      - expr: count(ALERTS{alertname="FluentBitNodeLogIngestionSilent",alertstate="firing"})
        eval_time: 21m
        exp_samples: [{labels: '{}', value: 1}]
  - name: Talos logs that stop on one node fire for that node only
    interval: 1m
    input_series:
      - series: fluentbit_input_records_total{job="fluent-bit",node="n1",name="talos"}
        values: 0+300x10 3000+0x30
      - series: fluentbit_input_records_total{job="fluent-bit",node="n2",name="talos"}
        values: 0+300x40
    promql_expr_test:
      - expr: ALERTS{alertname="TalosLogIngestionSilent",alertstate="firing"}
        eval_time: 28m
        exp_samples: []
      - expr: ALERTS{alertname="TalosLogIngestionSilent",alertstate="firing"}
        eval_time: 29m
        exp_samples: [{labels: '{__name__="ALERTS",alertname="TalosLogIngestionSilent",alertstate="firing",job="fluent-bit",node="n1",name="talos",severity="warning",cluster="k8s-prod"}', value: 1}]
  - name: A scraped collector without the talos input fires
    interval: 1m
    input_series:
      - series: up{job="fluent-bit",node="n1",endpoint="http"}
        values: 1+0x30
      - series: up{job="fluent-bit",node="n2",endpoint="http"}
        values: 1+0x30
      - series: fluentbit_input_records_total{job="fluent-bit",node="n2",name="talos"}
        values: 0+300x30
    promql_expr_test:
      - expr: ALERTS{alertname="TalosLogIngestionSilent",alertstate="firing"}
        eval_time: 9m
        exp_samples: []
      - expr: ALERTS{alertname="TalosLogIngestionSilent",alertstate="firing"}
        eval_time: 11m
        exp_samples: [{labels: '{__name__="ALERTS",alertname="TalosLogIngestionSilent",alertstate="firing",node="n1",severity="warning",cluster="k8s-prod"}', value: 1}]
  - name: A node whose v2 target is gone is missing even if v1 still answers
    interval: 1m
    input_series:
      - series: kube_daemonset_status_desired_number_scheduled{namespace="observability",daemonset="fluent-bit"}
        values: 2+0x30
      - series: up{job="fluent-bit",node="n1",endpoint="http"}
        values: 1+0x30
      - series: up{job="fluent-bit",node="n1",endpoint="http-v1"}
        values: 1+0x30
      - series: up{job="fluent-bit",node="n2",endpoint="http-v1"}
        values: 1+0x30
    promql_expr_test:
      - expr: count(ALERTS{alertname="FluentBitCollectorTargetMissing",alertstate="firing"})
        eval_time: 6m
        exp_samples: [{labels: '{}', value: 1}]
  - name: A short delivery outage that recovers raises nothing
    interval: 1m
    input_series:
      - series: fluentbit_output_retries_total{job="fluent-bit",node="n1",name="victorialogs"}
        values: 0 5 10 15+0x27
    promql_expr_test:
      - expr: ALERTS{alertname="FluentBitDeliveryRetrying",alertstate="firing"}
        eval_time: 12m
        exp_samples: []
  - name: Skipped oversized lines count as dropped records
    interval: 1m
    input_series:
      - series: fluentbit_input_long_line_skipped_total{job="fluent-bit",node="n1",name="pods"}
        values: 0 1+0x29
    promql_expr_test:
      - expr: count(ALERTS{alertname="FluentBitRecordsDropped",alertstate="firing"})
        eval_time: 2m
        exp_samples: [{labels: '{}', value: 1}]
  - name: Healthy collectors raise nothing
    interval: 1m
    input_series:
      - series: kube_daemonset_status_desired_number_scheduled{namespace="observability",daemonset="fluent-bit"}
        values: 1+0x30
      - series: up{job="fluent-bit",node="n1",endpoint="http"}
        values: 1+0x30
      - series: up{job="fluent-bit",node="n1",endpoint="http-v1"}
        values: 1+0x30
      - series: fluentbit_output_retries_total{job="fluent-bit",node="n1",name="victorialogs"}
        values: 0+0x30
      - series: fluentbit_output_chunk_available_capacity_percent{job="fluent-bit",node="n1",name="victorialogs"}
        values: 99+0x30
      - series: fluentbit_input_records_total{job="fluent-bit",node="n1",name="pods"}
        values: 0+100x30
    promql_expr_test:
      - expr: ALERTS{alertstate="firing",alertname=~"FluentBit.*"}
        eval_time: 25m
        exp_samples: []
  - name: The events collector's delivery problems and silence are detected
    interval: 1m
    input_series:
      - series: up{job="fluent-bit-events",node="n3",endpoint="http"}
        values: 1+0x30
      - series: fluentbit_output_retries_total{job="fluent-bit-events",node="n3",name="events"}
        values: 0+5x30
      - series: fluentbit_output_chunk_available_capacity_percent{job="fluent-bit-events",node="n3",name="events"}
        values: 20+0x30
      - series: fluentbit_output_dropped_records_total{job="fluent-bit-events",node="n3",name="events"}
        values: 0 40+0x29
      - series: fluentbit_input_records_total{job="fluent-bit-events",node="n3",name="events"}
        values: 500+0x30
    promql_expr_test:
      - expr: count(ALERTS{alertname="FluentBitBufferNearCapacity",alertstate="firing",job="fluent-bit-events"})
        eval_time: 3m
        exp_samples: [{labels: '{}', value: 1}]
      - expr: count(ALERTS{alertname="FluentBitRecordsDropped",alertstate="firing",job="fluent-bit-events"})
        eval_time: 2m
        exp_samples: [{labels: '{}', value: 1}]
      - expr: count(ALERTS{alertname="FluentBitDeliveryRetrying",alertstate="firing",job="fluent-bit-events"})
        eval_time: 21m
        exp_samples: [{labels: '{}', value: 1}]
      - expr: ALERTS{alertname="KubernetesEventsIngestionSilent",alertstate="firing"}
        eval_time: 14m
        exp_samples: []
      - expr: ALERTS{alertname="KubernetesEventsIngestionSilent",alertstate="firing"}
        eval_time: 17m
        exp_samples: [{labels: '{__name__="ALERTS",alertname="KubernetesEventsIngestionSilent",alertstate="firing",severity="warning",cluster="k8s-prod"}', value: 1}]
  - name: An events collector that is not scraped is silent
    interval: 1m
    input_series:
      - series: up{job="fluent-bit",node="n1",endpoint="http"}
        values: 1+0x30
    promql_expr_test:
      - expr: ALERTS{alertname="KubernetesEventsIngestionSilent",alertstate="firing"}
        eval_time: 16m
        exp_samples: [{labels: '{__name__="ALERTS",alertname="KubernetesEventsIngestionSilent",alertstate="firing",job="fluent-bit-events",name="events",severity="warning",cluster="k8s-prod"}', value: 1}]
  - name: A scraped events collector without the events input is silent
    interval: 1m
    input_series:
      - series: up{job="fluent-bit-events",node="n3",endpoint="http"}
        values: 1+0x30
      - series: fluentbit_input_records_total{job="fluent-bit-events",node="n3",name="other"}
        values: 0+6x30
    promql_expr_test:
      - expr: ALERTS{alertname="KubernetesEventsIngestionSilent",alertstate="firing"}
        eval_time: 16m
        exp_samples: [{labels: '{__name__="ALERTS",alertname="KubernetesEventsIngestionSilent",alertstate="firing",job="fluent-bit-events",name="events",severity="warning",cluster="k8s-prod"}', value: 1}]
  - name: An events collector whose scrapes fail is silent
    interval: 1m
    input_series:
      - series: up{job="fluent-bit-events",node="n3",endpoint="http"}
        values: 1x5 0x30
      - series: fluentbit_input_records_total{job="fluent-bit-events",node="n3",name="events"}
        values: 0+6x5 stale
    promql_expr_test:
      - expr: ALERTS{alertname="KubernetesEventsIngestionSilent",alertstate="firing"}
        eval_time: 14m
        exp_samples: []
      - expr: ALERTS{alertname="KubernetesEventsIngestionSilent",alertstate="firing"}
        eval_time: 22m
        exp_samples: [{labels: '{__name__="ALERTS",alertname="KubernetesEventsIngestionSilent",alertstate="firing",job="fluent-bit-events",name="events",severity="warning",cluster="k8s-prod"}', value: 1}]
  - name: A replacement collector that receives events clears the silence
    interval: 1m
    input_series:
      - series: fluentbit_input_records_total{job="fluent-bit-events",node="n3",pod="old",name="events"}
        values: 100+0x20 stale
      - series: fluentbit_input_records_total{job="fluent-bit-events",node="n1",pod="new",name="events"}
        values: _x21 0+6x40
    promql_expr_test:
      - expr: count(ALERTS{alertname="KubernetesEventsIngestionSilent",alertstate="firing"})
        eval_time: 18m
        exp_samples: [{labels: '{}', value: 1}]
      - expr: ALERTS{alertname="KubernetesEventsIngestionSilent",alertstate="firing"}
        eval_time: 25m
        exp_samples: []
      - expr: ALERTS{alertname="KubernetesEventsIngestionSilent",alertstate="firing"}
        eval_time: 47m
        exp_samples: []
  - name: A collector receiving events raises nothing
    interval: 1m
    input_series:
      - series: up{job="fluent-bit-events",node="n3",endpoint="http"}
        values: 1+0x60
      - series: fluentbit_input_records_total{job="fluent-bit-events",node="n3",name="events"}
        values: 0+6x60
      - series: fluentbit_output_retries_total{job="fluent-bit-events",node="n3",name="events"}
        values: 0+0x60
      - series: fluentbit_output_chunk_available_capacity_percent{job="fluent-bit-events",node="n3",name="events"}
        values: 99+0x60
    promql_expr_test:
      - expr: ALERTS{alertstate="firing",alertname=~"FluentBit.*|KubernetesEvents.*"}
        eval_time: 50m
        exp_samples: []
  - name: Collector ingestion keeps VictoriaLogs quiet
    interval: 1m
    input_series:
      - series: vl_rows_ingested_total{job="victoria-logs-single-server",type="opentelemetry_protobuf"}
        values: 0+100x30
    promql_expr_test:
      - expr: ALERTS{alertname="VictoriaLogsIngestionSilent",alertstate="firing"}
        eval_time: 20m
        exp_samples: []
  - name: Stopped collector ingestion fires
    interval: 1m
    input_series:
      - series: vl_rows_ingested_total{job="victoria-logs-single-server",type="opentelemetry_protobuf"}
        values: 0+0x30
    promql_expr_test:
      - expr: count(ALERTS{alertname="VictoriaLogsIngestionSilent",alertstate="firing"})
        eval_time: 20m
        exp_samples: [{labels: '{}', value: 1}]
  - name: Missing collector ingestion series fires
    interval: 1m
    input_series:
      - series: vl_rows_ingested_total{job="victoria-logs-single-server",type="other"}
        values: 0+100x30
    promql_expr_test:
      - expr: count(ALERTS{alertname="VictoriaLogsIngestionSilent",alertstate="firing"})
        eval_time: 20m
        exp_samples: [{labels: '{}', value: 1}]
  - name: UniFi syslog reaching one node keeps the silence alert quiet
    interval: 1h
    input_series:
      - series: fluentbit_input_records_total{job="fluent-bit",node="n1",name="unifi"}
        values: 0+10x72
      - series: fluentbit_input_records_total{job="fluent-bit",node="n2",name="unifi"}
        values: 0+0x72
    promql_expr_test:
      - expr: ALERTS{alertname="UniFiSyslogSilent",alertstate="firing"}
        eval_time: 72h
        exp_samples: []
  - name: UniFi syslog that stops for two days fires
    interval: 1h
    input_series:
      - series: fluentbit_input_records_total{job="fluent-bit",node="n1",name="unifi"}
        values: 0+10x24 240+0x60
    promql_expr_test:
      - expr: ALERTS{alertname="UniFiSyslogSilent",alertstate="firing"}
        eval_time: 60h
        exp_samples: []
      - expr: count(ALERTS{alertname="UniFiSyslogSilent",alertstate="firing"})
        eval_time: 84h
        exp_samples: [{labels: '{}', value: 1}]
  - name: A missing UniFi syslog input fires
    interval: 1h
    input_series:
      - series: fluentbit_input_records_total{job="fluent-bit",node="n1",name="pods"}
        values: 0+10x3
    promql_expr_test:
      - expr: ALERTS{alertname="UniFiSyslogSilent",alertstate="firing"}
        eval_time: 30m
        exp_samples: []
      - expr: count(ALERTS{alertname="UniFiSyslogSilent",alertstate="firing"})
        eval_time: 2h
        exp_samples: [{labels: '{}', value: 1}]
  - name: Talos var warning holds for 15 minutes and resolves after recovery
    interval: 1m
    input_series:
      - series: node_filesystem_avail_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="k8s-prod-1",platform="k8s"}
        values: 19+0x15 25+0x14
      - series: node_filesystem_size_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="k8s-prod-1",platform="k8s"}
        values: 100+0x30
      - series: node_filesystem_readonly{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="k8s-prod-1",platform="k8s"}
        values: 0+0x30
    alert_rule_test:
      - eval_time: 14m
        alertname: KubeNodeEphemeralStorageHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: KubeNodeEphemeralStorageHigh
        exp_alerts:
          - exp_labels:
              cluster: k8s-prod
              job: node-exporter
              mountpoint: /var
              fstype: xfs
              device: /dev/nvme0n1p4
              instance: k8s-prod-1
              platform: k8s
              severity: warning
            exp_annotations:
              summary: /var on k8s-prod-1 is over 80% full
              description: k8s-prod-1 has 19% of /var free. Verify the live image-GC settings and inspect GC failures, container images, logs and emptyDir usage before the shared filesystem crosses its 15% free hard-eviction threshold.
              runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/talos-ephemeral-storage.md
      - eval_time: 16m
        alertname: KubeNodeEphemeralStorageHigh
        exp_alerts: []
  - name: Talos var warning accepts hostname and legacy IP instance labels
    interval: 1m
    input_series:
      - series: node_filesystem_avail_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="k8s-prod-1",platform="k8s"}
        values: 19+0x30
      - series: node_filesystem_size_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="k8s-prod-1",platform="k8s"}
        values: 100+0x30
      - series: node_filesystem_readonly{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="k8s-prod-1",platform="k8s"}
        values: 0+0x30
      - series: node_filesystem_avail_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="10.32.30.12:9100"}
        values: 19+0x30
      - series: node_filesystem_size_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="10.32.30.12:9100"}
        values: 100+0x30
      - series: node_filesystem_readonly{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="10.32.30.12:9100"}
        values: 0+0x30
    promql_expr_test:
      - expr: count(ALERTS{alertname="KubeNodeEphemeralStorageHigh",alertstate="firing"})
        eval_time: 15m
        exp_samples:
          - labels: '{}'
            value: 2
  - name: Talos var warning excludes threshold boundary other mounts hosts clusters and read-only filesystems
    interval: 1m
    input_series:
      - series: node_filesystem_avail_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="k8s-prod-1"}
        values: 20+0x30
      - series: node_filesystem_size_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="k8s-prod-1"}
        values: 100+0x30
      - series: node_filesystem_readonly{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="k8s-prod-1"}
        values: 0+0x30
      - series: node_filesystem_avail_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="k8s-prod-2"}
        values: 25+0x30
      - series: node_filesystem_size_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="k8s-prod-2"}
        values: 100+0x30
      - series: node_filesystem_readonly{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="k8s-prod-2"}
        values: 0+0x30
      - series: node_filesystem_avail_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var/mnt/longhorn",fstype="xfs",device="/dev/nvme0n1p5",instance="k8s-prod-1"}
        values: 19+0x30
      - series: node_filesystem_size_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var/mnt/longhorn",fstype="xfs",device="/dev/nvme0n1p5",instance="k8s-prod-1"}
        values: 100+0x30
      - series: node_filesystem_readonly{cluster="k8s-prod",job="node-exporter",mountpoint="/var/mnt/longhorn",fstype="xfs",device="/dev/nvme0n1p5",instance="k8s-prod-1"}
        values: 0+0x30
      - series: node_filesystem_avail_bytes{cluster="k8s-prod",job="pve",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="pve-sbx-1"}
        values: 19+0x30
      - series: node_filesystem_size_bytes{cluster="k8s-prod",job="pve",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="pve-sbx-1"}
        values: 100+0x30
      - series: node_filesystem_readonly{cluster="k8s-prod",job="pve",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="pve-sbx-1"}
        values: 0+0x30
      - series: node_filesystem_avail_bytes{cluster="k8s-prod",job="spark",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="spark-1"}
        values: 19+0x30
      - series: node_filesystem_size_bytes{cluster="k8s-prod",job="spark",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="spark-1"}
        values: 100+0x30
      - series: node_filesystem_readonly{cluster="k8s-prod",job="spark",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="spark-1"}
        values: 0+0x30
      - series: node_filesystem_avail_bytes{cluster="other-cluster",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="other-node"}
        values: 19+0x30
      - series: node_filesystem_size_bytes{cluster="other-cluster",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="other-node"}
        values: 100+0x30
      - series: node_filesystem_readonly{cluster="other-cluster",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="other-node"}
        values: 0+0x30
      - series: node_filesystem_avail_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="k8s-prod-3"}
        values: 19+0x30
      - series: node_filesystem_size_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="k8s-prod-3"}
        values: 100+0x30
      - series: node_filesystem_readonly{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs",device="/dev/nvme0n1p4",instance="k8s-prod-3"}
        values: 1+0x30
    promql_expr_test:
      - expr: ALERTS{alertname="KubeNodeEphemeralStorageHigh",alertstate="firing"}
        eval_time: 20m
        exp_samples: []
