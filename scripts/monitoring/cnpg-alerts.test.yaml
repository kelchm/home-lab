rule_files:
  - visionect.yaml
  - bambuddy.yaml
  - backups.yaml
evaluation_interval: 1m
tests:
  - name: A database cluster with no instance reporting for 5 minutes is offline
    interval: 1m
    input_series:
      - series: cnpg_collector_up{cluster="k8s-prod",namespace="iot",pod="visionect-db-2",exported_cluster="visionect-db"}
        values: 1x10 stale
      - series: cnpg_collector_up{cluster="k8s-prod",namespace="printing",pod="bambuddy-db-2",exported_cluster="bambuddy-db"}
        values: 1x30
    alert_rule_test:
      - eval_time: 13m
        alertname: CNPGClusterOffline
        exp_alerts: []
      - eval_time: 20m
        alertname: CNPGClusterOffline
        exp_alerts:
          - exp_labels:
              cluster: k8s-prod
              severity: critical
              namespace: iot
              cnpg_cluster: visionect-db
            exp_annotations:
              summary: CNPG Cluster has no running instances!
              description: |-
                CloudNativePG Cluster "iot/visionect-db" has no ready instances.

                Having an offline cluster means your applications will not be able to access the database, leading to
                potential service disruption and/or data loss.
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterOffline.md

  - name: Each cluster's rule watches only its own instances
    interval: 1m
    input_series:
      - series: cnpg_collector_up{cluster="k8s-prod",namespace="iot",pod="visionect-db-2",exported_cluster="visionect-db"}
        values: 1x30
      - series: cnpg_collector_up{cluster="k8s-prod",namespace="printing",pod="bambuddy-db-2",exported_cluster="bambuddy-db"}
        values: 1x10 stale
    alert_rule_test:
      - eval_time: 5m
        alertname: CNPGClusterOffline
        exp_alerts: []
      - eval_time: 20m
        alertname: CNPGClusterOffline
        exp_alerts:
          - exp_labels:
              cluster: k8s-prod
              severity: critical
              namespace: printing
              cnpg_cluster: bambuddy-db
            exp_annotations:
              summary: CNPG Cluster has no running instances!
              description: |-
                CloudNativePG Cluster "printing/bambuddy-db" has no ready instances.

                Having an offline cluster means your applications will not be able to access the database, leading to
                potential service disruption and/or data loss.
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterOffline.md

  - name: An instance that reports PostgreSQL down does not count as running
    interval: 1m
    input_series:
      - series: cnpg_collector_up{cluster="k8s-prod",namespace="iot",pod="visionect-db-2",exported_cluster="visionect-db"}
        values: 1x30
      - series: cnpg_collector_up{cluster="k8s-prod",namespace="printing",pod="bambuddy-db-2",exported_cluster="bambuddy-db"}
        values: 1x10 0x20
    alert_rule_test:
      - eval_time: 14m
        alertname: CNPGClusterOffline
        exp_alerts: []
      - eval_time: 20m
        alertname: CNPGClusterOffline
        exp_alerts:
          - exp_labels:
              cluster: k8s-prod
              severity: critical
              namespace: printing
              cnpg_cluster: bambuddy-db
            exp_annotations:
              summary: CNPG Cluster has no running instances!
              description: |-
                CloudNativePG Cluster "printing/bambuddy-db" has no ready instances.

                Having an offline cluster means your applications will not be able to access the database, leading to
                potential service disruption and/or data loss.
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterOffline.md

  - name: WAL waiting for the archiver for 15 minutes is a stalled archive
    interval: 1m
    input_series:
      - series: cnpg_collector_pg_wal_archive_status{cluster="k8s-prod",namespace="iot",pod="visionect-db-1",value="ready"}
        values: 0x5 3x30
      - series: cnpg_collector_pg_wal_archive_status{cluster="k8s-prod",namespace="printing",pod="bambuddy-db-2",value="ready"}
        values: 0x40
      - series: cnpg_collector_pg_wal_archive_status{cluster="k8s-prod",namespace="printing",pod="bambuddy-db-2",value="done"}
        values: 40x40
    alert_rule_test:
      - eval_time: 18m
        alertname: CNPGWALArchivingStalled
        exp_alerts: []
      - eval_time: 25m
        alertname: CNPGWALArchivingStalled
        exp_alerts:
          - exp_labels:
              cluster: k8s-prod
              severity: critical
              namespace: iot
              pod: visionect-db-1
              value: ready
            exp_annotations:
              summary: WAL archiving is stalled on iot/visionect-db-1
              description: 3 WAL segments have waited for the archiver for 15 minutes. Unarchived WAL stays on the database volume until the store accepts it, and the recovery point stops advancing. Check the plugin-barman-cloud container's log on this pod, then the store on Athena.
              runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/cnpg-backup-restore.md#wal-archiving-is-stalled

  - name: A base backup older than 26 hours, or none recorded, is stale
    interval: 1m
    input_series:
      - series: barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster="k8s-prod",namespace="iot",pod="visionect-db-1"}
        values: 3600x1800
      - series: barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster="k8s-prod",namespace="printing",pod="bambuddy-db-2"}
        values: 0+60x1800
    alert_rule_test:
      - eval_time: 27h50m
        alertname: CNPGBackupStale
        exp_alerts: []
      - eval_time: 28h10m
        alertname: CNPGBackupStale
        exp_alerts:
          - exp_labels:
              cluster: k8s-prod
              severity: critical
              namespace: iot
              pod: visionect-db-1
            exp_annotations:
              summary: No completed base backup for iot/visionect-db-1 in 26 hours
              description: 'The plugin has not recorded a completed base backup for this instance within 26 hours, or has never recorded one. List the Backup objects in the namespace: one stuck in `started` or `failed` is the cause, and a `completed` one means only the record is missing.'
              runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/cnpg-backup-restore.md#no-completed-backup

  - name: A database pod whose backup metrics vanish is reported, even when its exporter is gone
    interval: 1m
    input_series:
      - series: kube_pod_init_container_info{cluster="k8s-prod",namespace="iot",pod="visionect-db-1",container="plugin-barman-cloud"}
        values: 1x60
      - series: barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster="k8s-prod",namespace="iot",pod="visionect-db-1"}
        values: 100x5 stale
      - series: kube_pod_init_container_info{cluster="k8s-prod",namespace="printing",pod="bambuddy-db-2",container="plugin-barman-cloud"}
        values: 1x60
      - series: barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster="k8s-prod",namespace="printing",pod="bambuddy-db-2"}
        values: 100x60
      - series: kube_pod_init_container_info{cluster="k8s-prod",namespace="media",pod="sonarr-0",container="init-config"}
        values: 1x60
    alert_rule_test:
      - eval_time: 30m
        alertname: CNPGBackupMetricsMissing
        exp_alerts: []
      - eval_time: 45m
        alertname: CNPGBackupMetricsMissing
        exp_alerts:
          - exp_labels:
              cluster: k8s-prod
              severity: warning
              namespace: iot
              pod: visionect-db-1
            exp_annotations:
              summary: Backup state of iot/visionect-db-1 is not being monitored
              description: No Barman Cloud metrics are arriving for this database pod, so stalled archiving and stale backups would go unnoticed. Its exporter is not answering or not scraped, or the Cluster's plugin is disabled.
              runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/cnpg-backup-restore.md#no-completed-backup

  - name: Only database volumes below half free are filling up
    interval: 1m
    input_series:
      - series: kube_pod_init_container_info{cluster="k8s-prod",namespace="iot",pod="visionect-db-1",container="plugin-barman-cloud"}
        values: 1x40
      - series: kubelet_volume_stats_available_bytes{cluster="k8s-prod",namespace="iot",persistentvolumeclaim="visionect-db-1"}
        values: 80x5 40x35
      - series: kubelet_volume_stats_capacity_bytes{cluster="k8s-prod",namespace="iot",persistentvolumeclaim="visionect-db-1"}
        values: 100x40
      - series: kubelet_volume_stats_available_bytes{cluster="k8s-prod",namespace="media",persistentvolumeclaim="sonarr"}
        values: 10x40
      - series: kubelet_volume_stats_capacity_bytes{cluster="k8s-prod",namespace="media",persistentvolumeclaim="sonarr"}
        values: 100x40
    alert_rule_test:
      - eval_time: 18m
        alertname: CNPGVolumeFillingUp
        exp_alerts: []
      - eval_time: 25m
        alertname: CNPGVolumeFillingUp
        exp_alerts:
          - exp_labels:
              cluster: k8s-prod
              severity: critical
              namespace: iot
              persistentvolumeclaim: visionect-db-1
            exp_annotations:
              summary: Database volume iot/visionect-db-1 is 40% free
              description: Less than half of this database volume is free. Both volumes normally sit above 85% free, so this is WAL that cannot be archived or data growth. PostgreSQL stops accepting writes when the volume fills.
              runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/cnpg-backup-restore.md#the-database-volume-is-filling
