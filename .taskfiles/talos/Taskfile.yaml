---
version: '3'

tasks:

  generate-config:
    desc: Generate Talos configuration
    dir: '{{.TALOS_DIR}}'
    cmd: talhelper genconfig
    preconditions:
      - test -f {{.TALOS_DIR}}/talconfig.yaml
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which talhelper

  apply-node:
    desc: Regenerate Talos config, show the dry-run diff, then apply to a node after confirmation [IP=required]
    dir: '{{.TALOS_DIR}}'
    # clusterconfig/ is gitignored and outlives the sources it was rendered
    # from, so it is regenerated on every run instead of trusted.
    cmds:
      - task: generate-config
      - yq '"Requested Talos " + .talosVersion + " and Kubernetes " + .kubernetesVersion' talenv.yaml
      - talhelper gencommand apply --node {{.IP}} --extra-flags '--mode={{.MODE}} --dry-run' | bash
      - task: apply-node-confirmed
        vars:
          IP: '{{.IP}}'
          MODE: '{{.MODE}}'
    vars:
      MODE: '{{.MODE | default "auto"}}'
    requires:
      vars: [IP]
    preconditions:
      - which talhelper talosctl yq

  apply-node-confirmed:
    internal: true
    dir: '{{.TALOS_DIR}}'
    prompt: Apply the configuration shown above to {{.IP}} with --mode={{.MODE}}?
    cmd: talhelper gencommand apply --node {{.IP}} --extra-flags '--mode={{.MODE}}' | bash
    requires:
      vars: [IP, MODE]

  upgrade-node:
    desc: Upgrade Talos on a single node with a full power cycle, if preflight passes [IP=required]
    dir: '{{.TALOS_DIR}}'
    cmds:
      # Refuses the upgrade unless the cluster can lose this node.
      - '{{.ROOT_DIR}}/.agents/skills/talos-rollout/scripts/preflight.sh {{.IP}}'
      # The default reboot mode uses kexec and has hung these nodes during the
      # shutdown handoff. powercycle bypasses kexec and must remain explicit.
      - talhelper gencommand upgrade --node {{.IP}} --extra-flags "--drain-timeout=15m --timeout=20m --reboot-mode=powercycle" | bash
    requires:
      vars: [IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which jq kubectl talhelper talosctl

  upgrade-k8s:
    desc: Upgrade Kubernetes
    dir: '{{.TALOS_DIR}}'
    cmd: talhelper gencommand upgrade-k8s --extra-flags "--to '{{.KUBERNETES_VERSION}}'" | bash
    vars:
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TALOS_DIR}}/talenv.yaml
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talhelper talosctl yq

  reset:
    desc: Resets nodes back to maintenance mode
    dir: '{{.TALOS_DIR}}'
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: talhelper gencommand reset --extra-flags="--reboot {{- if eq .CLI_FORCE false }} --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL{{ end }} --graceful=false --wait=false" | bash
    preconditions:
      - which talhelper
