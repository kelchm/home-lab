---
version: '3'

# SparkRun owns the inference lifecycle on the Sparks. This helper only
# inspects the hosts; it never starts, stops or filters workload containers.
# The former sparks:deepseek:down/logs helpers were retired (issue #666) so no
# task can match containers by compose label.
vars:
  SPARK_HOSTS: '10.32.21.31 10.32.21.32'

tasks:
  status:
    desc: Inspect GPU, host memory and running containers on both Sparks
    cmds:
      - for: {var: SPARK_HOSTS}
        cmd: |
          ssh {{.ITEM}} 'set -e
            hostname
            nvidia-smi --query-gpu=temperature.gpu,power.draw,utilization.gpu --format=csv,noheader
            free -h
            docker ps --format "{{`{{.Names}}`}} {{`{{.Status}}`}}"'
