---
version: '3'

# Imperative verbs for the Sparks. switch/baseline drive the Ansible control
# plane in sparks/ansible/; down and status are dependency-free break-glass.

vars:
  SPARK_HOSTS: '10.32.21.31 10.32.21.32'
  REMOTE_DIR: '/opt/spark-stack'
  # Three mutually exclusive profiles. Qwen is this repo's compose stack on
  # :8000; DeepSeek and GLM are pinned external guides on :8888.
  QWEN_CONTAINER: 'vllm-qwen'
  DSPARK_PROJECT: 'dspark-guide'
  GLM_CONTAINER: 'glm53-exl3'

tasks:

  switch:
    desc: Switch the resident inference profile, guarded and ready-gated [PROFILE=<profiles/*.yaml name>]
    dir: '{{.ROOT_DIR}}/sparks/ansible'
    cmd: ansible-playbook switch.yaml -e profile={{.PROFILE}}
    requires:
      vars: [PROFILE]

  publish:
    desc: Re-point the stable endpoint at an already-healthy profile without a switch [PROFILE=<profiles/*.yaml name>]
    dir: '{{.ROOT_DIR}}/sparks/ansible'
    cmd: ansible-playbook publish.yaml -e profile={{.PROFILE}}
    requires:
      vars: [PROFILE]

  baseline:
    desc: Converge host baseline and deploy Caddy + controller to spark-1
    dir: '{{.ROOT_DIR}}/sparks/ansible'
    cmd: ansible-playbook baseline.yaml

  down:
    desc: Stop and remove every inference stack on BOTH Sparks
    cmds:
      - for: {var: SPARK_HOSTS}
        cmd: |
          echo "=== {{.ITEM}} ==="
          ssh {{.ITEM}} 'pkill -f "[s]tart-deepseek-v4-flash-dspark.sh" || true'
          ssh {{.ITEM}} 'for pid in $(pgrep -f "[s]tart.sh" || true); do [ "$(readlink -f /proc/$pid/cwd 2>/dev/null)" = /home/kelchm/glm53-guide ] && kill "$pid" || true; done'
          ssh {{.ITEM}} 'ids=$(docker ps -aq --filter "name={{.GLM_CONTAINER}}"); [ -n "$ids" ] && docker rm -f $ids || echo "  no GLM containers"'
          # The DeepSeek route is the guide's own compose project, not ours;
          # matching a container name this repo owns would miss it entirely.
          ssh {{.ITEM}} 'ids=$(docker ps -aq --filter "name={{.DSPARK_PROJECT}}"); [ -n "$ids" ] && docker rm -f $ids || echo "  no dspark containers"'
          ssh {{.ITEM}} 'if [ -d {{.REMOTE_DIR}}/inference ]; then cd {{.REMOTE_DIR}}/inference && sudo docker compose down; else echo "  no compose stack"; fi'


  logs:
    desc: Tail logs of whichever inference stack is running [HOST=required]
    cmd: |
      ssh {{.HOST}} 'c=$(docker ps -q --filter "name={{.DSPARK_PROJECT}}" --filter "name={{.QWEN_CONTAINER}}" --filter "name={{.GLM_CONTAINER}}" | head -1);
        [ -n "$c" ] || { echo "no inference container running on this host" >&2; exit 1; }
        docker logs -f --tail 100 "$c"'
    requires:
      vars:
        - name: HOST
          enum: ['10.32.21.31', '10.32.21.32']

  status:
    desc: Show inference and GPU status on both Sparks
    cmds:
      - for: {var: SPARK_HOSTS}
        cmd: |
          echo "=== {{.ITEM}} ==="
          ssh {{.ITEM}} 'nvidia-smi --query-gpu=temperature.gpu,power.draw,utilization.gpu --format=csv,noheader; sudo docker ps --format "  {{`{{.Names}}`}} {{`{{.Status}}`}}"' || true
          curl -s --max-time 5 http://{{.ITEM}}:8000/v1/models | head -c 160 || true
          curl -s --max-time 5 http://{{.ITEM}}:8888/v1/models | head -c 160 || true
          echo
