---
# Recovery-only: re-point the stable endpoint at an already-healthy profile
# without unloading it — after a caddy restart with a TP=2 profile resident,
# or after a switch that failed between smoke and publish. Verifies identity
# and coherence before touching the route; never starts or stops a model.
- name: Publish the stable endpoint for a resident profile
  hosts: spark-1
  gather_facts: false
  pre_tasks:
    # Profiles are discovered, never enumerated: adding one is adding a file.
    - name: Assert profile is defined and known
      ansible.builtin.assert:
        that:
          - profile is defined
          - (playbook_dir + '/profiles/' + profile + '.yaml') is exists
        fail_msg: "set -e profile=<name>; available: {{ query('ansible.builtin.fileglob', playbook_dir + '/profiles/*.yaml') | map('basename') | map('regex_replace', '[.]yaml$', '') | sort | join(', ') }}"

    - name: Load profile variables
      ansible.builtin.include_vars: "profiles/{{ profile }}.yaml"

    - name: Assert profile contract
      ansible.builtin.assert:
        that:
          - profile_name == profile
          - served_model_id is defined
          - serve_port is defined
          - health_url is defined
          - start_driver in ['compose', 'guide']
        fail_msg: "profiles/{{ profile }}.yaml is missing required keys (profile_name matching the filename, served_model_id, serve_port, health_url, start_driver)"

  tasks:
    - name: Acquire switch lock
      ansible.builtin.command: mkdir {{ lock_dir }}
      register: lock_acquire
      failed_when: false

    - name: Fail if switch already in progress
      ansible.builtin.fail:
        msg: "another switch appears to be in progress; remove {{ lock_dir }} on spark-1 if stale"
      when: lock_acquire.rc != 0

    - name: Publish profile
      # rescue/always never run for unreachable hosts, which would leak the
      # lock; ignoring lets the gates below convert unreachable into a failure.
      ignore_unreachable: true
      block:
        - name: Check profile health
          ansible.builtin.shell: curl -fsS --connect-timeout 5 --max-time 10 {{ health_url }}
          register: health_check
          changed_when: false

        - name: Read served models from the profile port
          ansible.builtin.shell: curl -fsS --max-time 10 http://localhost:{{ serve_port }}/v1/models
          register: models_direct
          changed_when: false

        - name: Assert the profile's model is the only served model
          ansible.builtin.assert:
            that:
              - (models_direct.stdout | from_json).data | map(attribute='id') | list == [served_model_id]
            fail_msg: "profile port serves {{ (models_direct.stdout | from_json).data | map(attribute='id') | list }}, expected exactly ['{{ served_model_id }}']"

        - name: Smoke test profile
          ansible.builtin.include_tasks: tasks/smoke.yaml
          when: smoke_command is defined and not (skip_smoke | default(false))

        # Residency reflects what is verified running, not what is routed;
        # written before the route flip so state never claims less than the
        # route delivers.
        - name: Record residency
          ansible.builtin.copy:
            content: "{{ profile_name }}\n"
            dest: "{{ resident_file }}"

        - name: Mark route change begun
          ansible.builtin.set_fact:
            route_publish_attempted: true

        - name: Publish profile route
          ansible.builtin.include_tasks: tasks/caddy-publish.yaml
          vars:
            caddy_mode: active
            caddy_upstream_port: "{{ serve_port }}"

        - name: Read served models through the stable endpoint
          ansible.builtin.shell: curl -fsS --max-time 10 http://localhost:80/v1/models
          register: models_stable
          changed_when: false

        - name: Assert the stable endpoint serves the profile
          ansible.builtin.assert:
            that:
              - served_model_id in ((models_stable.stdout | from_json).data | map(attribute='id') | list)
            fail_msg: "stable endpoint does not serve {{ served_model_id }} after publish"

        - name: Append switch log
          ansible.builtin.shell: echo "$(date -Is) publish {{ profile_name }}" >> {{ switch_log }}

      rescue:
        # Only revert if the route change had begun: a failure before that
        # point must not tear down a still-working route for another profile.
        - name: Leave the stable endpoint in maintenance
          ansible.builtin.include_tasks: tasks/caddy-publish.yaml
          vars:
            caddy_mode: maintenance
            caddy_publish_ignore_errors: true
          when: route_publish_attempted | default(false)

        - name: Fail publish
          ansible.builtin.fail:
            msg: "publish of {{ profile }} failed{{ ' after the route change began; the stable endpoint is in maintenance' if route_publish_attempted | default(false) else '; the existing route was not touched' }} — verify the profile directly on :{{ serve_port }} or run a full 'task sparks:switch PROFILE={{ profile }}'"

      always:
        - name: Remove switch lock
          ansible.builtin.file:
            path: "{{ lock_dir }}"
            state: absent
