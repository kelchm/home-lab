---
- name: Ensure caddy directory exists
  ansible.builtin.file:
    path: "{{ caddy_dir }}"
    state: directory
    owner: kelchm
  become: true

- name: Copy caddy compose.yaml
  ansible.builtin.copy:
    src: compose.yaml
    dest: "{{ caddy_dir }}/compose.yaml"

# Staged for boot convergence: spark-baseline.sh restores this route after a
# reboot so a route published for a TP=2 profile never outlives its containers.
- name: Render boot config
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_dir }}/Caddyfile.boot"
  vars:
    caddy_mode: active
    caddy_upstream_port: "{{ default_profile_port }}"

- name: Check for a previously published config
  ansible.builtin.stat:
    path: "{{ caddy_dir }}/Caddyfile"
  register: caddyfile_stat

# Re-running baseline must not clobber a published route: the live config is
# seeded from the boot config only on first deploy; after that the switch
# transaction and boot convergence own it.
- name: Seed live config on first deploy
  ansible.builtin.copy:
    src: "{{ caddy_dir }}/Caddyfile.boot"
    dest: "{{ caddy_dir }}/Caddyfile"
    remote_src: true
  when: not caddyfile_stat.stat.exists

- name: Pull and start caddy
  ansible.builtin.shell: cd {{ caddy_dir }} && docker compose pull -q && docker compose up -d
