---
services:
  caddy:
    image: caddy:2.11.4@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    container_name: spark-caddy
    restart: unless-stopped
    # Host networking: the docker bridge is blocked from reaching the fabric
    # and the upstreams bind host ports.
    network_mode: host
    volumes:
      # The whole directory, so the transaction's Caddyfile.next is visible to
      # `caddy validate` before it replaces the live Caddyfile.
      - ./:/etc/caddy:ro
      - caddy-data:/data
volumes:
  caddy-data: {}
