---
- name: Switch Spark inference profile
  hosts: spark-1
  gather_facts: false
  pre_tasks:
    - name: Load and validate profile
      ansible.builtin.include_tasks: tasks/load-profile.yaml

  tasks:
    # Outside the blocks: a lock conflict must fail without entering rescue,
    # and the release below must only run when this invocation holds the lock.
    - name: Acquire switch lock
      ansible.builtin.command: mkdir {{ lock_dir }}
      register: lock_acquire
      failed_when: false
      changed_when: lock_acquire.rc == 0

    - name: Fail if switch already in progress
      ansible.builtin.fail:
        msg: "another switch appears to be in progress; remove {{ lock_dir }} on spark-1 if stale"
      when: lock_acquire.rc != 0

    # Unpublish before touching anything: clients get a clean 503 for the whole
    # uncommitted interval instead of queueing into a cold boot. A failure here
    # aborts with the previous profile untouched and still routed.
    - name: Publish maintenance before teardown
      # Unreachable results would skip this rescue and leak the lock; ignoring
      # them means the assert below is what proves maintenance actually landed.
      ignore_unreachable: true
      block:
        - name: Publish maintenance
          ansible.builtin.include_tasks: tasks/caddy-publish.yaml
          vars:
            caddy_mode: maintenance

        - name: Assert maintenance is applied
          ansible.builtin.assert:
            that:
              - caddy_reload is not skipped
              - caddy_reload is not failed
              - not (caddy_reload.unreachable | default(false))
            fail_msg: "the maintenance reload did not complete"
      rescue:
        - name: Remove switch lock after failed unpublish
          ansible.builtin.file:
            path: "{{ lock_dir }}"
            state: absent

        - name: Fail without teardown
          ansible.builtin.fail:
            msg: >-
              could not publish maintenance; nothing was torn down and the previous profile
              is still routed — verify caddy on spark-1 (baseline.yaml) before retrying

    - name: Switch profile
      # rescue/always never run for unreachable hosts, which would leak the
      # lock; ignoring lets the gates below convert unreachable into a failure.
      ignore_unreachable: true
      block:
        - name: Ensure state directory exists
          ansible.builtin.file:
            path: "{{ remote_dir }}"
            state: directory
            owner: kelchm
            mode: "0755"
          become: true

        - name: Teardown on both hosts
          ansible.builtin.include_tasks: tasks/teardown-host.yaml
          loop: "{{ groups['sparks'] }}"
          loop_control:
            loop_var: teardown_host

        - name: Record residency as none
          ansible.builtin.copy:
            content: "none\n"
            dest: "{{ resident_file }}"
            mode: "0644"

        - name: Memory-reclaim gate on both hosts
          ansible.builtin.shell: awk '/MemAvailable/ {print int($2/1024/1024)}' /proc/meminfo
          register: mem_available
          until: mem_available.stdout | int >= min_available_gib
          retries: 4
          delay: 15
          changed_when: false
          ignore_errors: true  # noqa: ignore-errors — the gate below turns low memory into a targeted failure
          delegate_to: "{{ item }}"
          loop: "{{ groups['sparks'] }}"

        - name: Fail when UVM did not release
          ansible.builtin.fail:
            msg: >-
              UVM from the previous profile did not release on {{ item.item }};
              reboot the affected Spark and re-run (there is no watchdog)
          when: item is failed or (item.stdout | default('0') | int < min_available_gib)
          loop: "{{ mem_available.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Drop caches on both hosts
          ansible.builtin.shell: sync && echo 3 > /proc/sys/vm/drop_caches
          changed_when: true
          become: true
          delegate_to: "{{ item }}"
          loop: "{{ groups['sparks'] }}"

        - name: Preflight checks
          ansible.builtin.include_tasks: tasks/preflight.yaml

        - name: Start profile
          ansible.builtin.include_tasks: tasks/start.yaml

        # Cold TP=2 boots take 15–30 min; this is the 30-minute gate. Per-probe
        # timeouts keep a half-dead endpoint from hanging the gate forever.
        - name: Ready gate on spark-1
          ansible.builtin.uri:
            url: "{{ health_url }}"
            timeout: 10
          register: ready_check
          until: ready_check.status == 200
          retries: "{{ ready_retries }}"
          delay: "{{ ready_delay }}"

        - name: Read served models from the profile port
          ansible.builtin.uri:
            url: "http://localhost:{{ serve_port }}/v1/models"
            return_content: true
            timeout: 10
          register: models_direct

        # A healthy port serving the wrong thing must never be published.
        - name: Assert the profile's model is the only served model
          ansible.builtin.assert:
            that:
              - models_direct.json.data | map(attribute='id') | list == [served_model_id]
            fail_msg: >-
              profile port serves {{ models_direct.json.data | map(attribute='id') | list }},
              expected exactly ['{{ served_model_id }}']

        - name: Smoke test profile
          ansible.builtin.include_tasks: tasks/smoke.yaml
          when: smoke_command is defined and not (skip_smoke | default(false))

        # Residency reflects what is verified running, not what is routed;
        # written before the route flip so a failure between publish and the
        # end of the play never leaves an active route with stale residency.
        - name: Record residency
          ansible.builtin.copy:
            content: "{{ profile_name }}\n"
            dest: "{{ resident_file }}"
            mode: "0644"

        - name: Publish profile route
          ansible.builtin.include_tasks: tasks/caddy-publish.yaml
          vars:
            caddy_mode: active
            caddy_upstream_port: "{{ serve_port }}"

        - name: Read served models through the stable endpoint
          ansible.builtin.uri:
            url: http://localhost:80/v1/models
            return_content: true
            timeout: 10
          register: models_stable

        - name: Assert the stable endpoint serves the profile
          ansible.builtin.assert:
            that:
              - served_model_id in (models_stable.json.data | map(attribute='id') | list)
            fail_msg: "stable endpoint does not serve {{ served_model_id }} after publish"

        - name: Append switch log
          ansible.builtin.shell: echo "$(date -Is) switch {{ profile_name }} published" >> {{ switch_log }}
          changed_when: true

      rescue:
        # The async start script can keep launching containers after a failed
        # gate; kill anything still running from the guide directory before
        # advising teardown.
        - name: Stop lingering start script
          ansible.builtin.shell: |
            for pid in $(pgrep -f '[s]tart' || true); do
              if [ "$(readlink -f /proc/$pid/cwd 2>/dev/null)" = "{{ guide_dir }}" ]; then
                kill "$pid" || true
              fi
            done
          changed_when: true
          when: guide_dir is defined
          ignore_errors: true  # noqa: ignore-errors — rescue diagnostics must not mask the original failure

        # Best-effort: the route must not point at whatever the failure left
        # behind, but a caddy problem must not mask the original failure.
        - name: Leave the stable endpoint in maintenance
          ansible.builtin.include_tasks: tasks/caddy-publish.yaml
          vars:
            caddy_mode: maintenance
            caddy_publish_ignore_errors: true

        - name: Record residency as unknown
          ansible.builtin.copy:
            content: "unknown\n"
            dest: "{{ resident_file }}"
            mode: "0644"
          ignore_errors: true  # noqa: ignore-errors — rescue bookkeeping must not mask the original failure

        - name: Collect docker diagnostics on both hosts
          ansible.builtin.command: "docker ps -a --format '{% raw %}{{.Names}} {{.Status}}{% endraw %}'"
          register: docker_diag
          changed_when: false
          ignore_errors: true  # noqa: ignore-errors — rescue diagnostics must not mask the original failure
          delegate_to: "{{ item }}"
          loop: "{{ groups['sparks'] }}"

        - name: Print docker diagnostics
          ansible.builtin.debug:
            msg: "{{ item.item }}: {{ item.stdout_lines | default([]) }}"
          loop: "{{ docker_diag.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Tail start log on spark-1
          ansible.builtin.command: "tail -n 40 {{ start_log }}"
          register: start_log_tail
          changed_when: false
          ignore_errors: true  # noqa: ignore-errors — rescue diagnostics must not mask the original failure
          when: start_log is defined

        - name: Print start log tail
          ansible.builtin.debug:
            var: start_log_tail.stdout_lines
          when: start_log is defined and start_log_tail is defined

        # The maintenance attempt above is best-effort; report what the route
        # is actually doing rather than assuming it worked.
        - name: Probe stable endpoint state
          ansible.builtin.uri:
            url: http://localhost:80/v1/models
            timeout: 5
          register: rescue_route_probe
          failed_when: false

        - name: Fail switch
          ansible.builtin.fail:
            msg: >-
              switch to {{ profile }} failed; the stable endpoint is
              {{ 'in maintenance' if rescue_route_probe.status == 503
                 else 'NOT confirmed in maintenance (status ' ~ rescue_route_probe.status ~ ')' }}
              and the pair may be partially started — run 'task sparks:down' before retrying,
              or 'task sparks:publish PROFILE={{ profile }}' if the model itself came up healthy

      always:
        - name: Remove switch lock
          ansible.builtin.file:
            path: "{{ lock_dir }}"
            state: absent
