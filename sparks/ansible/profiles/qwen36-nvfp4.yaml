---
profile_name: qwen36-nvfp4
served_model_id: qwen3.6-35b
serve_port: 8000
health_url: http://localhost:8000/health
ready_retries: 60
ready_delay: 15

start_driver: compose
compose_file: "{{ playbook_dir }}/../inference/compose.yaml"

# vLLM would otherwise download 22 GB inside the ready gate on a cold cache.
weights_check_command: >-
  find /opt/spark-models -maxdepth 4 -iname '*Qwen3.6-35B*' 2>/dev/null | grep -q .
  || { echo "qwen weights missing; pre-download first: HF_HOME=/opt/spark-models huggingface-cli download nvidia/Qwen3.6-35B-A3B-NVFP4" >&2; exit 1; }

# Qwen emits long reasoning traces; assert identity and clean completion, not
# content (a tight token budget truncates mid-thought and returns empty text).
smoke_command: |
  set -eu
  body='{"model":"qwen3.6-35b","messages":[{"role":"user","content":"Reply with the single word ready."}],"temperature":0,"max_tokens":2048}'
  RESPONSE=$(curl -fsS --connect-timeout 5 --max-time 180 http://localhost:8000/v1/chat/completions \
    -H 'Content-Type: application/json' -d "$body")
  export RESPONSE
  python3 - <<'PY'
  import json
  import os
  d = json.loads(os.environ["RESPONSE"])
  assert d["model"] == "qwen3.6-35b", d["model"]
  assert d["choices"][0]["finish_reason"] in ("stop", "length"), d["choices"][0]["finish_reason"]
  print("smoke ok; completion_tokens=%s" % d["usage"]["completion_tokens"])
  PY
