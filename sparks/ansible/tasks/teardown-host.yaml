---
- name: Remove dspark-guide containers on {{ teardown_host }}
  ansible.builtin.shell: ids=$(docker ps -aq --filter "name=dspark-guide"); [ -n "$ids" ] && docker rm -f $ids || echo "no dspark containers"
  delegate_to: "{{ teardown_host }}"

- name: Stop compose stack on {{ teardown_host }}
  ansible.builtin.shell: if [ -d {{ remote_dir }}/inference ]; then cd {{ remote_dir }}/inference && docker compose down; else echo "no compose stack"; fi
  delegate_to: "{{ teardown_host }}"
