---
- name: Stat local compose file
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../inference/compose.yaml"
  register: compose_stat
  delegate_to: localhost

- name: Assert local compose file exists
  ansible.builtin.assert:
    that:
      - compose_stat.stat.exists
    fail_msg: "missing {{ playbook_dir }}/../inference/compose.yaml"

- name: Verify weights are present
  ansible.builtin.shell: find /opt/spark-models -maxdepth 4 -iname '{{ weights_glob }}' 2>/dev/null | head -1
  register: qwen_weights
  changed_when: false

# vLLM would otherwise download 22 GB inside the ready gate on a cold cache.
- name: Assert weights are present
  ansible.builtin.assert:
    that:
      - qwen_weights.stdout | length > 0
    fail_msg: "qwen weights missing on spark-1; pre-download first: HF_HOME=/opt/spark-models huggingface-cli download nvidia/Qwen3.6-35B-A3B-NVFP4"
