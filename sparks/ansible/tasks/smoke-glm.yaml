---
- name: Run GLM thinking-off coherence smoke
  ansible.builtin.shell: |
    response=$(curl -fsS --connect-timeout 5 --max-time 180 http://localhost:8888/v1/chat/completions \
      -H 'Content-Type: application/json' \
      -d '{"model":"GLM-5.3-Flash-EXL3","messages":[{"role":"user","content":"Reply with exactly one short sentence stating the capital of France and the value of 7 times 8."}],"temperature":0,"max_tokens":64,"chat_template_kwargs":{"enable_thinking":false}}')
    printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); m=d["choices"][0]["message"]; expected="The capital of France is Paris, and 7 times 8 is 56."; assert d["model"]=="GLM-5.3-Flash-EXL3"; assert m.get("reasoning") in (None, ""); assert m["content"].strip()==expected, m["content"]; print("coherent thinking-off reply; completion_tokens=%s" % d["usage"]["completion_tokens"])'
  register: glm_smoke
  changed_when: false

- name: Print GLM smoke result
  ansible.builtin.debug:
    var: glm_smoke.stdout
