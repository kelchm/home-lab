---
- name: Ensure inference directory exists
  ansible.builtin.file:
    path: "{{ remote_dir }}/inference"
    state: directory
    owner: kelchm
  become: true

- name: Copy compose file to spark-1
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../inference/compose.yaml"
    dest: "{{ remote_dir }}/inference/compose.yaml"

# Explicit pull is fine here — single-node, no rendezvous to desynchronize.
- name: Pull and start qwen compose stack
  ansible.builtin.shell: cd {{ remote_dir }}/inference && docker compose pull -q && docker compose up -d
