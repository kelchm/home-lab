---
# Qwen emits long reasoning traces; assert identity and clean completion, not
# content (a tight token budget truncates mid-thought and returns empty text).
- name: Run qwen completion smoke
  ansible.builtin.shell: |
    response=$(curl -fsS --connect-timeout 5 --max-time 180 http://localhost:{{ serve_port }}/v1/chat/completions \
      -H 'Content-Type: application/json' \
      -d '{"model":"{{ served_model_id }}","messages":[{"role":"user","content":"Reply with the single word ready."}],"temperature":0,"max_tokens":2048}')
    printf '%s' "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["model"]=="{{ served_model_id }}", d["model"]; assert d["choices"][0]["finish_reason"] in ("stop","length"), d["choices"][0]["finish_reason"]; print("qwen smoke ok; completion_tokens=%s" % d["usage"]["completion_tokens"])'
  register: qwen_smoke
  changed_when: false

- name: Print qwen smoke result
  ansible.builtin.debug:
    var: qwen_smoke.stdout
