---
# The pinned guide owns worker-first launch, its health wait, and the post-ready
# DFlash2 shape sweep. Preflight owns every artifact, so all networked staging
# paths are disabled before the async launcher starts.
- name: Start GLM via pinned guide
  ansible.builtin.shell: cd {{ guide_dir }} && SKIP_PULL=1 SKIP_DOWNLOAD=1 SKIP_SYNC=1 ./start.sh > {{ start_log }} 2>&1
  async: 5400
  poll: 0
  register: glm_start

- name: Wait for GLM guide launch and warmup to finish
  ansible.builtin.async_status:
    jid: "{{ glm_start.ansible_job_id }}"
  register: glm_start_result
  until: glm_start_result is finished
  retries: 360
  delay: 15
