# Bootstrap or migrate by hand; subsequent updates are deployed by doco-cd.
name: doco-cd

services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.132.0@sha256:ed22583456c60c88c5cabdb47803aa0ab51284f00d70d5bb63fa56b223fa250a
    container_name: doco-cd
    environment:
      TZ: America/New_York
      HTTP_PORT: "8080"
      SELF_UPDATE_ENABLED: "true"
      SELF_UPDATE_STRATEGY: applier
      DEPLOY_CONFIG_BASE_DIR: sparks/monitoring
      POLL_CONFIG: |
        - url: https://github.com/kelchm/home-lab.git
          reference: main
          interval: 3m
        - url: https://github.com/kelchm/home-lab.git
          reference: main
          interval: 3m
          target: ${SPARK_HOST:?}
    ports:
      - 127.0.0.1:9120:9120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/doco-cd:/data
    cap_drop:
      - ALL
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
