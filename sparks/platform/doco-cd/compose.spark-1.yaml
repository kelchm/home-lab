# Apply after compose.yaml on spark-1, using this filename for bootstrap and Git.
# Replaces the base spark-2 poll with spark-1.
services:
  doco-cd:
    environment:
      POLL_CONFIG: |
        - url: https://github.com/kelchm/home-lab.git
          reference: main
          interval: 3m
        - url: https://github.com/kelchm/home-lab.git
          reference: main
          interval: 3m
          target: spark-1
