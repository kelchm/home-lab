# Bootstrap copy on spark-1: compose.override.yaml. Replaces the base spark-2
# poll with spark-1; the self target applies this file under its Git name.
services:
  doco-cd:
    environment:
      POLL_CONFIG: |
        - url: https://github.com/kelchm/home-lab.git
          reference: main
          interval: 3m
        - url: https://github.com/kelchm/home-lab.git
          reference: main
          interval: 3m
          target: spark-1
