global:
  scrape_interval: 15s
  scrape_timeout: 5s
scrape_configs:
  - job_name: spark-node
    scrape_interval: 15s
    scrape_timeout: 5s
    sample_limit: 4000
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          instance: spark-2
          host: spark-2
          platform: dgx_spark
          collector: spark-host-vmagent
  - job_name: spark-gpu
    scrape_interval: 5s
    scrape_timeout: 4s
    sample_limit: 500
    static_configs:
      - targets: ["127.0.0.1:9835"]
        labels:
          instance: spark-2
          host: spark-2
          platform: dgx_spark
          collector: spark-host-vmagent
  - job_name: spark-collector
    scrape_interval: 15s
    scrape_timeout: 3s
    sample_limit: 4000
    static_configs:
      - targets: ["127.0.0.1:8429"]
        labels:
          instance: spark-2
          host: spark-2
          platform: dgx_spark
          collector: spark-host-vmagent
  - job_name: spark-deployer
    scrape_interval: 15s
    scrape_timeout: 3s
    sample_limit: 2000
    static_configs:
      - targets: ["127.0.0.1:9120"]
        labels:
          instance: spark-2
          host: spark-2
          platform: dgx_spark
          collector: spark-host-vmagent
