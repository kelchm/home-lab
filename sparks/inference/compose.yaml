---
# OpenAI-compatible inference endpoint on a single DGX Spark.
#
# Deliberately single-node. Spark's unified memory means GPUDirect RDMA is
# unavailable, so NCCL all-reduce over the ConnectX-7 fabric lands far below
# raw RDMA line rate; two independent servers beat tensor-parallel for any
# model that fits in one node's budget.
services:
  vllm:
    image: vllm/vllm-openai:latest@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
    container_name: vllm-qwen
    restart: unless-stopped
    # Host networking keeps the endpoint off the docker bridge, which the
    # dgx-fabric-isolation nftables guard deliberately blocks from the fabric.
    network_mode: host
    ipc: host
    gpus: all
    environment:
      HF_HOME: /models
    volumes:
      - /opt/spark-models:/models
    command:
      - ${SPARK_MODEL:-nvidia/Qwen3.6-35B-A3B-NVFP4}
      - --served-model-name=${SPARK_SERVED_NAME:-qwen3.6-35b}
      - --host=0.0.0.0
      - --port=${SPARK_PORT:-8000}
      - --max-model-len=${SPARK_MAX_LEN:-131072}
      # Unified memory reports no dedicated VRAM, so this fraction is taken
      # against all 121 GiB of system memory - not a GPU-only pool.
      - --gpu-memory-utilization=${SPARK_GPU_UTIL:-0.75}
      # opencode has no text fallback: if the server does not emit structured
      # tool_calls it renders the XML as prose and stops.
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --reasoning-parser=qwen3
      - --enable-prefix-caching
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${SPARK_PORT:-8000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m
