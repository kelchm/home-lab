# Small repeatable native SparkRun sweep. Mixed-arrival behavior is checked separately.
# Pass the served model's tokenizer with -b tokenizer=<snapshot>.
framework: llama-benchy
timeout: 1800
args:
  prefix_caching: false
  depth: [0]
  pp: [2048, 32768]
  tg: [256]
  concurrency: [1, 4]
  runs: 2
  no_cache: true
  extra_body: temperature=0,seed=20260930
