  drafter_revision: bf582e4eacc1810f76656d1811693ff6c6737d2a
  entrypoint: /usr/local/bin/tensorfold-entrypoint
env:
  NCCL_PASSTHROUGH: '1'
  NCCL_MIN_NCHANNELS: '4'
  NCCL_MAX_NCHANNELS: '4'
  TENSORFOLD_NO_UPDATE_CHECK: '1'
  # Stops the caching allocator's GPU memory ratcheting up under long agent use (kit #143, PR #189). The engine sets this for Qwen, not GLM.
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  # v1.9+ launcher default; the engine's own default is 0.
  TENSORFOLD_NUCLEUS_UNION: '1'
  # Published TP2/C4 reserve; this profile trades site headroom for pool capacity.
  TENSORFOLD_MEMORY_RESERVE_GIB: '14.5'
  TF_GLM_CACHE_GIB: '12.5'
  TF_GLM_KV: fp8
  # Explicit upstream defaults: no display pool and no admission cap.
  TF_GLM_DISPLAY_KV_MIB: '0'
  TF_GLM_DISPLAY_KV_BACKEND: drm
  TF_GLM_MAX_QUEUED: ''
  TF_GLM_MTP: auto
  TF_GLM_DENSE: q4
  TF_GLM_COMM: roce
  TF_ROCE_MAX_KB: '512'
  # v1.6+ launcher default: allow a late peer five minutes before failing the round.
  TF_ROCE_WAIT_S: '300'
  TF_GLM_COPY_DRAFTS: '1'
  TF_GLM_COPY_MAX: '15'
  TF_GLM_DFLASH_POLICY: fnc7:0.3
  TF_GLM_HC_SPLIT: '1'
  TF_GLM_PREFILL_OVERLAP: '2'
  TF_GLM_KDA_CHUNKED: '1'
  TF_GLM_WIDE_GRAPHS: '16'
  TF_GLM_COPY_REPLY_MATCH: '16'
  # Retain idle prefixes instead of relocating the last active stream to row zero.
  TF_GLM_MULTI_LONE: '0'
  TF_GLM_MULTI_WINDOW: '32'
  TF_GLM_MULTI_PREFILL: '1'
  TF_GLM_L2PF: '1'
  TF_GLM_EXL3_LOADS: nc
  TF_GLM_EXL3_DEC_ORDER: '0'
  TF_GLM_SHARED_PREFIX: '1'
  TF_GLM_CACHE_ENTRIES: '32'
  # v1.9/v1.10 options at the launcher's off values: kept-state share, byte cap, per-chat quota, effort line at the tail.
  TF_GLM_CACHE_SHARE_PCT: '0'
  TF_GLM_KEPT_BYTES_GIB: '0'
  TF_GLM_KEEP_PER_CHAT: '0'
  TF_GLM_EFFORT_TAIL: '0'
  # Launcher defaults set explicitly; SparkRun does not invoke start.sh.
  # An empty TF_GLM_MAX_QUEUED queues requests past four streams, as upstream.
  TF_GLM_CLEAR_THINKING: '0'
  TF_GLM_FILL_BUDGET_MS: '200'
  # A fill's chunk is the whole 2,048-row prompt chunk, as the launcher sets it.
  TF_GLM_FILL_ROWS: '2048'
  TF_GLM_FILL_DRAFTS: '1'
  TF_GLM_STREAM_SMOOTH: '1'
  TF_GLM_STREAM_SMOOTH_MS: '400'
  # A streamed reply sends an SSE comment after 15 s without data.
  TENSORFOLD_SSE_KEEPALIVE_S: '15'
  # Spill tier off; the launcher's turn count stated for audit.
  TF_GLM_SPILL_QUOTA: '0'
  TF_GLM_SPILL_TURNS: '4'
  TF_GLM_PREFIX_WAIT: '0'
  # Picture budget MAX_IMAGES x IMAGE_TOKENS, so a new picture never resizes earlier ones; the workspace holds its rows.
  TENSORFOLD_GLM_REQUEST_IMAGE_TOKENS: '102400'
  TENSORFOLD_VISION_WORKSPACE_MIB: '1440'
  # Engine defaults the launcher leaves unset, stated for audit.
  TF_GLM_LOOP_GUARD: '0'
  TF_GLM_KEEP_REASONING: '1024'
  TF_GLM_KEEP_REASONING_MB: '32'
  TENSORFOLD_GLM_IMAGE_TOKENS: '2048'
  TENSORFOLD_GLM_VIDEO_TOKENS: '16384'
  TENSORFOLD_GLM_VIDEO_FRAMES: '128'
  TENSORFOLD_GLM_MAX_IMAGES: '50'
  TENSORFOLD_GLM_MAX_VIDEOS: '4'
  TENSORFOLD_GLM_REQUEST_VIDEO_TOKENS: '32768'
