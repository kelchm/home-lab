  - /home/kelchm/sparkrun/mia-glm-ca855766/overlay/patch_glm5_drafter_group.py:/opt/glm53/patch_glm5_drafter_group.py:ro
  - /home/kelchm/sparkrun/mia-glm-ca855766/overlay/patch_hybrid_prefix_hit.py:/opt/glm53/patch_hybrid_prefix_hit.py:ro
  - /home/kelchm/sparkrun/mia-glm-ca855766/overlay/patch_apc_per_group_retention.py:/opt/glm53/patch_apc_per_group_retention.py:ro
  - /home/kelchm/sparkrun/mia-glm-ca855766/overlay/patch_apc_no_store.py:/opt/glm53/patch_apc_no_store.py:ro
  - /home/kelchm/sparkrun/mia-glm-ca855766/overlay/patch_kv_capacity_log.py:/opt/glm53/patch_kv_capacity_log.py:ro
  - /home/kelchm/sparkrun/mia-glm-ca855766/overlay/patch_tool_choice_none.py:/opt/glm53/patch_tool_choice_none.py:ro
  - /home/kelchm/sparkrun/mia-glm-ca855766/overlay/patch_xgrammar_termination.py:/opt/glm53/patch_xgrammar_termination.py:ro
  - /home/kelchm/sparkrun/mia-glm-ca855766/overlay/patch_kpool_tail_slotmap.py:/opt/glm53/patch_kpool_tail_slotmap.py:ro
