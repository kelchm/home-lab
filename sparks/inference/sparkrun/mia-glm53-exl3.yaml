recipe_version: '2'
model: /opt/sparkrun/models/glm53-exl3
runtime: vllm
container: ghcr.io/miaai-lab/glm-5.3-flash-2x-dgx-sparks@sha256:447114ee77d14c9b4732ee23978ada2a0ee9027868a231d6fd42700a8b25be1d
min_nodes: 2
max_nodes: 2
metadata:
  description: GLM-5.3-Flash EXL3/TR3 4 bpw with DFlash2 k=7 on two DGX Sparks
  model_vram: 164.0
  kv_dtype: fp8_ds_mla
  kv_vram_per_token: 7.331371307373047e-06
  kv_lora_rank: 512
  overlay_source_revision: ca8557665bffa6529758f2c330ba8fb44c1e801a
defaults:
  port: 8888
  host: 0.0.0.0
  served_model_name: GLM-5.3-Flash-EXL3
  tensor_parallel: 2
  pipeline_parallel: 1
  distributed_executor_backend: mp
  gpu_memory_utilization: 0.85
  max_model_len: 850000
  max_num_seqs: 4
  max_num_batched_tokens: 7168
  quantization: exl3
  load_format: instanttensor
  kv_cache_dtype: fp8
  local_speculative_config: '{"method":"dflash","model":"/opt/sparkrun/models/glm53-dflash2","num_speculative_tokens":7,"kv_cache_dtype":"auto","draft_tensor_parallel_size":2,"draft_sample_method":"probabilistic","rejection_sample_method":"standard"}'
env:
  EXL3_FUSED_MOE: '1'
  EXL3_MOE_ROW_TILE: '0'
  EXL3_TEMP_ROWS_FUSED: '32'
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_DISABLE_VERSION_CHECK: '1'
  GLM53_MIXED_PREFILL_CHUNK: skip
  GLM53_SUPPRESS_STOPS_IN_REASONING: '1'
  NCCL_CROSS_NIC: '0'
  NCCL_CUMEM_ENABLE: '0'
  NCCL_IB_MERGE_NICS: '0'
  NCCL_NET_PLUGIN: none
  NCCL_NVLS_ENABLE: '0'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  TORCH_CUDA_ARCH_LIST: 12.1a
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: '0'
  VLLM_NO_USAGE_STATS: '1'
  DO_NOT_TRACK: '1'
  EXL3_FAT_GROUPED: '1'
  EXL3_FAT_KERNEL: '1'
  GLM53_INDEXER_WORKSPACE: rightsize
  GLM53_APC_NO_STORE: '1'
  GLM53_KV_CAPACITY_LOG: '1'
  ABLIT: '0'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  NCCL_DEBUG: INFO
  DEFAULT_MAX_NEW_TOKENS: '65536'
  NCCL_MIN_NCHANNELS: '8'
  NCCL_MAX_NCHANNELS: '8'
