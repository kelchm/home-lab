metadata:
  profile: qwen38fn-fp4local-tp2-tf-v1.1.2-nvidia-262k-cache
  description: Upstream TensorFold v1.1.2 serving NVIDIA's FP4-Local weights on two ranks, a 262,144-token window and a 16 GiB prompt cache with no MTP drafts, four lanes
