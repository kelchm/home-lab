# The serving deployment's native endpoint. Update the labels when the model
# or runtime changes; they describe the deployment, not the node.
- job_name: spark-inference
  scrape_interval: 1s
  scrape_timeout: 800ms
  static_configs:
    - targets: ["127.0.0.1:8888"]
      labels:
        deployment: spark-glm53-tp2
        model: GLM-5.3-Flash-EXL3
        runtime: tensorfold
        backend: cuda
        tp: "2"
  metric_relabel_configs:
    - source_labels: [__name__]
      regex: "(tensorfold|tensorfold_health):.*"
      action: keep
