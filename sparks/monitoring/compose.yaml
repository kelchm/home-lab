# Host and collector metrics, and the journal, for one Spark. Identical on every Spark: node
# identity comes from the host's ingestion token, not from this file.
name: monitoring

x-service: &service
  network_mode: host
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  node-exporter:
    <<: *service
    image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    user: "65534:65534"
    pid: host
    command:
      - --web.listen-address=127.0.0.1:9100
      - --path.rootfs=/host
      # This collector never returns on a Spark and stalls the whole scrape.
      - --no-collector.cpufreq
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - textfile:/textfile:ro
    mem_limit: 128m

  smartctl-exporter:
    <<: *service
    image: quay.io/prometheuscommunity/smartctl-exporter:v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
    user: "0:0"
    # NVMe admin-log ioctls require SYS_ADMIN even on a read-only device.
    cap_add: [SYS_ADMIN]
    devices:
      - /dev/nvme0:/dev/nvme0:r
    command:
      - --web.listen-address=127.0.0.1:9633
      - --smartctl.device=/dev/nvme0;nvme
      - --smartctl.interval=60s
    mem_limit: 128m

  # Counts this host's pending apt upgrades for node-exporter's textfile collector. Its
  # image must stay on the host's release (Ubuntu 24.04) so apt reads the host's state the way
  # the host does.
  apt-metrics:
    <<: *service
    image: docker.io/library/ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    # Root without capabilities, to write the root-owned textfile volume.
    user: "0:0"
    entrypoint: ["/bin/sh", "/usr/local/bin/apt-metrics"]
    volumes:
      - ./apt-metrics.sh:/usr/local/bin/apt-metrics:ro
      - /etc/apt:/etc/apt:ro
      - /var/lib/apt:/var/lib/apt:ro
      - /var/lib/dpkg:/var/lib/dpkg:ro
      - /etc/machine-id:/etc/machine-id:ro
      - textfile:/textfile
    tmpfs:
      - /tmp
    mem_limit: 128m

  # NVIDIA's apt configuration turns the daily package-list refresh off, which would leave
  # apt-metrics counting against old lists. This copies in a later file that turns the refresh
  # back on; unattended upgrades stay off. Remove /etc/apt/apt.conf.d/zz-monitoring-apt-refresh
  # by hand if this service is retired.
  apt-list-refresh:
    <<: *service
    image: docker.io/library/ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    user: "0:0"
    restart: "no"
    labels:
      cd.doco.deployment.one_shot: "true"
    command: ["cp", "/src/zz-monitoring-apt-refresh", "/dst/zz-monitoring-apt-refresh"]
    volumes:
      - ./apt/zz-monitoring-apt-refresh:/src/zz-monitoring-apt-refresh:ro
      - /etc/apt/apt.conf.d:/dst

  vmagent:
    <<: *service
    image: docker.io/victoriametrics/vmagent:v1.155.0@sha256:8e3c03905be15bba8312d4868e8ae6f9fc2fefee0a41d544472034249ca42bb4
    command:
      - -httpListenAddr=127.0.0.1:8429
      - -promscrape.config=/etc/vmagent/scrape.yaml
      - -remoteWrite.url=https://metrics-ingest.home.kelch.io/api/v1/write
      - -remoteWrite.bearerTokenFile=/etc/monitoring/token
      - -remoteWrite.tmpDataPath=/queue
      - -remoteWrite.maxDiskUsagePerURL=1GiB
    volumes:
      - ./scrape.yaml:/etc/vmagent/scrape.yaml:ro
      - /etc/monitoring:/etc/monitoring:ro
      # Read to find the serving container and its SparkRun labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - queue:/queue
    mem_limit: 256m
    stop_grace_period: 30s

  # Sends this host's journal to VictoriaLogs; see logs/fluent-bit.yaml.
  fluent-bit:
    <<: *service
    image: docker.io/fluent/fluent-bit:5.1.5@sha256:2740f387f6e68fab66d28e4fa6a853387b9cab6ffb4cb78958f69bba4eb0e7b4
    # Root without capabilities, to read the root-owned journal and token.
    user: "0:0"
    command: ["-c", "/fluent-bit/etc/fluent-bit.yaml"]
    volumes:
      - ./logs/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - ./logs/host.lua:/fluent-bit/etc/host.lua:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/monitoring:/etc/monitoring:ro
      - logs:/state
    mem_limit: 128m
    stop_grace_period: 40s

volumes:
  logs:
  queue:
  textfile:
