global:
  scrape_interval: 15s
scrape_configs:
  - job_name: spark-node
    static_configs:
      - targets: ["127.0.0.1:9100"]
  - job_name: spark-gpu
    scrape_interval: 5s
    static_configs:
      - targets: ["127.0.0.1:9835"]
  - job_name: spark-vmagent
    static_configs:
      - targets: ["127.0.0.1:8429"]
  - job_name: spark-deployer
    static_configs:
      - targets: ["127.0.0.1:9120"]

  # Whatever SparkRun is serving. The target exists only while a SparkRun
  # container runs, and its identity comes from the labels SparkRun sets, so a
  # model or runtime swap needs no change here. 8888 is the serving port every
  # recipe uses.
  - job_name: spark-inference
    scrape_interval: 1s
    scrape_timeout: 800ms
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        filters:
          - name: label
            values: ["sparkrun.runtime"]
    relabel_configs:
      # Only the head rank serves HTTP; single-node runs carry no rank.
      - source_labels: [__meta_docker_container_label_sparkrun_rank]
        regex: "0|"
        action: keep
      - target_label: __address__
        replacement: 127.0.0.1:8888
      - source_labels: [__meta_docker_container_label_sparkrun_served_model_name]
        target_label: model
      - source_labels: [__meta_docker_container_label_sparkrun_runtime]
        target_label: runtime
      - source_labels: [__meta_docker_container_label_sparkrun_recipe]
        regex: "(?:.*/)?([^/]+?)(?:\\.ya?ml)?"
        target_label: recipe

  # sparkDash, on the Spark that runs it. The address comes from its container
  # label, so a Spark without the container has no target. Only what no other
  # collector reports is kept. `unit` names the Spark a sample describes;
  # `instance` is the Spark that scraped it.
  - job_name: spark-sparkdash
    authorization:
      credentials_file: /etc/sparkdash/token
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        filters:
          - name: label
            values: ["homelab.kelch.io/metrics-address"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_homelab_kelch_io_metrics_address]
        target_label: __address__
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: sparkdash_(up|gpu_memory_used_bytes|collector_last_success_timestamp_seconds)
        action: keep
      - regex: unit_name|kind|role
        action: labeldrop
