# Applied by hand on each PVE node: docker compose up -d
name: doco-cd

services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.125.1@sha256:38198abbda1b55da7a7f37a7924b2ccdcc0583bd24466b7c2103ef6cd2ffc828
    container_name: doco-cd
    # The daemon runs without bridge networking on a hypervisor.
    network_mode: host
    environment:
      TZ: America/New_York
      HTTP_PORT: "8080"
      DEPLOY_CONFIG_BASE_DIR: proxmox/monitoring
      POLL_CONFIG: |
        - url: https://github.com/kelchm/home-lab.git
          reference: main
          interval: 3m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/doco-cd:/data
    cap_drop:
      - ALL
    # Docker's default AppArmor profile denies Unix sockets on PVE's kernel, so
    # the deployer could not open the Docker socket it is mounted with.
    security_opt:
      - apparmor=unconfined
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
