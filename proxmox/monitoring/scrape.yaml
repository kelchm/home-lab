global:
  scrape_interval: 15s
scrape_configs:
  - job_name: pve-node
    static_configs:
      - targets: ["127.0.0.1:9100"]
  - job_name: pve-smartctl
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ["127.0.0.1:9633"]
  - job_name: pve-vmagent
    static_configs:
      - targets: ["127.0.0.1:8429"]
  - job_name: pve-deployer
    static_configs:
      - targets: ["127.0.0.1:9120"]
  - job_name: pve-fluent-bit
    metrics_path: /api/v2/metrics/prometheus
    static_configs:
      - targets: ["127.0.0.1:2020"]
