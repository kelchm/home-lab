#cloud-config

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - qemu-guest-agent

write_files:
  - path: /usr/local/sbin/vonk-controller-bootstrap
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
      chmod 0644 /etc/apt/keyrings/docker.asc
      cat > /etc/apt/sources.list.d/docker.sources <<'EOF'
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: trixie
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc
      EOF
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install --yes docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker.service
      install -d -o kelchm -g kelchm -m 0700 /srv/vonk

runcmd:
  - [/usr/local/sbin/vonk-controller-bootstrap]
  - [systemctl, enable, --now, qemu-guest-agent.service]

final_message: "Vonk controller host ready; application installation is a separate step."
