---
services:
  hermes:
    image: nousresearch/hermes-agent:v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    shm_size: 1gb
    stop_grace_period: 60s
    volumes:
      - /srv/hermes:/opt/data
      - ./managed:/etc/hermes-managed:ro
    environment:
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 127.0.0.1
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_PUBLIC_URL: https://hermes.home.kelch.io
      API_SERVER_HOST: 127.0.0.1
      HERMES_MANAGED_DIR: /etc/hermes-managed
    command: ["gateway", "run"]
