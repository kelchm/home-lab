model:
  provider: custom
  default: spark
  base_url: http://10.32.21.31:8888/v1
  api_mode: chat_completions
agent:
  reasoning_effort: xhigh
tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5
dashboard:
  theme: mono
  oauth:
    provider: self-hosted
    self_hosted:
      issuer: https://auth.home.kelch.io/oauth2/openid/hermes
      client_id: hermes
      scopes: openid profile email
  public_url: https://hermes.home.kelch.io
  font: jetbrains-mono
timezone: America/New_York
gateway:
  streaming:
    enabled: true
    transport: auto
onboarding:
  seen:
    busy_input_prompt: true
_config_version: 51
mcp_servers:
  mcphub_hacker_news:
    url: https://mcphub.home.kelch.io/mcp/hacker-news
    headers:
      Authorization: Bearer ${MCPHUB_HERMES_PERSONAL_TOKEN}
    enabled: true
    connect_timeout: 30
    timeout: 120
    trust: untrusted
platforms:
  telegram:
    extra:
      dm_topics:
        - chat_id: ${TELEGRAM_HOME_CHANNEL}
          topics:
            - name: General
              thread_id: 157
              icon_custom_emoji_id: '5417915203100613993'
            - name: News & HN
              thread_id: 159
              icon_custom_emoji_id: '5434144690511290129'
              skill: hacker-news
            - name: AI & Research
              thread_id: 161
              icon_custom_emoji_id: '5237889595894414384'
            - name: Hermes Config
              thread_id: 117
              icon_custom_emoji_id: '5309832892262654231'
            - name: Homelab
              thread_id: 135
              icon_custom_emoji_id: '5312486108309757006'
              skill: homelab-cluster-triage
    enabled: true

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
