---
_config_version: 39

model:
  provider: custom
  default: deepseek-v4-flash-dspark
  base_url: http://10.32.21.31:8888/v1
  api_key: none

tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5

dashboard:
  public_url: https://hermes.home.kelch.io
  oauth:
    provider: self-hosted
    self_hosted:
      issuer: https://auth.home.kelch.io/oauth2/openid/hermes
      client_id: hermes
      scopes: openid profile email

mcp_servers:
  homelab:
    url: https://metamcp.home.kelch.io/metamcp/default/mcp
    headers:
      X-API-Key: "${METAMCP_API_KEY}"
    enabled: false
    connect_timeout: 30
    timeout: 120
    trust: full
