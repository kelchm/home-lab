---
_config_version: 39
timezone: America/New_York

model:
  provider: custom
  default: deepseek-v4-flash-dspark
  base_url: http://10.32.21.31:8888/v1
  api_key: none

agent:
  reasoning_effort: xhigh

gateway:
  streaming:
    enabled: true
    transport: auto

custom_providers:
  - name: 10.32.21.31:8888
    base_url: http://10.32.21.31:8888/v1
    model: deepseek-v4-flash-dspark
    models:
      deepseek-v4-flash-dspark: {}
    models_discovered: true

tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5

dashboard:
  theme: mono
  font: jetbrains-mono
  public_url: https://hermes.home.kelch.io
  oauth:
    provider: self-hosted
    self_hosted:
      issuer: https://auth.home.kelch.io/oauth2/openid/hermes
      client_id: hermes
      scopes: openid profile email

mcp_servers:
  metamcp:
    url: https://metamcp.home.kelch.io/metamcp/hermes/mcp
    headers:
      X-API-Key: "${METAMCP_HERMES_API_KEY}"
    enabled: true
    connect_timeout: 30
    timeout: 120
    trust: full
  mcphub_hacker_news:
    url: https://mcphub.home.kelch.io/mcp/hacker-news
    headers:
      Authorization: "Bearer ${MCPHUB_HERMES_PERSONAL_TOKEN}"
    enabled: true
    connect_timeout: 30
    timeout: 120
    trust: untrusted

onboarding:
  seen:
    busy_input_prompt: true
