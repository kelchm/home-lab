name: doco-cd

services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.123.0@sha256:11b474122ed530614cbe4cb8390f94b646d3fc8ba40d74c0f0b7f55a8ca719f8
    container_name: doco-cd
    environment:
      TZ: America/New_York
      # Athena's 4.4 kernel predates ip_unprivileged_port_start, so cap_drop ALL cannot bind :80.
      HTTP_PORT: "8080"
      DEPLOY_CONFIG_BASE_DIR: synology
      # NAS-scoped age key for synology/**/*.sops.env; the cluster key never comes here.
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key
      POLL_CONFIG: |
        - url: https://github.com/kelchm/home-lab.git
          reference: main
          interval: 3m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker/doco-cd/data:/data
      - /volume1/docker/doco-cd/sops_age_key:/run/secrets/sops_age_key:ro
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
