# Host, disk, RAID and UPS metrics for Athena, and its journal. Identity comes from
# the ingestion token, not from this file. Every listener binds 127.0.0.1; SNMP is DSM's own
# snmpd, which DSM always runs on loopback with a built-in read-only community.
name: monitoring

x-service: &service
  network_mode: host
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-after-publish: &after-publish
  depends_on:
    publish:
      condition: service_completed_successfully

services:
  node-exporter:
    <<: *service
    image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    user: "65534:65534"
    pid: host
    command:
      - --web.listen-address=127.0.0.1:9100
      - --path.rootfs=/host
      # Container Manager re-mounts every share under all_shares.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|tmp|volume1/@appdata/ContainerManager/all_shares|volume1/@docker|volume1/[^/]+/#snapshot)($|/)
      - --collector.netdev.device-exclude=^(docker.*|sit0|ovs-system)$
      - --collector.netclass.ignored-devices=^(docker.*|sit0|ovs-system)$
    volumes:
      # DSM's root is not a shared mount, so Docker refuses rslave.
      - /:/host:ro
    mem_limit: 128m

  snmp-exporter:
    <<: [*service, *after-publish]
    image: quay.io/prometheus/snmp-exporter:v0.31.0@sha256:e5f1aba929145cea2a3bad89c29959efaec0dc26fb87e3761414616a1a392c1c
    user: "65534:65534"
    command:
      - --web.listen-address=127.0.0.1:9116
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.file=/config/snmp.yml
    volumes:
      - /volume1/docker/monitoring/config:/config:ro
    mem_limit: 64m

  vmagent:
    <<: [*service, *after-publish]
    image: docker.io/victoriametrics/vmagent:v1.155.0@sha256:8e3c03905be15bba8312d4868e8ae6f9fc2fefee0a41d544472034249ca42bb4
    command:
      - -httpListenAddr=127.0.0.1:8429
      - -promscrape.config=/config/scrape.yaml
      - -promscrape.configCheckInterval=1m
      - -remoteWrite.url=https://metrics-ingest.home.kelch.io/api/v1/write
      - -remoteWrite.bearerTokenFile=/token
      - -remoteWrite.tmpDataPath=/queue
      - -remoteWrite.maxDiskUsagePerURL=1GiB
    volumes:
      - /volume1/docker/monitoring/config:/config:ro
      - /volume1/docker/monitoring/token:/token:ro
      - /volume1/docker/monitoring/queue:/queue
    mem_limit: 256m
    stop_grace_period: 30s

  # Sends this host's journal to VictoriaLogs; see logs/fluent-bit.yaml. config/ is mounted
  # whole because publish replaces its files, which a bind of one file would not follow.
  fluent-bit:
    <<: [*service, *after-publish]
    image: docker.io/fluent/fluent-bit:5.1.5@sha256:2740f387f6e68fab66d28e4fa6a853387b9cab6ffb4cb78958f69bba4eb0e7b4
    # Root without capabilities reads the root-only token as its owner, and the journal as
    # its owner or through DSM's log group.
    user: "0:19"
    command: ["-c", "/fluent-bit/etc/fluent-bit.yaml"]
    volumes:
      - /volume1/docker/monitoring/config:/fluent-bit/etc:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /volume1/docker/monitoring/token:/etc/monitoring/token:ro
      - /volume1/docker/monitoring/logs:/state
    mem_limit: 128m
    stop_grace_period: 40s

  publish:
    image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    command: ["install", "-m", "0644", "/source/scrape.yaml", "/source/snmp.yml", "/source/fluent-bit.yaml", "/source/host.lua", "/config/"]
    labels:
      cd.doco.deployment.one_shot: "true"
    volumes:
      - ./scrape.yaml:/source/scrape.yaml:ro
      - ./snmp.yml:/source/snmp.yml:ro
      - ./logs/fluent-bit.yaml:/source/fluent-bit.yaml:ro
      - ./logs/host.lua:/source/host.lua:ro
      - /volume1/docker/monitoring/config:/config
    restart: "no"
