---

helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true

releases:
  - name: cilium
    namespace: kube-system
    chart: oci://quay.io/cilium/charts/cilium
    version: 1.20.2
    values: ['./templates/values.yaml.gotmpl']
    # Multus goes first: the kubelet cannot create Cilium's conf dir under
    # /etc/cni, which Talos mounts read-only into it, but containerd creates
    # it for the Multus pods. This is the kustomization Flux owns afterwards.
    # The agents' mount retries back off for up to two minutes while that
    # happens, hence the longer wait.
    timeout: 600
    hooks:
      - events: ['presync']
        showlogs: true
        command: kubectl
        args: ['apply', '--server-side', '--force-conflicts', '--kustomize', '../../kubernetes/apps/kube-system/multus/app']

  - name: coredns
    namespace: kube-system
    chart: oci://ghcr.io/coredns/charts/coredns
    version: 1.48.2
    values: ['./templates/values.yaml.gotmpl']
    needs: ['kube-system/cilium']
    # CoreDNS is the first release that needs a pod network. Nodes stay
    # NotReady and tainted node.multus.io/not-ready until Multus publishes
    # 00-multus.conf.
    hooks:
      - events: ['presync']
        showlogs: true
        command: kubectl
        args: ['--namespace', 'kube-system', 'rollout', 'status', 'daemonset/cni-ready-untaint', '--timeout=10m']
      - events: ['presync']
        showlogs: true
        command: kubectl
        args: ['wait', 'nodes', '--all', '--for=condition=Ready', '--timeout=10m']

  - name: spegel
    namespace: kube-system
    chart: oci://ghcr.io/spegel-org/helm-charts/spegel
    version: 0.7.4
    values: ['./templates/values.yaml.gotmpl']
    needs: ['kube-system/coredns']

  - name: cert-manager
    namespace: cert-manager
    chart: oci://quay.io/jetstack/charts/cert-manager
    version: v1.21.2
    values: ['./templates/values.yaml.gotmpl']
    needs: ['kube-system/spegel']

  - name: flux-operator
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.61.0
    values: ['./templates/values.yaml.gotmpl']
    needs: ['cert-manager/cert-manager']

  - name: flux-instance
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.61.0
    values: ['./templates/values.yaml.gotmpl']
    needs: ['flux-system/flux-operator']
