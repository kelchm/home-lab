---
# Scope labels are coarse filters that follow the repository layout: docs/repository-labels.md.
# Platforms: managed environments with their own trees.
- name: platform/devices
  color: "c5def5"
  description: "Standalone appliances not covered by another platform, such as the GLKVM"
  aliases: ["area/devices"]
- name: platform/kubernetes
  color: "c5def5"
  description: "Kubernetes clusters: workloads, cluster resources, Flux, and bootstrap"
  aliases: ["area/kubernetes", "area/bootstrap"]
- name: platform/proxmox
  color: "c5def5"
  description: "Proxmox VE hosts, guests, and host-side services"
  aliases: ["area/proxmox"]
- name: platform/sparks
  color: "c5def5"
  description: "DGX Spark hosts, direct fabric, and inference runtimes"
  aliases: ["area/sparks"]
- name: platform/synology
  color: "c5def5"
  description: "Synology NAS: DSM, storage configuration, and Compose services"
  aliases: ["area/synology"]
- name: platform/talos
  color: "c5def5"
  description: "Talos machine configuration, OS lifecycle, and cluster-node hardware"
  aliases: ["area/talos"]
- name: platform/unifi
  color: "c5def5"
  description: "UniFi controller, gateway, switching, and wireless"
# Areas: domains with their own directories.
- name: area/ai
  color: "bfd4f2"
  description: "Model acquisition and serving, inference qualification, agent services, and MCP"
- name: area/docs
  color: "bfd4f2"
  description: "Documentation in docs/, documentation assets, and READMEs throughout the repository"
- name: area/identity
  color: "bfd4f2"
  description: "Identity services, shared sign-in, SSO integrations, and account/access policy"
- name: area/network
  color: "bfd4f2"
  description: "Connectivity, routing, DNS, ingress, firewall policy, and remote access"
- name: area/observability
  color: "bfd4f2"
  description: "Metrics, logs, dashboards, alerts, probes, and telemetry collection"
- name: area/storage
  color: "bfd4f2"
  description: "Persistence, filesystems, volumes, shares, backups, restore, and data integrity"
- name: area/tooling
  color: "bfd4f2"
  description: "Scripts, tools, tasks, CI, dependency automation, agent instructions, and repository configuration"
  aliases: ["area/mise", "area/github", "area/renovate", "area/scripts", "area/taskfile"]
# Kinds: optional, at most one per issue
- name: kind/bug
  color: "5319e7"
  description: "Something is broken or behaves differently than intended"
- name: kind/deployment
  color: "5319e7"
  description: "Deploy a new application, service, or infrastructure workload"
- name: kind/investigation
  color: "5319e7"
  description: "Resolve a question through research, diagnosis, or evaluation"
# Priority: exactly one per open issue
- name: priority/critical
  color: "5c0000"
  description: "Blocks or silently invalidates other work"
- name: priority/high
  color: "b60205"
  description: "Real risk or recurring pain; do soon"
- name: priority/medium
  color: "fbca04"
  description: "Worthwhile improvement or risk reduction"
- name: priority/low
  color: "0e8a16"
  description: "Nice to have; do opportunistically"
# Renovate Types: set by Renovate (.renovaterc.json5)
- name: renovate/container
  color: "027fa0"
- name: renovate/github-action
  color: "027fa0"
- name: renovate/github-release
  color: "027fa0"
- name: renovate/helm
  color: "027fa0"
# Semantic Types: set by Renovate (.renovaterc.json5)
- name: type/digest
  color: "ffeC19"
- name: type/patch
  color: "ffeC19"
- name: type/minor
  color: "ff9800"
- name: type/major
  color: "f6412d"
# Status
- name: hold
  color: "ee0701"
  description: "Parked on a named blocker or revisit trigger; on a PR, do not merge"
