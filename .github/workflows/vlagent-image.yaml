---
name: Vlagent Image
on:
  workflow_dispatch:
  push:
    paths:
      - containers/vlagent/**
      - .github/workflows/vlagent-image.yaml
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test and publish immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/homelab-vlagent
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx build --platform linux/amd64 --push --metadata-file image-metadata.json \
            --tag "$IMAGE:${GITHUB_SHA}" containers/vlagent
          cat image-metadata.json >> "$GITHUB_STEP_SUMMARY"
