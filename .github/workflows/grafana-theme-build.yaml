---
name: Grafana Theme Build

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

# Token permissions come from the caller: read-only PR qualification, write only on main.
jobs:
  build:
    name: Build and qualify native amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: kubernetes/apps/observability/grafana/image
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install qualification dependencies and test source guards
        run: |
          corepack pnpm install --frozen-lockfile --ignore-scripts
          corepack pnpm test
          corepack pnpm exec playwright install --with-deps chromium
      - name: Set up pinned Buildx and BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # renovate: datasource=github-releases depName=docker/buildx
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Record cold runner capacity
        run: |
          df -h /
          free -h
          docker system df
      - name: Build once without registry credentials
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: kubernetes/apps/observability/grafana/image
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: localhost/grafana-aurora:qualification
          cache-from: type=gha,scope=grafana-aurora-amd64
          cache-to: type=gha,mode=min,scope=grafana-aurora-amd64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Qualify the exact built image with a disposable database
        env:
          IMAGE: ${{ steps.build.outputs.imageid }}
        run: node qualify.mjs "$IMAGE"
      # Publication has no deployment side effect. Only a separate Helm change adopts an image.
      - name: Login after qualification on main
        if: inputs.publish && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the qualified artifact under a unique immutable identity
        if: inputs.publish && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.build.outputs.imageid }}
          REPOSITORY: ${{ github.repository }}
        run: |
          reference="ghcr.io/${REPOSITORY,,}/grafana-aurora:sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          docker tag "$IMAGE" "$reference"
          docker push "$reference"
          docker image inspect "$reference" --format '{{json .RepoDigests}}' > test-results/published-digests.json
          printf '%s\n' "$reference" > test-results/published-tag.txt
      - name: Retain browser evidence and publication identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grafana-theme-${{ github.run_id }}-${{ github.run_attempt }}
          path: kubernetes/apps/observability/grafana/image/test-results
          if-no-files-found: ignore
          retention-days: 30
