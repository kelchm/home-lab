---
name: "Repository Validation"

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  # PR runs cover the complete PR diff; main runs validate every surface. In
  # both cases a newer run therefore subsumes an older run for the same ref.
  cancel-in-progress: true

jobs:
  pre-job:
    name: Determine Validation Scope
    runs-on: ubuntu-latest
    outputs:
      # changed-files only runs for PRs. Its absent outputs intentionally
      # default to true on main so the latest commit is validated as a whole.
      bootstrap_changed: ${{ steps.changed-files.outputs.bootstrap_any_changed || 'true' }}
      docs_changed: ${{ steps.changed-files.outputs.docs_any_changed || 'true' }}
      kubernetes_changed: ${{ steps.changed-files.outputs.kubernetes_any_changed || 'true' }}
      network_changed: ${{ steps.changed-files.outputs.network_any_changed || 'true' }}
      scripts_changed: ${{ steps.changed-files.outputs.scripts_any_changed || 'true' }}
      skills_changed: ${{ steps.changed-files.outputs.skills_any_changed || 'true' }}
      sops_changed: ${{ steps.changed-files.outputs.sops_any_changed || 'true' }}
      talos_changed: ${{ steps.changed-files.outputs.talos_any_changed || 'true' }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Changed Files
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            bootstrap:
              - '.github/workflows/flux-local.yaml'
              - '.mise.toml'
              - '.taskfiles/bootstrap/**'
              - 'Taskfile.yaml'
              - 'bootstrap/**'
            docs:
              - '.github/workflows/flux-local.yaml'
              - '.mise.toml'
              - '**/*.md'
              - 'scripts/ci/validate-docs-index.sh'
            kubernetes:
              - '.github/workflows/flux-local.yaml'
              - '.mise.toml'
              - 'kubernetes/**'
              - 'scripts/ci/validate-alloy-log-paths.sh'
              - 'scripts/ci/test-validate-unsafe-sysctls.sh'
              - 'scripts/ci/validate-unsafe-sysctls.sh'
              - 'talos/patches/global/machine-kubelet.yaml'
            network:
              - '.github/workflows/flux-local.yaml'
              - '.mise.toml'
              - 'network/**'
            scripts:
              - '.github/workflows/flux-local.yaml'
              - '.mise.toml'
              - '.shellcheckrc'
              - '**/*.sh'
            skills:
              - '.github/workflows/flux-local.yaml'
              - '.agents/skills/**'
            sops:
              - '.github/workflows/flux-local.yaml'
              - '.mise.toml'
              - '.sops.yaml'
              - '**/*.sops.yaml'
              - '**/*.sops.yml'
              - 'scripts/ci/validate-sops.sh'
            talos:
              - '.github/workflows/flux-local.yaml'
              - '.mise.toml'
              - '.taskfiles/talos/**'
              - 'Taskfile.yaml'
              - 'talos/**'

      - name: Validate complete main state
        if: github.event_name == 'push'
        run: echo "Every validation surface runs for pushes to main."

  flux-local-test:
    name: Flux Local Test
    needs: pre-job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.pre-job.outputs.kubernetes_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run flux-local test
        if: needs.pre-job.outputs.kubernetes_changed == 'true'
        uses: docker://ghcr.io/allenporter/flux-local:v8.2.0
        with:
          args: test --enable-helm --all-namespaces --path /github/workspace/kubernetes/flux/cluster -v

      - name: No Kubernetes changes
        if: needs.pre-job.outputs.kubernetes_changed != 'true'
        run: echo "Flux Local test is not required."

  flux-local-diff:
    name: Flux Local Diff
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resources: ["helmrelease", "kustomization"]
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Checkout Pull Request Branch
        if: github.event_name == 'pull_request' && needs.pre-job.outputs.kubernetes_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: pull

      - name: Checkout Default Branch
        if: github.event_name == 'pull_request' && needs.pre-job.outputs.kubernetes_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: "${{ github.event.repository.default_branch }}"
          path: default

      - name: Run flux-local diff
        if: github.event_name == 'pull_request' && needs.pre-job.outputs.kubernetes_changed == 'true'
        uses: docker://ghcr.io/allenporter/flux-local:v8.2.0
        with:
          args: >-
            diff ${{ matrix.resources }}
            --unified 6
            --path /github/workspace/pull/kubernetes/flux/cluster
            --path-orig /github/workspace/default/kubernetes/flux/cluster
            --strip-attrs "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"
            --limit-bytes 10000
            --all-namespaces
            --sources "flux-system"
            --output-file diff.patch

      - name: Generate Diff
        id: diff
        if: github.event_name == 'pull_request' && needs.pre-job.outputs.kubernetes_changed == 'true'
        run: |
          cat diff.patch
          {
              echo 'diff<<EOF'
              cat diff.patch
              echo EOF
          } >> "$GITHUB_OUTPUT"
          {
              echo "### Diff"
              echo '```diff'
              cat diff.patch
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add Comment
        if: github.event_name == 'pull_request' && steps.diff.outputs.diff != ''
        continue-on-error: true
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12
        with:
          message-id: "${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resources }}"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

      - name: Diff not required
        if: github.event_name != 'pull_request' || needs.pre-job.outputs.kubernetes_changed != 'true'
        run: echo "Flux Local diff is only produced for Kubernetes pull requests."

  kubernetes:
    name: Kubernetes Static Validation
    needs: pre-job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.pre-job.outputs.kubernetes_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Kubernetes validation tools
        if: needs.pre-job.outputs.kubernetes_changed == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "aqua:fluxcd/flux2 aqua:yannh/kubeconform aqua:mikefarah/yq"

      - name: Render Flux Kustomizations recursively
        if: needs.pre-job.outputs.kubernetes_changed == 'true'
        run: |
          flux build kustomization cluster-apps \
            --path kubernetes/apps \
            --kustomization-file kubernetes/flux/cluster/ks.yaml \
            --recursive \
            --local-sources GitRepository/flux-system/flux-system=. \
            --dry-run > /tmp/flux-render.yaml

      - name: Validate rendered resources
        if: needs.pre-job.outputs.kubernetes_changed == 'true'
        run: >-
          kubeconform
          -strict
          -ignore-missing-schemas
          -kubernetes-version 1.36.0
          -summary
          /tmp/flux-render.yaml

      - name: Validate pod sysctls against Talos
        if: needs.pre-job.outputs.kubernetes_changed == 'true'
        run: |
          scripts/ci/test-validate-unsafe-sysctls.sh
          scripts/ci/validate-unsafe-sysctls.sh

      - name: Validate Alloy pod-log paths
        if: needs.pre-job.outputs.kubernetes_changed == 'true'
        run: scripts/ci/validate-alloy-log-paths.sh

      - name: No Kubernetes changes
        if: needs.pre-job.outputs.kubernetes_changed != 'true'
        run: echo "Kubernetes static validation is not required."

  talos:
    name: Talhelper Configuration Validation
    needs: pre-job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.pre-job.outputs.talos_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install talhelper
        if: needs.pre-job.outputs.talos_changed == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "aqua:budimanjojo/talhelper"

      - name: Validate talhelper configuration
        if: needs.pre-job.outputs.talos_changed == 'true'
        working-directory: talos
        run: talhelper validate talconfig talconfig.yaml

      - name: No Talos changes
        if: needs.pre-job.outputs.talos_changed != 'true'
        run: echo "Talhelper validation is not required."

  bootstrap:
    name: Bootstrap Render Validation
    needs: pre-job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.pre-job.outputs.bootstrap_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bootstrap validation tools
        if: needs.pre-job.outputs.bootstrap_changed == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "aqua:helm/helm aqua:helmfile/helmfile aqua:yannh/kubeconform"

      - name: Render Helmfiles
        if: needs.pre-job.outputs.bootstrap_changed == 'true'
        run: |
          mkdir -p /tmp/helmfile-render
          helmfile --file bootstrap/helmfile.d/00-crds.yaml template --quiet > /tmp/helmfile-render/crds.yaml
          helmfile --file bootstrap/helmfile.d/01-apps.yaml template --quiet > /tmp/helmfile-render/apps.yaml

      - name: Validate rendered resources
        if: needs.pre-job.outputs.bootstrap_changed == 'true'
        run: >-
          kubeconform
          -strict
          -ignore-missing-schemas
          -kubernetes-version 1.36.0
          -summary
          /tmp/helmfile-render/*.yaml

      - name: No bootstrap changes
        if: needs.pre-job.outputs.bootstrap_changed != 'true'
        run: echo "Bootstrap render validation is not required."

  sops:
    name: SOPS Validation
    needs: pre-job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.pre-job.outputs.sops_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SOPS
        if: needs.pre-job.outputs.sops_changed == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "aqua:getsops/sops"

      - name: Validate SOPS encryption
        if: github.event_name == 'pull_request' && needs.pre-job.outputs.sops_changed == 'true'
        run: scripts/ci/validate-sops.sh

      - name: Validate SOPS decryption
        if: github.event_name == 'push' && needs.pre-job.outputs.sops_changed == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/ci/validate-sops.sh --require-decrypt

      - name: No SOPS changes
        if: needs.pre-job.outputs.sops_changed != 'true'
        run: echo "SOPS validation is not required."

  scripts:
    name: Shell Validation
    needs: pre-job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.pre-job.outputs.scripts_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        if: needs.pre-job.outputs.scripts_changed == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "aqua:koalaman/shellcheck"

      - name: Check shell syntax
        if: needs.pre-job.outputs.scripts_changed == 'true'
        run: git ls-files -z -- '*.sh' | xargs -0 -n1 bash -n

      - name: Run ShellCheck
        if: needs.pre-job.outputs.scripts_changed == 'true'
        run: git ls-files -z -- '*.sh' | xargs -0 shellcheck

      - name: No shell changes
        if: needs.pre-job.outputs.scripts_changed != 'true'
        run: echo "Shell validation is not required."

  skills:
    name: Agent Skills Validation
    needs: pre-job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.pre-job.outputs.skills_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: needs.pre-job.outputs.skills_changed == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: false

      - name: Validate Agent Skills
        if: needs.pre-job.outputs.skills_changed == 'true'
        env:
          SKILLS_REF_SOURCE: git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref
        run: |
          mapfile -d '' skill_files < <(
            find .agents/skills -mindepth 2 -maxdepth 2 -name SKILL.md -print0 | sort -z
          )
          if (( ${#skill_files[@]} == 0 )); then
            echo "No Agent Skills found under .agents/skills." >&2
            exit 1
          fi

          for skill_file in "${skill_files[@]}"; do
            uvx --from "$SKILLS_REF_SOURCE" skills-ref validate "${skill_file%/SKILL.md}"
          done

      - name: No skill changes
        if: needs.pre-job.outputs.skills_changed != 'true'
        run: echo "Agent Skills validation is not required."

  network:
    name: Network Artifact Validation
    needs: pre-job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.pre-job.outputs.network_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate synthetic test manifest
        if: needs.pre-job.outputs.network_changed == 'true'
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/workspace:ro"
          ghcr.io/yannh/kubeconform@sha256:5103f6f5e89061728aad4ad5a250627dd0fc9b2a92eb876f3762677a4222f9e0
          -strict
          -kubernetes-version 1.36.0
          -summary
          /workspace/network/unifi/bgp-test.yaml

      - name: Validate FRR configuration
        if: needs.pre-job.outputs.network_changed == 'true'
        run: >-
          docker run --rm
          --entrypoint vtysh
          --volume "${GITHUB_WORKSPACE}:/workspace:ro"
          quay.io/frrouting/frr@sha256:5a3a646db8bc911a996e48d67fc6dfed4c49f8d893c76cc6ef52a620a9ec6312
          -C -f /workspace/network/unifi/frr.conf

      - name: No network changes
        if: needs.pre-job.outputs.network_changed != 'true'
        run: echo "Network artifact validation is not required."

  docs:
    name: Local Markdown Link Validation
    needs: pre-job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.pre-job.outputs.docs_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lychee
        if: needs.pre-job.outputs.docs_changed == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "aqua:lycheeverse/lychee"

      - name: Validate local Markdown links
        if: needs.pre-job.outputs.docs_changed == 'true'
        run: lychee --offline --include-fragments '**/*.md'

      - name: Validate docs index and plan statuses
        if: needs.pre-job.outputs.docs_changed == 'true'
        run: scripts/ci/validate-docs-index.sh

      - name: No documentation changes
        if: needs.pre-job.outputs.docs_changed != 'true'
        run: echo "Markdown link validation is not required."

  flux-local-status:
    name: Flux Local Success
    needs:
      - pre-job
      - flux-local-test
      - flux-local-diff
      - kubernetes
      - talos
      - bootstrap
      - sops
      - scripts
      - skills
      - network
      - docs
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq --exit-status 'all(.[]; . == "success")' <<<"${RESULTS}"
