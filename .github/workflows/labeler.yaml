---
name: "Labeler"

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: "Pull request number to label after a rule change"
        required: true
        type: string
  pull_request_target:
    branches: ["main"]

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yaml
          pr-number: ${{ inputs.pr-number }}
          # Preserve scopes added by hand when the changed paths hide them.
          sync-labels: false
