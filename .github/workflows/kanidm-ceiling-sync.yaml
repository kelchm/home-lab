---
name: "Kanidm Ceiling Sync"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: ["main"]
    paths:
      - "kubernetes/apps/identity/kaniop/app/ocirepository.yaml"
      - "scripts/ci/sync-kanidm-version-ceiling.sh"
      - "scripts/ci/publish-kanidm-version-ceiling.sh"
      - ".github/workflows/kanidm-ceiling-sync.yaml"

# All triggers publish to one branch. Let the active run finish; queued runs
# fetch current main rather than relying on their possibly older event SHA.
concurrency:
  group: kanidm-ceiling-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Kanidm Version Ceiling
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Open or update ceiling sync PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/publish-kanidm-version-ceiling.sh
