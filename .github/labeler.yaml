---
# Labels follow the repository's platform and domain directories.
# Keep this coarse: do not classify individual apps, resources, or dependencies.
platform/devices:
  - changed-files:
      - any-glob-to-any-file:
          - devices/**
platform/kubernetes:
  - changed-files:
      - any-glob-to-any-file:
          - bootstrap/**
          - kubernetes/**
platform/proxmox:
  - changed-files:
      - any-glob-to-any-file:
          - proxmox/**
platform/sparks:
  - changed-files:
      - any-glob-to-any-file:
          - sparks/**
platform/synology:
  - changed-files:
      - any-glob-to-any-file:
          - synology/**
platform/talos:
  - changed-files:
      - any-glob-to-any-file:
          - talos/**
platform/unifi:
  - changed-files:
      - any-glob-to-any-file:
          - network/unifi/**
area/ai:
  - changed-files:
      - any-glob-to-any-file:
          - kubernetes/apps/ai/**
          - sparks/inference/**
area/docs:
  - changed-files:
      - any-glob-to-any-file:
          - assets/**
          - docs/**
          - '**/README.md'
area/identity:
  - changed-files:
      - any-glob-to-any-file:
          - kubernetes/apps/identity/**
area/network:
  - changed-files:
      - any-glob-to-any-file:
          - network/**
          - kubernetes/apps/network/**
area/observability:
  - changed-files:
      - any-glob-to-any-file:
          - kubernetes/apps/observability/**
          - proxmox/monitoring/**
          - sparks/monitoring/**
area/storage:
  - changed-files:
      - any-glob-to-any-file:
          - kubernetes/apps/longhorn-system/**
          - kubernetes/apps/*/storage/**
area/tooling:
  - changed-files:
      - any-glob-to-any-file:
          - ".*"
          - ".*/**"
          - AGENTS.md
          - CLAUDE.md
          - Taskfile.yaml
          - scripts/**
          - tools/**
