---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bambuddy
spec:
  dependsOn:
    - name: cnpg-operator
      namespace: cnpg-system
    - name: kaniop
      namespace: identity
    - name: traefik
      namespace: network
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: bambuddy
      namespace: printing
  interval: 1h
  path: ./kubernetes/apps/printing/bambuddy/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: printing
  wait: false
