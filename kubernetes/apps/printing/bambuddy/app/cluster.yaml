---
# Dedicated PostgreSQL backing store for Bambuddy. Two instances on separate
# nodes: CloudNativePG switches the primary over ahead of a node drain, so each
# instance needs only the default two replicas. Longhorn's recurring backups
# and Bambuddy's portable exports provide DR.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bambuddy-db
spec:
  instances: 2
  primaryUpdateMethod: switchover
  affinity:
    podAntiAffinityType: required
  postgresql:
    parameters:
      # Bounds the WAL a stopped or lagging standby's slot can pin on the primary.
      max_slot_wal_keep_size: 2GB
  storage:
    size: 5Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: bambuddy
      owner: bambuddy
