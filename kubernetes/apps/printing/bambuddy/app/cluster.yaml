---
# Dedicated PostgreSQL backing store for Bambuddy. One instance is sufficient
# for the initial single-printer deployment; WAL archiving, Longhorn's recurring
# backups and Bambuddy's portable exports provide DR without adding synchronous
# replicas.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bambuddy-db
  annotations:
    # A rebuilt cluster recovers from, then archives into, the same archive.
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  storage:
    # Room for about 4 days of unarchived WAL while the backup store is down.
    size: 20Gi
    # New PVCs use this tier; existing volumes require a separate replica-count patch.
    storageClass: longhorn-3replica
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
  # Backups go out over the storage VLAN.
  inheritedMetadata:
    annotations:
      k8s.v1.cni.cncf.io/networks: cnpg-system/storage-network
  postgresql:
    # The storage interface is outside Cilium policy: no logins from that VLAN.
    pg_hba:
      - host all all 10.32.25.0/24 reject
  # Read only when the Cluster is created: a rebuild restores the newest backup.
  bootstrap:
    recovery:
      source: bambuddy-db
      database: bambuddy
      owner: bambuddy
  externalClusters:
    - name: bambuddy-db
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: bambuddy-db
          serverName: bambuddy-db-pg18
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: bambuddy-db
        # One archive per PostgreSQL major: a major upgrade must change this suffix.
        serverName: bambuddy-db-pg18
