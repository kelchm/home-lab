---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dawarich
spec:
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: cnpg-operator
      namespace: cnpg-system
    - name: plugin-barman-cloud
      namespace: cnpg-system
    - name: traefik
      namespace: network
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: dawarich
      namespace: location
  interval: 1h
  path: ./kubernetes/apps/location/dawarich/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: location
  wait: false
