---
# Sole human admin account. Its first credentials were set through the reset
# link kaniop publishes in a Kubernetes Event, before
# docs/runbooks/kanidm-person-accounts.md existed; it has credentials now, so
# kaniop issues no link. Add new people by that runbook instead.
apiVersion: kaniop.rs/v1beta1
kind: KanidmPersonAccount
metadata:
  name: kelchm
spec:
  kanidmRef:
    name: kanidm
  personAttributes:
    displayname: Matthew Kelch
    mail:
      - kelchm@gmail.com
