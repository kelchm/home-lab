---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kaniop
spec:
  dependsOn:
    # The webhook certificate and issuers are cert-manager resources.
    - name: cert-manager
      namespace: cert-manager
    # Provides the ServiceMonitor and PrometheusRule CRDs consumed by the chart.
    - name: prometheus-operator-crds
      namespace: observability
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kaniop
      namespace: identity
  interval: 1h
  path: ./kubernetes/apps/identity/kaniop/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: identity
  wait: true
