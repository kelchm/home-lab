---
# kaniop: cluster-scoped Kanidm operator. Watches Kanidm, KanidmGroup,
# KanidmPersonAccount, KanidmOAuth2Client, KanidmServiceAccount CRDs across
# all namespaces.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kaniop
spec:
  chartRef:
    kind: OCIRepository
    name: kaniop
  interval: 1h
  # Headroom for chart upgrade hooks: the CRD-migration Jobs can run up to ~15m,
  # which would exceed Flux's 5m default timeout and abort the upgrade mid-hook.
  timeout: 30m
  values:
    resources:
      requests:
        cpu: 10m
        memory: 14Mi
      limits:
        cpu: 2
        memory: 256Mi

    # Validating webhook rejects same-name CRs in different namespaces that
    # target the same Kanidm cluster (kanidmRef name+namespace). With per-app
    # KanidmOAuth2Client CRs in `media/<app>/`, this protection is real:
    # without it, a duplicate-named client silently overwrites the original.
    webhook:
      enabled: true
      certManager:
        enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 14Mi
        limits:
          cpu: 2
          memory: 128Mi

    # Metrics integration. The VictoriaMetrics operator converts a
    # ServiceMonitor in any namespace into a VMServiceScrape for vmagent. The
    # grafana sidecar discovers the bundled dashboards via the default
    # `grafana_dashboard=1` label.
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      prometheusRules:
        enabled: true
      dashboards:
        enabled: true

  # Some chart rules aggregate away the source series' `cluster` label, and
  # the chart has no group-label knob. A group label, unlike a per-rule
  # label, leaves vmalert's rule IDs and alert state unchanged.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: PrometheusRule
              name: kaniop
            patch: |
              - op: add
                path: /spec/groups/0/labels
                value:
                  cluster: k8s-prod
