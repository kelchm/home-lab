---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./ocirepository.yaml
- ./secret.sops.yaml
- ./networkpolicy.yaml
- ./terminus.yaml
- ./larapaper.yaml
- ./inker.yaml
- ./byos-next.yaml
- ./byos-fastapi.yaml
- ./byos-django.yaml
- ./byos-phoenix.yaml
- ./node-lite.yaml
configMapGenerator:
- name: trmnl-trial-guards
  files:
  - ./guards/terminus-device-defaults.rb
  - ./guards/next-firmware-guard.cjs
generatorOptions:
  disableNameSuffixHash: true
