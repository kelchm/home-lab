---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: terminus-pg19
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
