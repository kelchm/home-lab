---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: byos-fastapi
spec:
  chartRef:
    kind: OCIRepository
    name: trmnl-trials
  interval: 1h
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        annotations:
          secret.reloader.stakater.com/reload: byos-fastapi-trial
        containers:
          app:
            image:
              repository: ghcr.io/kelchm/trmnl-trial-fastapi
              tag: source-10d16d73f696-build-5c33a6bc26cd@sha256:4bcdf569e36844666e6881c5e86ec75b25ce601c9fe574fcd1dae990aecde7a0
            env:
              TZ: America/New_York
              SERVER_PORT: '4567'
              TIME_ZONE: America/New_York
              LOG_LEVEL: INFO
              FORWARDED_ALLOW_IPS: '*'
            envFrom:
            - secretRef:
                name: byos-fastapi-trial
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4567
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4567
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4567
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 90
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1536Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: main
        ports:
          http:
            port: 4567
    route:
      app:
        hostnames:
        - byos-fastapi.home.kelch.io
        parentRefs:
        - name: gateway-admin
          namespace: network
          sectionName: https
        rules:
        - backendRefs:
          - identifier: app
            port: 4567
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        storageClass: longhorn
        retain: true
        advancedMounts:
          main:
            app:
            - path: /app/var
