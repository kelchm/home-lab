---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: byos-django
spec:
  chartRef:
    kind: OCIRepository
    name: trmnl-trials
  interval: 1h
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        annotations:
          secret.reloader.stakater.com/reload: byos-django-trial
        containers:
          app:
            image:
              repository: ghcr.io/kelchm/trmnl-trial-django
              tag: source-50352c865cc4-build-cb24bf9875e3@sha256:1dda70d1e31743561cfe6f4fbb0b3a5dbb87df08a6dbb8fc90fc961dc55b1f83
            env:
              TZ: America/New_York
              DB_FILE: /data/db.sqlite3
              ALLOWED_HOSTS: byos-django.home.kelch.io,127.0.0.1,localhost
              CSRF_TRUSTED_ORIGINS: https://byos-django.home.kelch.io
              DEBUG: 'false'
              DJANGO_SUPERUSER_USERNAME: trial
              DJANGO_SUPERUSER_EMAIL: trial@localhost
            envFrom:
            - secretRef:
                name: byos-django-trial
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 90
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1536Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: main
        ports:
          http:
            port: 8000
    route:
      app:
        hostnames:
        - byos-django.home.kelch.io
        parentRefs:
        - name: gateway-admin
          namespace: network
          sectionName: https
        rules:
        - backendRefs:
          - identifier: app
            port: 8000
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        storageClass: longhorn
        retain: true
        advancedMounts:
          main:
            app:
            - path: /data
