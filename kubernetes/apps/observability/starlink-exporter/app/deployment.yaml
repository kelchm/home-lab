---
# Read-only view of the Starlink dish (WAN2) through its local gRPC API:
# ping drop and latency to the point of presence, obstruction, throughput,
# power and the dish's own alerts. The API needs no credential.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starlink-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: starlink-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: starlink-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/joshuasing/starlink_exporter:0.9.2@sha256:5ac76161537b9736eb63f51f6466424432d759985fa12bee5880083f968508c9
          args: ["-dish", "192.168.100.1:9200", "-listen", ":9451"]
          ports:
            - name: metrics
              containerPort: 9451
          # The landing page checks the process only; starlink_dish_up reports
          # whether the dish answers.
          readinessProbe:
            httpGet:
              path: /
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: starlink-exporter
spec:
  selector:
    app.kubernetes.io/name: starlink-exporter
  ports:
    - name: metrics
      port: 9451
      targetPort: metrics
