---
# VictoriaMetrics vmui — VM's built-in query browser. Genuinely nicer
# than Prometheus's native expr browser; an actual axis of comparison
# in the bake-off.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmsingle
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Observability
    gethomepage.dev/name: VictoriaMetrics
    gethomepage.dev/icon: victoriametrics.svg
    gethomepage.dev/description: Metrics query UI
    gethomepage.dev/weight: "30"
spec:
  hostnames: ["vm.home.kelch.io"]
  parentRefs:
    - name: gateway-admin
      namespace: network
      sectionName: https
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: kanidm-oidc
      backendRefs:
        - name: vmsingle-victoria-metrics-k8s-stack
          port: 8428
---
# vmagent UI — exposes /targets, ingestion stats, and (the defensive
# selling point) persistent queue depth.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmagent
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Observability
    gethomepage.dev/name: vmagent
    gethomepage.dev/icon: victoriametrics.svg
    gethomepage.dev/description: Scrape targets
    gethomepage.dev/weight: "60"
spec:
  hostnames: ["vmagent.home.kelch.io"]
  parentRefs:
    - name: gateway-admin
      namespace: network
      sectionName: https
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: kanidm-oidc
      backendRefs:
        - name: vmagent-victoria-metrics-k8s-stack
          port: 8429
---
# vmalert UI — rule groups, evaluation results, firing alerts.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmalert
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Observability
    gethomepage.dev/name: vmalert
    gethomepage.dev/icon: victoriametrics.svg
    gethomepage.dev/description: Alerting rules
    gethomepage.dev/weight: "50"
spec:
  hostnames: ["vmalert.home.kelch.io"]
  parentRefs:
    - name: gateway-admin
      namespace: network
      sectionName: https
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: kanidm-oidc
      backendRefs:
        - name: vmalert-victoria-metrics-k8s-stack
          port: 8080
---
# VMAlertmanager is the notification authority and the durable UI target.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Use a new object identity for the Flux Kustomization handoff so pruning
  # the old KPS-owned HTTPRoute cannot delete this route after it is applied.
  name: vmalertmanager
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Observability
    gethomepage.dev/name: Alertmanager
    gethomepage.dev/icon: alertmanager.svg
    gethomepage.dev/description: Alert routing and silences
    gethomepage.dev/weight: "20"
    gethomepage.dev/widget.type: customapi
    gethomepage.dev/widget.url: http://vmalertmanager-victoria-metrics-k8s-stack.observability.svc.cluster.local:9093/api/v2/alerts?active=true&silenced=false&inhibited=false&filter=severity%3D~%22warning%7Ccritical%22
    gethomepage.dev/widget.mappings.0.label: Warning / critical
    gethomepage.dev/widget.mappings.0.format: size
spec:
  hostnames: ["alertmanager.home.kelch.io"]
  parentRefs:
    - name: gateway-admin
      namespace: network
      sectionName: https
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: kanidm-oidc
      backendRefs:
        - name: vmalertmanager-victoria-metrics-k8s-stack
          port: 9093
