---
# Shared cluster rules are owned with the surviving VictoriaMetrics stack.
# Signals that are specific to this cluster's delivery, GitOps, certificate,
# and pod-object failure modes. Generic node/filesystem/PVC capacity and
# CrashLoopBackOff alerts remain owned by the VM chart's bundled
# kubernetes-mixin rules; Longhorn capacity and backup rules live with the
# Longhorn deployment.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  # New identity avoids a cross-Kustomization prune race with the KPS copy.
  name: vm-platform-operations
spec:
  groups:
    - name: flux-reconciliation
      rules:
        - alert: FluxReconciliationFailed
          expr: flux_resource_info{kind=~"Kustomization|HelmRelease",ready="False",suspended="False"} == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is failing
            description: Flux has reported this unsuspended resource Ready=False for 10 minutes (reason={{ $labels.reason }}). Inspect the resource conditions and controller logs before retrying reconciliation.

        - alert: FluxReconciliationStalled
          expr: flux_resource_info{kind=~"Kustomization|HelmRelease",ready="Unknown",suspended="False"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is stalled
            description: Flux has reported this unsuspended resource Ready=Unknown for 30 minutes (reason={{ $labels.reason }}). Check dependencies, source readiness, and reconciliation progress.

        - alert: FluxResourceMetricsMissing
          expr: absent(flux_resource_info{kind=~"Kustomization|HelmRelease"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Flux resource health metrics are missing
            description: flux_resource_info has been absent for 15 minutes, so reconciliation failures cannot be detected. Check the Flux Operator ServiceMonitor and scrape target.

    - name: certificate-lifecycle
      rules:
        # Public certificates now have a roughly 160-hour lifetime. A fixed
        # 14-day threshold would therefore be permanently firing; 24 hours is
        # safely after the normal renewal point while retaining recovery time.
        - alert: CertManagerCertificateExpiringSoon
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds - time() < 24 * 3600)
            and
            (certmanager_certificate_expiration_timestamp_seconds - time() > 0)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires within 24 hours
            description: cert-manager has not replaced this certificate by its final 24 hours. Inspect the Certificate, CertificateRequest, Order, and Challenge resources for issuer or DNS failures.

        - alert: CertManagerCertificateExpired
          expr: certmanager_certificate_expiration_timestamp_seconds - time() <= 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} has expired
            description: cert-manager still reports an expired certificate. Treat the affected endpoint as unavailable and repair issuance immediately.

        - alert: CertManagerCertificateNotReady
          expr: certmanager_certificate_ready_status{condition="True"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready
            description: cert-manager has reported the Certificate Ready condition false for 15 minutes. Inspect its CertificateRequest, Order, and Challenge resources.

        - alert: CertManagerCertificateMetricsMissing
          expr: absent(certmanager_certificate_expiration_timestamp_seconds)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: cert-manager certificate metrics are missing
            description: Certificate expiration timestamps have been absent for 15 minutes, so expiry cannot be detected. Check the cert-manager ServiceMonitor and scrape target.

    - name: pod-object-churn
      rules:
        # Namespace count/pods quotas cap the blast radius at 50 objects for
        # most namespaces. Alert at five failed objects so the operator sees a
        # runaway ReplicaSet/controller well before KubeQuotaAlmostFull fires.
        - alert: KubeFailedPodChurn
          expr: sum by (namespace) (kube_pod_status_phase{phase="Failed"} == 1) >= 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Namespace {{ $labels.namespace }} is accumulating failed pods
            description: At least {{ printf "%.0f" $value }} failed pod objects have remained in {{ $labels.namespace }} for five minutes. Identify the owning controller before the namespace's count/pods quota blocks healthy replacements.

    - name: vlagent-pipeline
      rules:
        - alert: VlagentCollectorTargetMissing
          expr: |
            (count(count by (node) (up{job="vlagent"} == 1)) or vector(0))
            < scalar(max(kube_daemonset_status_desired_number_scheduled{namespace="observability",daemonset="vlagent"}))
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: A selected node has no healthy vlagent scrape target
            description: Check DaemonSet scheduling, PodMonitor conversion, node labels and the metrics network path. Zero selected nodes during staged rollout is intentional.

        - alert: VlagentBacklogSustained
          expr: vlagent_remotewrite_pending_data_bytes{job="vlagent"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: vlagent on {{ $labels.node }} has a sustained backlog
            description: Pending compressed bytes have remained nonzero for ten minutes. Restore the sink; do not restart the collector or remove its hostPath buffer.

        - alert: VlagentBufferNearCapacity
          expr: vlagent_remotewrite_pending_data_bytes{job="vlagent"} > 3221225472
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: vlagent on {{ $labels.node }} has used 75% of its queue budget
            description: The per-URL queue budget is 4 GiB. Old blocks are evicted at capacity; inspect backend health and node disk space now.

        - alert: VlagentPersistentQueueLoss
          expr: |
            increase(vm_persistentqueue_blocks_dropped_total{job="vlagent"}[10m]) > 0
            or increase(vm_persistentqueue_bytes_dropped_total{job="vlagent"}[10m]) > 0
          labels:
            severity: critical
          annotations:
            summary: vlagent on {{ $labels.node }} evicted persistent queue data
            description: Irrecoverable queue overflow was observed. Counters measure blocks and compressed bytes, not lost log rows. Preserve metrics and restore delivery before the next eviction.

        - alert: VlagentRemoteWriteLoss
          expr: increase(vlagent_remotewrite_packets_dropped_total{job="vlagent"}[10m]) > 0
          labels:
            severity: critical
          annotations:
            summary: vlagent on {{ $labels.node }} dropped remote-write packets
            description: Inspect backend response codes and collector errors. This loss is separate from persistent-queue eviction.

        - alert: VlagentNodeLogIngestionSilent
          expr: increase(vl_rows_ingested_total{job="vlagent",type="kubernetes_logs"}[10m]) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: vlagent on {{ $labels.node }} is reading no Kubernetes logs
            description: Check API discovery, symlinks, file permissions and checkpoints. A healthy scrape target alone does not prove log collection.

    # Retain Alloy rules until the staged cutover and rollback window end.
    - name: logging-pipeline
      rules:
        - alert: AlloyVictoriaLogsEntriesDropped
          expr: sum by (pod, reason) (increase(loki_write_dropped_entries_total{component_id="loki.write.vl"}[10m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Alloy {{ $labels.pod }} is dropping VictoriaLogs entries
            description: Alloy has dropped entries bound for VictoriaLogs for five minutes (reason={{ $labels.reason }}). Check the writer queue, response codes, and VictoriaLogs health before restarting the collector.

        - alert: AlloyVictoriaLogsRetriesSustained
          expr: sum by (pod) (increase(loki_write_batch_retries_total{component_id="loki.write.vl"}[5m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Alloy {{ $labels.pod }} is persistently retrying VictoriaLogs writes
            description: VictoriaLogs write retries have remained present for 15 minutes. The in-memory retry budget is finite; restore the sink before queued entries are dropped.

        - alert: AlloyLogCollectorTargetMissing
          expr: (count(up{job="alloy"} == 1) or vector(0)) < scalar(max(kube_daemonset_status_desired_number_scheduled{namespace="observability",daemonset="alloy"}))
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Fewer Alloy collectors than scheduled nodes are being scraped
            description: vmagent cannot see one healthy Alloy target per node still assigned to Alloy. Check the DaemonSet, ServiceMonitor conversion, and Cilium ingress policy.

        - alert: AlloyNodeLogIngestionSilent
          expr: sum by (pod) (increase(loki_write_sent_entries_total{component_id="loki.write.vl"}[10m])) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Alloy {{ $labels.pod }} is not sending logs to VictoriaLogs
            description: This node-local collector has sent no entries for 15 minutes while its metrics remain available. Check file discovery, positions, and the VictoriaLogs writer graph.

        - alert: VictoriaLogsRowsDropped
          expr: sum by (reason) (increase(vl_rows_dropped_total{reason!="debug"}[10m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: VictoriaLogs is dropping ingested rows
            description: VictoriaLogs has dropped rows for five minutes (reason={{ $labels.reason }}). Debug-mode dry runs are intentionally excluded.

        - alert: VictoriaLogsOversizedLinesDropped
          expr: increase(vl_too_long_lines_skipped_total[10m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: VictoriaLogs is rejecting oversized log lines
            description: At least one line exceeded VictoriaLogs' accepted size during the last ten minutes. Identify the emitting workload before useful context is lost.

        - alert: VictoriaLogsStorageReadOnly
          expr: max(vl_storage_is_read_only) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: VictoriaLogs storage is read-only
            description: VictoriaLogs has marked its storage path read-only. Inspect the PVC, Longhorn volume, and filesystem before collector buffers overflow.

        - alert: VictoriaLogsDiskSpaceLow
          expr: min(vl_free_disk_space_bytes / vl_total_disk_space_bytes) < 0.10
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: VictoriaLogs has less than 10% disk space free
            description: Free space is below the emergency threshold despite the 80% retention ceiling. Inspect partition cleanup, daily ingest volume, and Longhorn capacity.

        - alert: VictoriaLogsIngestionSilent
          expr: (sum(increase(vl_rows_ingested_total{job="victoria-logs-single-server",type=~"loki.*|nativeinsert"}[10m])) == 0) or absent(vl_rows_ingested_total{job="victoria-logs-single-server",type=~"loki.*|nativeinsert"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: VictoriaLogs has no observable collector ingestion
            description: No Loki or native-protocol rows have reached the production VictoriaLogs backend for 15 minutes, or the ingestion metric is absent. Check collector queues, VictoriaLogs availability, and vmagent scraping.

        # The prior seven-day peak was 819 streams/hour. vlagent keeps one
        # identity per pod/container/node, with no severity or output stream.
        # Retain 1500/hour through the one-time schema adoption/replay, then
        # rebaseline after the approved whole-cluster cutover.
        - alert: VictoriaLogsStreamChurnHigh
          expr: increase(vl_streams_created_total[1h]) > 1500
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: VictoriaLogs stream creation is abnormally high
            description: More than 1,500 streams were created in one hour. Look for volatile stream fields, duplicated collectors, or runaway pod churn.
