---
# Shared cluster rules are owned with the surviving VictoriaMetrics stack.
# Signals that are specific to this cluster's delivery, GitOps, certificate,
# and pod-object failure modes, plus the Talos EPHEMERAL headroom policy.
# Generic node/filesystem/PVC capacity and CrashLoopBackOff alerts remain
# owned by the VM chart's bundled
# kubernetes-mixin rules; Longhorn capacity and backup rules live with the
# Longhorn deployment.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  # New identity avoids a cross-Kustomization prune race with the KPS copy.
  name: vm-platform-operations
spec:
  groups:
    - name: talos-ephemeral-storage
      labels:
        cluster: k8s-prod
      rules:
        # Independent of growth prediction: image GC and hard eviction share
        # /var, so a stable but nearly full image cache still needs attention.
        - alert: KubeNodeEphemeralStorageHigh
          expr: |
            (
              node_filesystem_avail_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs"}
              / node_filesystem_size_bytes{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs"}
              < 0.20
            )
            and
            (node_filesystem_readonly{cluster="k8s-prod",job="node-exporter",mountpoint="/var",fstype="xfs"} == 0)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: /var on {{ $labels.instance }} is over 80% full
            description: '{{ $labels.instance }} has {{ $value | humanizePercentage }} of /var free. Verify the live image-GC settings and inspect GC failures, container images, logs and emptyDir usage before the shared filesystem crosses its 15% free hard-eviction threshold.'
            runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/talos-ephemeral-storage.md

    - name: kubernetes-nodes
      labels:
        cluster: k8s-prod
      rules:
        # The one notifying alert for a node that goes down; see "One alert per
        # machine" in the alerting runbook. It reads vmagent's scrape of the
        # kubelet rather than kube-state-metrics, which runs as one replica and
        # may be on the node that died, and fires before the alerts it holds
        # back. A cordoned node is under maintenance and skipped, by its last
        # cordon state within 15 minutes in case kube-state-metrics went down
        # with it. instance repeats the node name, as host alerts name their
        # machine.
        - alert: KubeNodeDown
          expr: |
            label_replace(
              max by (cluster, node) (up{cluster="k8s-prod",job="kubelet",metrics_path="/metrics"}) == 0
              unless on (cluster, node)
              last_over_time((max by (cluster, node) (kube_node_spec_unschedulable{cluster="k8s-prod",job="kube-state-metrics"}))[15m:1m]) == 1,
              "instance", "$1", "node", "(.+)")
          for: 4m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes node {{ $labels.node }} is down
            description: '{{ $labels.node }}''s kubelet has not answered for four minutes and the node is not cordoned. Check it with talosctl and its console. Alerts that only restate that the node is down are held back while this fires.'
            runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/alerting.md#one-alert-per-machine

    - name: flux-reconciliation
      labels:
        cluster: k8s-prod
      rules:
        - alert: FluxReconciliationFailed
          expr: flux_resource_info{kind=~"Kustomization|HelmRelease",ready="False",suspended="False"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is failing
            description: Flux has reported this unsuspended resource Ready=False for 10 minutes (reason={{ $labels.reason }}). Inspect the resource conditions and controller logs before retrying reconciliation.

        - alert: FluxReconciliationStalled
          expr: flux_resource_info{kind=~"Kustomization|HelmRelease",ready="Unknown",suspended="False"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is stalled
            description: Flux has reported this unsuspended resource Ready=Unknown for 30 minutes (reason={{ $labels.reason }}). Check dependencies, source readiness, and reconciliation progress.

        - alert: FluxResourceMetricsMissing
          expr: absent(flux_resource_info{kind=~"Kustomization|HelmRelease"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Flux resource health metrics are missing
            description: flux_resource_info has been absent for 15 minutes, so reconciliation failures cannot be detected. Check the Flux Operator ServiceMonitor and scrape target.

    - name: certificate-lifecycle
      labels:
        cluster: k8s-prod
      rules:
        # Public certificates now have a roughly 160-hour lifetime. A fixed
        # 14-day threshold would therefore be permanently firing; 24 hours is
        # safely after the normal renewal point while retaining recovery time.
        - alert: CertManagerCertificateExpiringSoon
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds - time() < 24 * 3600)
            and
            (certmanager_certificate_expiration_timestamp_seconds - time() > 0)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires within 24 hours
            description: cert-manager has not replaced this certificate by its final 24 hours. Inspect the Certificate, CertificateRequest, Order, and Challenge resources for issuer or DNS failures.

        - alert: CertManagerCertificateExpired
          expr: certmanager_certificate_expiration_timestamp_seconds - time() <= 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} has expired
            description: cert-manager still reports an expired certificate. Treat the affected endpoint as unavailable and repair issuance immediately.

        - alert: CertManagerCertificateNotReady
          expr: certmanager_certificate_ready_status{condition="True"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready
            description: cert-manager has reported the Certificate Ready condition false for 15 minutes. Inspect its CertificateRequest, Order, and Challenge resources.

        - alert: CertManagerCertificateMetricsMissing
          expr: absent(certmanager_certificate_expiration_timestamp_seconds)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: cert-manager certificate metrics are missing
            description: Certificate expiration timestamps have been absent for 15 minutes, so expiry cannot be detected. Check the cert-manager ServiceMonitor and scrape target.

    - name: pod-object-churn
      labels:
        cluster: k8s-prod
      rules:
        # Namespace count/pods quotas cap the blast radius at 50 objects for
        # most namespaces. Alert at five failed objects so the operator sees a
        # runaway ReplicaSet/controller well before KubeQuotaAlmostFull fires.
        - alert: KubeFailedPodChurn
          expr: sum by (namespace) (kube_pod_status_phase{phase="Failed"} == 1) >= 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Namespace {{ $labels.namespace }} is accumulating failed pods
            description: At least {{ printf "%.0f" $value }} failed pod objects have remained in {{ $labels.namespace }} for five minutes. Identify the owning controller before the namespace's count/pods quota blocks healthy replacements.

    - name: fluent-bit-pipeline
      labels:
        cluster: k8s-prod
      rules:
        # One alert per node, so a node that is down holds back its own.
        - alert: FluentBitCollectorTargetMissing
          expr: |
            max by (node) (kube_node_info{job="kube-state-metrics"})
            unless on (node)
            count by (node) (up{job="fluent-bit"} == 1) == 2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: '{{ $labels.node }} lacks a healthy Fluent Bit scrape target'
            description: Each node needs both the v2 and v1 metrics targets up. Check DaemonSet scheduling, PodMonitor conversion and the metrics network path.

        - alert: FluentBitDeliveryRetrying
          expr: increase(fluentbit_output_retries_total{job=~"fluent-bit|fluent-bit-events"}[2m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Fluent Bit on {{ $labels.node }} keeps retrying delivery to VictoriaLogs
            description: Chunks are buffering on the node's filesystem. Restore the sink; do not restart the collector or remove /var/lib/fluent-bit.

        - alert: FluentBitBufferNearCapacity
          expr: fluentbit_output_chunk_available_capacity_percent{job=~"fluent-bit|fluent-bit-events"} < 25
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Fluent Bit on {{ $labels.node }} has used 75% of its {{ $labels.name }} buffer
            description: The output buffer limits are 4 GiB for container logs (victorialogs) and 256 MiB each for Talos logs (talos), UniFi syslog (unifi) and Kubernetes events (events). At capacity Fluent Bit discards chunks and its drop counter undercounts the loss; inspect backend health and node disk space now.

        - alert: FluentBitRecordsDropped
          expr: |
            increase(fluentbit_output_dropped_records_total{job=~"fluent-bit|fluent-bit-events"}[10m]) > 0
            or increase(fluentbit_input_long_line_skipped_total{job="fluent-bit"}[10m]) > 0
          labels:
            severity: critical
          annotations:
            summary: Fluent Bit on {{ $labels.node }} dropped log records
            description: The output discarded buffered records, or the input skipped a container log line longer than 1 MiB. The output counter is a lower bound on the loss. Preserve metrics and restore delivery.

        - alert: FluentBitNodeLogIngestionSilent
          expr: increase(fluentbit_input_records_total{job="fluent-bit",name="pods"}[10m]) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Fluent Bit on {{ $labels.node }} is reading no container logs
            description: Check the /var/log/containers mount, file permissions and the tail database. A healthy scrape target alone does not prove log collection.

        # Flux alone records more than 200 events an hour (October 22, 2026).
        # Summed over pods, so a replaced collector's last counter cannot fire it.
        - alert: KubeEventsIngestionSilent
          expr: |
            sum(increase(fluentbit_input_records_total{job="fluent-bit-events",name="events"}[30m])) == 0
            or absent(fluentbit_input_records_total{job="fluent-bit-events",name="events"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The Kubernetes events collector is receiving no events
            description: fluent-bit-events read no events for 45 minutes, or reports no events input because it is down, unscraped or configured without one. Its log shows watch failures, such as http_status=403 if its ClusterRole lacks events. The API server keeps an event for an hour after its last update; a collector that recovers within it lists them again.

        # The input counts records before the collector drops any. On October 19,
        # 2026 every node sent several a second (machined's console-dashboard
        # lines) and controller-runtime logged every 20 seconds. The second
        # branch covers a collector scraped without the talos input.
        - alert: TalosLogIngestionSilent
          expr: |
            increase(fluentbit_input_records_total{job="fluent-bit",name="talos"}[10m]) == 0
            or on (node) (max by (node) (up{job="fluent-bit",endpoint="http"} == 1)
              unless on (node) fluentbit_input_records_total{job="fluent-bit",name="talos"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Fluent Bit on {{ $labels.node }} receives no Talos logs
            description: The node's talos input counted no records for 20 minutes, or the collector has no talos input. Check the node's machine.logging and KmsgLogConfig settings, the fluent-bit-talos Service endpoints, the node's Cilium service map and the collector's configuration. Talos keeps retrying and holds each service's last 1 MiB.

        # Summed over nodes: the gateway spreads senders across every node
        # advertising the address. The console has gone 29 hours without an
        # event, but gateway daemon and device syslog count too.
        - alert: UniFiSyslogIngestionSilent
          expr: |
            sum(increase(fluentbit_input_records_total{job="fluent-bit",name="unifi"}[2d])) == 0
            or absent(fluentbit_input_records_total{job="fluent-bit",name="unifi"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Fluent Bit has received no UniFi syslog for two days
            description: No datagrams reached the syslog listener (10.32.130.3 UDP/514) on any node. Check the console's SIEM export target, the victoria-logs-syslog Service and its BGP advertisement, and CiliumPolicyDrops for the fluent-bit pods.

    - name: logging-pipeline
      labels:
        cluster: k8s-prod
      rules:
        - alert: VictoriaLogsRowsDropped
          expr: sum by (reason) (increase(vl_rows_dropped_total{reason!="debug"}[10m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: VictoriaLogs is dropping ingested rows
            description: VictoriaLogs has dropped rows for five minutes (reason={{ $labels.reason }}). Debug-mode dry runs are intentionally excluded.

        - alert: VictoriaLogsOversizedLinesDropped
          expr: increase(vl_too_long_lines_skipped_total[10m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: VictoriaLogs is rejecting oversized log lines
            description: At least one line exceeded VictoriaLogs' accepted size during the last ten minutes. Identify the emitting workload before useful context is lost.

        - alert: VictoriaLogsStorageReadOnly
          expr: max(vl_storage_is_read_only) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: VictoriaLogs storage is read-only
            description: VictoriaLogs has marked its storage path read-only. Inspect the PVC, Longhorn volume, and filesystem before collector buffers overflow.

        - alert: VictoriaLogsDiskSpaceLow
          expr: min(vl_free_disk_space_bytes / vl_total_disk_space_bytes) < 0.10
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: VictoriaLogs has less than 10% disk space free
            description: Free space is below the emergency threshold despite the 80% retention ceiling. Inspect partition cleanup, daily ingest volume, and Longhorn capacity.

        - alert: VictoriaLogsIngestionSilent
          expr: (sum(increase(vl_rows_ingested_total{job="victoria-logs-single-server",type="opentelemetry_protobuf"}[10m])) == 0) or absent(vl_rows_ingested_total{job="victoria-logs-single-server",type="opentelemetry_protobuf"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: VictoriaLogs has no observable collector ingestion
            description: No OTLP rows from Fluent Bit have reached the production VictoriaLogs backend for 15 minutes, or the ingestion metric is absent. Check collector buffers, VictoriaLogs availability, and vmagent scraping.

        # The prior seven-day peak was 819 streams/hour. Fluent Bit's stream
        # fields are one identity per service/namespace/pod/container/node, with
        # no per-event values. The collector cutover adds one new stream per
        # running container; rebaseline 1500/hour after it.
        - alert: VictoriaLogsStreamChurnHigh
          expr: increase(vl_streams_created_total[1h]) > 1500
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: VictoriaLogs stream creation is abnormally high
            description: More than 1,500 streams were created in one hour. Look for volatile stream fields, duplicated collectors, or runaway pod churn.
