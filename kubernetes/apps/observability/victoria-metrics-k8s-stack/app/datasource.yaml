---
# VictoriaMetrics and VMAlertmanager datasources for standalone Grafana.
#
# Type is `prometheus` — VM speaks PromQL natively, so KPS's bundled
# dashboards drop in unchanged when repointed at this datasource. The
# `victoriametrics-metrics-datasource` plugin is also installed (see
# Grafana commit 1) and exposes VM-specific features like downsampling
# queries, but for the bake-off the apples-to-apples comparison wants
# the same datasource type as the existing dashboards expect.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-vm
  labels:
    grafana_datasource: "1"
data:
  vm.yaml: |
    apiVersion: 1
    # Remove the database-backed KPS datasource before provisioning the VM
    # datasource with the same display name. Deleting its ConfigMap entry does
    # not remove an already provisioned datasource from Grafana's database.
    deleteDatasources:
      - name: Alertmanager
        orgId: 1
    datasources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://vmsingle-victoria-metrics-k8s-stack.observability.svc.cluster.local:8428
        isDefault: true
        editable: false
      - name: Alertmanager
        uid: alertmanager-vm
        type: alertmanager
        access: proxy
        url: http://vmalertmanager-victoria-metrics-k8s-stack.observability.svc.cluster.local:9093
        jsonData:
          implementation: prometheus
        editable: false
