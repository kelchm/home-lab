---
# Shared cluster rules are owned with the surviving VictoriaMetrics stack.
# The node-exporter speed gauge is bytes/second. Convert it to Mb/s so alert
# values and annotations match the speeds shown by Talos and UniFi.
#
# These are the two physical links common to every production node:
#   - eno1:    Kubernetes/control-plane trunk, expected at 1 GbE
#   - enp6s0: Longhorn storage link, expected at 2.5 GbE
#
# Scope the rule to those exact names so bridges, VLANs, veths, and Cilium
# devices cannot generate false positives. node_uname_info adds the hostname;
# node_network_speed_bytes itself only identifies the node-exporter instance.
# Its cluster matcher keeps the lab's other hosts out of these rules.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  # New identity avoids a cross-Kustomization prune race with the KPS copy.
  name: vm-node-physical-link-speed
spec:
  groups:
    - name: node-physical-network
      labels:
        cluster: k8s-prod
      rules:
        - alert: NodeLinkSpeedDegraded
          expr: |
            (
              label_replace(
                node_network_speed_bytes{device="eno1"} * 8 / 1e6 < 1000,
                "expected_mbps", "1000", "", ".*"
              )
              or
              label_replace(
                node_network_speed_bytes{device="enp6s0"} * 8 / 1e6 < 2500,
                "expected_mbps", "2500", "", ".*"
              )
            )
            * on (instance) group_left (nodename) node_uname_info{cluster="k8s-prod"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Node {{ $labels.nodename }} physical link is below its expected speed
            description: >-
              Interface {{ $labels.device }} on {{ $labels.nodename }} negotiated
              at {{ printf "%.0f" $value }} Mb/s; expected
              {{ $labels.expected_mbps }} Mb/s. Check the cable, keystone, patch
              lead, switch port, and port profile.
---
# The CPU and NVMe temperature rules for every machine, the k8s-prod nodes
# included, are in metrics-ingest/app/alerts.yaml. These two catch a k8s-prod
# node whose temperature sensors have disappeared, which would silence them.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  # New identity avoids a cross-Kustomization prune race with the KPS copy.
  name: vm-node-hardware-temperature
spec:
  groups:
    - name: node-hardware-temperature
      labels:
        cluster: k8s-prod
      rules:
        - alert: NodeCPUTemperatureSensorMissing
          expr: |
            node_uname_info{cluster="k8s-prod"}
            unless on (instance)
            (
              node_hwmon_temp_celsius
              * on (instance, chip, sensor) group_left (label)
                node_hwmon_sensor_label{label="Tctl"}
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: CPU temperature sensor is missing on {{ $labels.nodename }}
            description: >-
              Node-exporter is still reporting {{ $labels.nodename }}, but its
              CPU Tctl hwmon sensor has been absent for 15 minutes.

        - alert: NodeNVMeTemperatureSensorMissing
          expr: |
            node_uname_info{cluster="k8s-prod"}
            unless on (instance)
            (
              (node_hwmon_temp_max_celsius - node_hwmon_temp_celsius)
              * on (instance, chip, sensor) group_left (label)
                node_hwmon_sensor_label{label="Composite"}
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: NVMe temperature sensor is missing on {{ $labels.nodename }}
            description: >-
              Node-exporter is still reporting {{ $labels.nodename }}, but its
              NVMe Composite temperature or warning temperature has been absent
              for 15 minutes.
