---
# victoria-metrics-k8s-stack — the surviving metrics and alerting path.
# The operator manages VMSingle, vmagent, vmalert, VMAlertmanager, the native
# cluster exporters, and their VMServiceScrapes. KPS remains temporarily as a
# Git-revert rollback path, but no longer owns VM ingestion or outbound paging.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.91.2
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  interval: 1h
  values:
    victoria-metrics-operator:
      operator:
        # Make converted VMRule/VMServiceScrape/VMPodScrape resources follow
        # their Prometheus source objects during the KPS teardown. Without
        # owner references, removed sources leave stale alerts and scrapes.
        enable_converter_ownership: true

    # The standalone Grafana remains the front door.
    grafana:
      enabled: false

    kube-state-metrics:
      enabled: true
      # Preserve the Longhorn backup opt-out label used by the storage rules.
      metricLabelsAllowlist:
        - persistentvolumeclaims=[recurring-job-group.longhorn.io/no-backup]
      # Longhorn does not expose BackupTarget availability through its native
      # metrics endpoint. Export status.available from the CR so a disconnected
      # backup target alerts before scheduled backups become stale.
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: longhorn.io
                  version: v1beta2
                  kind: BackupTarget
                metricNamePrefix: longhorn
                labelsFromPath:
                  backup_target: [metadata, name]
                  namespace: [metadata, namespace]
                metrics:
                  - name: backup_target_available
                    help: Whether the Longhorn BackupTarget is available.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, available]
      rbac:
        extraRules:
          - apiGroups: [longhorn.io]
            resources: [backuptargets]
            verbs: [list, watch]

    prometheus-node-exporter:
      enabled: true

    # VM-native resources are the sole vmagent owners for Kubernetes API,
    # kubelet/cAdvisor/resource, and CoreDNS metrics. The matching KPS
    # ServiceMonitors stay disabled during the rollback soak.
    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
    coreDns:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            # CoreDNS exposes unauthenticated metrics over cluster-internal
            # HTTP, so do not send vmagent's service-account token.
            - port: http-metrics

    # The chart calls this `alertmanager`, but it creates a VMAlertmanager CR.
    # The complete routing configuration and Pushover credentials live in the
    # separately managed SOPS Secret rather than Helm values.
    alertmanager:
      enabled: true
      monzoTemplate:
        enabled: false
      spec:
        configSecret: vmalertmanager-config
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi

    # Default dashboards rendered as ConfigMaps (chart default). The
    # standalone Grafana's sidecar discovers them via `grafana_dashboard`
    # label. Default datasources are rendered into the disabled grafana
    # subchart and end up as no-ops, so our `datasource.yaml` is the
    # only VM datasource Grafana actually sees.
    defaultDashboards:
      enabled: true

    # Talos exposes these components on the node addresses rather than pods.
    # Controller-manager and scheduler require bearer-token authorization and
    # use localhost-only certificates, so retain TLS but skip hostname checks.
    # Etcd exposes a separate plaintext, metrics-only listener and receives no
    # Kubernetes service-account token.
    kubeControllerManager:
      enabled: true
      endpoints:
        - 10.32.30.11
        - 10.32.30.12
        - 10.32.30.13
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    kubeScheduler:
      enabled: true
      endpoints:
        - 10.32.30.11
        - 10.32.30.12
        - 10.32.30.13
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true

    kubeEtcd:
      enabled: true
      endpoints:
        - 10.32.30.11
        - 10.32.30.12
        - 10.32.30.13
      service:
        # Talos exposes the metrics-only listener on 2381; the VM chart's
        # upstream default is etcd's client port 2379.
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: http

    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "30d"
        storage:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
          storageClassName: longhorn
        resources:
          # Sized for full-cluster long-range (30d) queries — vmsingle's
          # per-query memory pool scales with the limit, and cluster RAM
          # is not a constraint. The 2Gi bake-off sizing starved heavy
          # cadvisor range queries; this gives ample headroom.
          requests:
            cpu: 200m
            memory: 4Gi
          limits:
            memory: 8Gi

    vmagent:
      enabled: true
      spec:
        # Scrape ServiceMonitor / PodMonitor / VMServiceScrape / VMPodScrape
        # cluster-wide. vm-operator auto-converts prometheus-operator CRDs
        # so KPS's ServiceMonitors flow through transparently.
        selectAllByDefault: true
        scrapeInterval: 30s
        # vmagent's externalLabels are scrape-time labels (unlike Prometheus,
        # which only applies external_labels at federation/remote_write/alert
        # boundaries). Stamping `cluster` here makes every series in vmsingle
        # carry it, which is what bundled dashboards' `$cluster` template
        # variable filters on.
        externalLabels:
          cluster: k8s-prod
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi

    vmalert:
      enabled: true
      spec:
        selectAllByDefault: true
        evaluationInterval: 30s
        # The evaluator label is the VMAlertmanager routing authority. It keeps
        # the temporary KPS evaluator copy from becoming a second notification.
        externalLabels:
          cluster: k8s-prod
          evaluator: vmalert
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi

    defaultRules:
      create: true
      groups:
        kube-apiserver-availability.rules:
          rules:
            # The evaluator label changes the output identity of every
            # recording rule. Start this long-range estimate from the VM
            # identity instead of merging the retained pre-cutover output.
            "code_verb:apiserver_request_total:increase30d":
              spec:
                expr: avg_over_time(code_verb:apiserver_request_total:increase1h{evaluator="vmalert"}[30d]) * 24 * 30
      rules:
        # Talos uses Cilium kube-proxy replacement, so this component is
        # intentionally absent. KPS disables the matching scrape and rule too.
        KubeProxyDown:
          enabled: false
