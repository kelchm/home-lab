---
# victoria-metrics-k8s-stack — Pipeline B's metrics layer. Operator,
# VMSingle (single-node TSDB), vmagent (scraping), vmalert (rule eval).
# vmagent is the actual point of the comparison vs KPS Prom — its
# persistent queue is the defensive ingest property we cited as the
# reason VM is in the bake-off.
#
# Subcharts disabled to avoid duplicating components we already have:
# - kube-state-metrics and node-exporter live in KPS already; vmagent
#   scrapes them via the same ServiceMonitors KPS Prom does.
# - grafana is the standalone instance from commit 1.
# - vmalertmanager is disabled in favor of KPS's Alertmanager. vmalert sends
#   into that shared Alertmanager, which owns external delivery.
#
# Control-plane component scrapes are disabled in this chart because KPS owns
# the shared ServiceMonitors and vm-operator converts them for vmagent.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.91.2
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  interval: 1h
  values:
    # Subcharts already provided elsewhere — disable to avoid duplication.
    grafana:
      enabled: false   # using standalone Grafana from commit 1

    kube-state-metrics:
      enabled: false
    prometheus-node-exporter:
      enabled: false

    # The chart's own VMAlertmanager — disabled in favor of KPS's
    # Alertmanager during the bake-off. The chart names this `alertmanager`
    # (not `vmalertmanager`) at the values root, even though the resource
    # it creates is a VMAlertmanager CRD.
    alertmanager:
      enabled: false

    # Default dashboards rendered as ConfigMaps (chart default). The
    # standalone Grafana's sidecar discovers them via `grafana_dashboard`
    # label. Default datasources are rendered into the disabled grafana
    # subchart and end up as no-ops, so our `datasource.yaml` is the
    # only VM datasource Grafana actually sees.
    defaultDashboards:
      enabled: true

    # KPS owns the shared ServiceMonitors for these endpoints. vm-operator
    # converts those monitors for vmagent, so keep the VM chart's duplicate
    # Services and VMServiceScrapes disabled.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false

    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "30d"
        storage:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
          storageClassName: longhorn
        resources:
          # Sized for full-cluster long-range (30d) queries — vmsingle's
          # per-query memory pool scales with the limit, and cluster RAM
          # is not a constraint. The 2Gi bake-off sizing starved heavy
          # cadvisor range queries; this gives ample headroom.
          requests:
            cpu: 200m
            memory: 4Gi
          limits:
            memory: 8Gi

    vmagent:
      enabled: true
      spec:
        # Scrape ServiceMonitor / PodMonitor / VMServiceScrape / VMPodScrape
        # cluster-wide. vm-operator auto-converts prometheus-operator CRDs
        # so KPS's ServiceMonitors flow through transparently.
        selectAllByDefault: true
        scrapeInterval: 30s
        # vmagent's externalLabels are scrape-time labels (unlike Prometheus,
        # which only applies external_labels at federation/remote_write/alert
        # boundaries). Stamping `cluster` here makes every series in vmsingle
        # carry it, which is what bundled dashboards' `$cluster` template
        # variable filters on.
        externalLabels:
          cluster: k8s-prod
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi

    vmalert:
      enabled: true
      spec:
        selectAllByDefault: true
        evaluationInterval: 30s
        # Stamp alerts with the cluster identity so notifications surface
        # alongside any future cluster's alerts in the same Alertmanager.
        externalLabels:
          cluster: k8s-prod
        # Fire to the shared KPS Alertmanager for comparison in one UI. Its
        # external route selects only the Prometheus evaluator copy, avoiding
        # duplicate Pushover notifications from the two distinct fingerprints.
        notifiers:
          - url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi

    defaultRules:
      create: true
      rules:
        # Talos uses Cilium kube-proxy replacement, so this component is
        # intentionally absent. KPS disables the matching scrape and rule too.
        KubeProxyDown:
          enabled: false
