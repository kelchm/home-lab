---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: external-metrics-ingest
spec:
  dnsNames: [metrics-ingest.home.kelch.io]
  duration: 160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
  secretName: external-metrics-ingest-tls
  usages: [digital signature]
