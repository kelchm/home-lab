---
# Prometheus UI — gated by OIDC via the shared kanidm-oidc Middleware
# (see kubernetes/apps/observability/middleware-kanidm-oidc.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
spec:
  hostnames: ["prometheus.home.kelch.io"]
  parentRefs:
    - name: gateway-admin
      namespace: network
      sectionName: https
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: kanidm-oidc
      backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
