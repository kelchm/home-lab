---
# kube-prometheus-stack — temporary rollback metrics + alerting components.
# Prometheus, Alertmanager, and the prometheus-operator remain installed for
# an easy Git revert, but VictoriaMetrics now owns exporters, control-plane
# scraping, and outbound Pushover delivery.
#
# The Grafana subchart is disabled — we use the standalone Grafana
# deployed in commit 1. Dashboards still render as ConfigMaps with the
# `grafana_dashboard: "1"` label, which the standalone Grafana sidecar
# discovers automatically. Datasources are registered separately via
# datasources.yaml (also a labeled ConfigMap).
#
# The VM chart now owns every Kubernetes infrastructure scrape. Keeping the KPS
# component toggles off prevents their converted ServiceMonitors from becoming
# permanent duplicate vmagent scrape pools.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.6.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  interval: 1h
  values:
    crds:
      # Owned and upgraded independently so monitoring.coreos.com survives
      # the eventual removal of this losing bake-off stack.
      enabled: false

    grafana:
      enabled: false
      forceDeployDashboards: true
      forceDeployDatasources: false
      sidecar:
        dashboards:
          label: grafana_dashboard
          labelValue: "1"

    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeApiServer:
      enabled: false
    kubelet:
      enabled: false
    coreDns:
      enabled: false

    # Talos runs Cilium in kube-proxy-replacement mode. Leaving this enabled
    # creates an empty target and a permanently firing KubeProxyDown alert.
    kubeProxy:
      enabled: false

    # The VM chart owns the surviving mixin rules. Leaving the KPS defaults on
    # would make vmalert evaluate both native and converted copies.
    defaultRules:
      create: false

    prometheus:
      prometheusSpec:
        # Keep the cluster identity for rollback inspection. This evaluator's
        # Alertmanager has a null-only route and sends nothing externally.
        externalLabels:
          cluster: k8s-prod
        # Watch ServiceMonitors / PodMonitors / Rules / Probes across all
        # namespaces. Default scope is too narrow — cilium, longhorn,
        # traefik etc. emit ServiceMonitors outside observability.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        retention: 30d
        retentionSize: "45GB"   # leave headroom under the PVC size below
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi

    alertmanager:
      # Keep the rollback Alertmanager installed, but make its routing
      # explicitly local-only. Pushover credentials belong only to VMAlertmanager.
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: "null"
          group_by: [alertname, cluster, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
        receivers:
          - name: "null"
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi

    nodeExporter:
      enabled: false

    kubeStateMetrics:
      enabled: false

    prometheusOperator:
      enabled: true
