---
# The temporary rollback metrics stack: Prometheus, Alertmanager, and the
# prometheus-operator. VictoriaMetrics owns ingestion and outbound paging;
# these components remain installed for a Git-revert rollback only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-prometheus-stack-prometheus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      prometheus: kube-prometheus-stack-prometheus
  ingress:
    # Grafana's Prometheus datasource, self-scrape via the chart's
    # ServiceMonitor, vmagent's converted scrape, admin-gateway UI access,
    # and node-level kubectl port-forward handoffs.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: grafana
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
            app.kubernetes.io/instance: victoria-metrics-k8s-stack
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
            prometheus: kube-prometheus-stack-prometheus
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: traefik-admin-network
            app.kubernetes.io/name: traefik
            io.cilium.k8s.policy.serviceaccount: traefik-admin
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    # Service discovery and alerting resolution.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Prometheus discovers scrape targets through the Kubernetes API
    # (kubernetes_sd_config).
    - toEntities:
        - kube-apiserver
    # ServiceMonitorSelectorNilUsesHelmValues scrapes every ServiceMonitor
    # and PodMonitor cluster-wide. Within observability, grant the whole
    # namespace: this evaluator scrapes every backend in it.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
    # Cross-namespace scrape targets, one rule per namespace, port-scoped:
    # the app ServiceMonitors and PodMonitors below.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            # coredns prometheus listener (Corefile: prometheus :9153)
            - port: "9153"
              protocol: TCP
            # cilium-agent metrics + hubble-metrics
            - port: "9962"
              protocol: TCP
            - port: "9964"
              protocol: TCP
            # cilium-operator metrics
            - port: "9963"
              protocol: TCP
            # metrics-server
            - port: "10250"
              protocol: TCP
            # reloader (PodMonitor)
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cert-manager
      toPorts:
        - ports:
            # cert-manager + cainjector metrics; webhook pod also lists 10250
            - port: "9402"
              protocol: TCP
            - port: "10250"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            # cloudnative-pg operator manager metrics (PodMonitor)
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
      toPorts:
        - ports:
            # flux-operator metrics + health
            - port: "8080"
              protocol: TCP
            - port: "9080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: identity
      toPorts:
        - ports:
            # kaniop metrics
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            # metamcp-db (CloudNativePG instance metrics, PodMonitor)
            - port: "9187"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: iot
      toPorts:
        - ports:
            # visionect-db postgres metrics (PodMonitor)
            - port: "9187"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: printing
      toPorts:
        - ports:
            # bambuddy-db postgres metrics (PodMonitor)
            - port: "9187"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: longhorn-system
      toPorts:
        - ports:
            # longhorn-manager metrics via longhorn-backend
            - port: "9500"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: default
      toPorts:
        - ports:
            # echo metrics
            - port: "80"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            # external-dns + cloudflared metrics
            - port: "7979"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            # traefik metrics entrypoint; the Services currently expose only
            # web/websecure so the SMs resolve zero targets today — this
            # keeps the scrape working if the metrics port is added.
            - port: "9100"
              protocol: TCP
    # The rollback evaluator still delivers to its own (null-only)
    # Alertmanager.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: alertmanager
            alertmanager: kube-prometheus-stack-alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-prometheus-stack-alertmanager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
      alertmanager: kube-prometheus-stack-alertmanager
  ingress:
    # Prometheus alert delivery, vmagent's converted scrape, and node-level
    # kubectl port-forward handoffs. The routing is null-only, so nothing
    # else consumes this service.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
            prometheus: kube-prometheus-stack-prometheus
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
            app.kubernetes.io/instance: victoria-metrics-k8s-stack
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    # HA gossip between replicas (TCP + UDP).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: alertmanager
            alertmanager: kube-prometheus-stack-alertmanager
      toPorts:
        - ports:
            - port: "9094"
              protocol: TCP
            - port: "9094"
              protocol: UDP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # HA gossip between replicas (TCP + UDP).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: alertmanager
            alertmanager: kube-prometheus-stack-alertmanager
      toPorts:
        - ports:
            - port: "9094"
              protocol: TCP
            - port: "9094"
              protocol: UDP
    # The prometheus-operator's config-reloader sidecar watches the
    # routing config Secret through the API server.
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-prometheus-stack-operator
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
  ingress:
    # Scrape via the chart's ServiceMonitor (service 443 targets 10250).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
            app.kubernetes.io/instance: victoria-metrics-k8s-stack
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
            prometheus: kube-prometheus-stack-prometheus
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
    # Admission webhook calls from the API server, which runs as a host
    # process on the control-plane nodes.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
  egress:
    # CRD reconciliation against the API server.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
