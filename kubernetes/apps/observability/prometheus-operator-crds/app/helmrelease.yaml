---
# Standalone ownership for the monitoring.coreos.com CRDs used by charts across
# the cluster. Version 31.0.1 carries Prometheus Operator v0.93.1 CRDs, matching
# kube-prometheus-stack 88.6.1 at the point ownership moves off that release.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
spec:
  chart:
    spec:
      chart: prometheus-operator-crds
      version: 31.0.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-crds
  install:
    # Adopt the identical CRDs initially installed by kube-prometheus-stack.
    disableTakeOwnership: false
  interval: 1h
  values:
    crds:
      annotations:
        # A mistaken release deletion must not cascade-delete every
        # ServiceMonitor, PodMonitor, PrometheusRule, and related object.
        helm.sh/resource-policy: keep
