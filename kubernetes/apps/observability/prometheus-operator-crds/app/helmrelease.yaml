---
# Sole owner of the monitoring.coreos.com CRDs used by charts across the
# cluster. Version 31.0.1 carries Prometheus Operator v0.93.1 CRDs; the
# VictoriaMetrics operator converts the resulting objects for vmagent.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
spec:
  chart:
    spec:
      chart: prometheus-operator-crds
      version: 32.0.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-crds
  install:
    # Adopt identical CRDs already present rather than failing on conflict.
    disableTakeOwnership: false
  interval: 1h
  values:
    crds:
      annotations:
        # A mistaken release deletion must not cascade-delete every
        # ServiceMonitor, PodMonitor, PrometheusRule, and related object.
        helm.sh/resource-policy: keep
