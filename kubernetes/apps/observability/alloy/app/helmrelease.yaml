---
# Alloy — node-local Kubernetes pod-log collector. Tails exact pod paths under
# /var/log/pods and sends the same CRI-decoded entries to VictoriaLogs and the
# temporarily retained Loki rollback sink.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  chart:
    spec:
      chart: alloy
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: grafana
  interval: 1h
  values:
    controller:
      type: daemonset
      hostPID: false
      # Chart doesn't checksum the config ConfigMap into the pod template,
      # so HelmRelease upgrades change the mounted config without rolling
      # the pods. Stakater reloader watches the ConfigMap and triggers
      # the rollout.
      extraAnnotations:
        configmap.reloader.stakater.com/reload: alloy
      volumes:
        # Persist Alloy's positions across pod restarts. loki.write uses a
        # bounded in-memory queue and retries; it has no durable sender WAL.
        extra:
          - name: alloy-data
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate
          - name: pod-logs
            hostPath:
              path: /var/log/pods
              type: Directory
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi

    alloy:
      storagePath: /var/lib/alloy
      mounts:
        varlog: false
        extra:
          - name: alloy-data
            mountPath: /var/lib/alloy
          - name: pod-logs
            mountPath: /var/log/pods
            readOnly: true
          - name: tmp
            mountPath: /tmp
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 768Mi
      # Pod logs are root-owned 0640 on Talos. Keep uid 0 for owner-read while
      # removing every capability and making the image filesystem immutable.
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsUser: 0
        runAsGroup: 0
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      configMap:
        create: true
        content: |
          // Discover pods, then keep only this node's via the relabel below.
          // Node-scoping is required for correctness: with the full cluster
          // pod list, local.file_match mis-correlates the bloated target set
          // against the few log files present on the node and attaches one
          // pod's file to another pod's labels.
          discovery.kubernetes "pods" {
            role = "pod"
          }

          // Map Kubernetes metadata to Loki labels and compute the log
          // file path on disk.
          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            // Keep only pods on this node. K8S_NODE_NAME is injected by the
            // chart from spec.nodeName.
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              regex         = sys.env("K8S_NODE_NAME")
              action        = "keep"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            // Give both log backends a stable logical service identity. Start
            // with the container name, then prefer legacy and recommended
            // Kubernetes application labels when they are non-empty.
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              regex         = "(.+)"
              target_label  = "service_name"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              regex         = "(.+)"
              target_label  = "service_name"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              regex         = "(.+)"
              target_label  = "service_name"
            }
            // app.kubernetes.io/instance normally identifies a Helm release,
            // not a unique OpenTelemetry service instance. Preserve it under
            // an unambiguous name without adding it to VictoriaLogs streams.
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
              regex         = "(.+)"
              target_label  = "app_instance"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            // Path ordinary pod logs by their exact API UID. The doubled
            // dollar signs survive Flux post-build substitution so Alloy
            // receives braced relabel capture references; bare $1_ would be
            // parsed as the nonexistent capture group "1_".
            rule {
              source_labels = [
                "__meta_kubernetes_namespace",
                "__meta_kubernetes_pod_name",
                "__meta_kubernetes_pod_uid",
                "__meta_kubernetes_pod_container_name",
              ]
              separator    = "/"
              action       = "replace"
              regex        = "(.+)/(.+)/(.+)/(.+)"
              replacement  = "/var/log/pods/$${1}_$${2}_$${3}/$${4}/*.log"
              target_label = "__path__"
            }
            // Static mirror pods use the kubelet config hash in the on-disk
            // directory instead of the API object's UID. This rule matches
            // only when that annotation is present and replaces the default
            // UID path with the exact static-pod path. Restricting the hash
            // to its kubelet-generated lowercase hexadecimal shape prevents
            // an annotation value from injecting path separators.
            rule {
              source_labels = [
                "__meta_kubernetes_namespace",
                "__meta_kubernetes_pod_name",
                "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash",
                "__meta_kubernetes_pod_container_name",
              ]
              separator    = "/"
              action       = "replace"
              regex        = "(.+)/(.+)/([0-9a-f]{32})/(.+)"
              replacement  = "/var/log/pods/$${1}_$${2}_$${3}/$${4}/*.log"
              target_label = "__path__"
            }
          }

          // Tail logs from /var/log/pods by file pattern.
          local.file_match "pod_logs" {
            path_targets = discovery.relabel.pod_logs.output
            sync_period  = "10s"
          }

          loki.source.file "pod_logs" {
            targets                 = local.file_match.pod_logs.targets
            forward_to              = [loki.process.pod_logs.receiver]
            on_positions_file_error = "restart_from_end"
          }

          // Decode CRI log format (Talos uses containerd), remove terminal
          // color escapes, and extract only explicit structured severity.
          // The application payload remains unchanged apart from decolorizing;
          // VictoriaLogs still parses it below the collision-safe msg.* prefix.
          loki.process "pod_logs" {
            stage.cri {}
            stage.decolorize {}

            stage.json {
              expressions = {
                json_level              = "level",
                json_log_level          = "log.level",
                json_severity           = "severity",
                json_severity_text      = "severity_text",
                json_severity_text_otel = "SeverityText",
                json_lvl                = "lvl",
              }
            }

            // Parse logfmt candidates without trusting them yet. The template
            // below requires a key=value envelope plus a message or timestamp
            // companion before a severity candidate is eligible.
            stage.logfmt {
              mapping = {
                logfmt_level         = "level",
                logfmt_message       = "message",
                logfmt_msg           = "msg",
                logfmt_severity      = "severity",
                logfmt_severity_text = "severity_text",
                logfmt_time          = "time",
                logfmt_timestamp     = "timestamp",
                logfmt_ts            = "ts",
                logfmt_lvl           = "lvl",
              }
            }

            // Coalesce recognized JSON/logfmt fields, then canonicalize a
            // bounded set of aliases. An absent or foreign value becomes an
            // empty candidate and cannot escape as a dynamic label.
            stage.template {
              source = "level"
              // The chart evaluates configMap.content with Helm tpl. printf
              // emits this as one quoted River string so Helm preserves the
              // inner Alloy template instead of interpreting it itself.
              template = {{ printf "%q" `
                {{- $json_raw := coalesce .json_level .json_log_level .json_severity_text .json_severity_text_otel .json_severity .json_lvl -}}
                {{- $has_logfmt_envelope := not (empty (coalesce .logfmt_message .logfmt_msg .logfmt_ts .logfmt_time .logfmt_timestamp)) -}}
                {{- $is_logfmt := and (regexMatch "^[[:space:]]*[A-Za-z_][A-Za-z0-9_.-]*=" .Entry) $has_logfmt_envelope -}}
                {{- $logfmt_raw := "" -}}
                {{- if $is_logfmt -}}
                  {{- $logfmt_raw = coalesce .logfmt_level .logfmt_severity_text .logfmt_severity .logfmt_lvl -}}
                {{- end -}}
                {{- $raw := coalesce $json_raw $logfmt_raw -}}
                {{- $value := ToLower (TrimSpace (printf "%v" $raw)) -}}
                {{- if or (eq $value "trace") (eq $value "trc") -}}trace
                {{- else if or (eq $value "debug") (eq $value "dbg") (eq $value "verbose") -}}debug
                {{- else if or (eq $value "info") (eq $value "inf") (eq $value "information") (eq $value "informational") (eq $value "notice") -}}info
                {{- else if or (eq $value "warn") (eq $value "wrn") (eq $value "warning") -}}warning
                {{- else if or (eq $value "error") (eq $value "err") (eq $value "severe") -}}error
                {{- else if or (eq $value "critical") (eq $value "crit") (eq $value "alert") (eq $value "emergency") (eq $value "emerg") (eq $value "fatal") (eq $value "panic") -}}critical
                {{- end -}}
              ` }}
            }

            // stage.labels has no allowlist. Route through a temporary label
            // so only normalized values become the canonical level field, then
            // remove the temporary label before either writer receives it.
            stage.labels {
              values = {
                level_candidate = "level",
              }
            }
            stage.match {
              selector = `{level_candidate=~"trace|debug|info|warning|error|critical"}`
              stage.labels {
                values = {
                  level = "level",
                }
              }
            }
            stage.label_drop {
              values = ["level_candidate"]
            }

            forward_to = [
              loki.write.loki.receiver,
              loki.write.vl.receiver,
            ]
          }

          loki.write "loki" {
            endpoint {
              url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
            }
          }

          // Prefix structured payload fields so an application cannot replace
          // Kubernetes metadata such as namespace. Keep stream identity to the
          // stable cluster/workload dimensions; app_instance, level, filename,
          // and stdout/stderr stay queryable as ordinary fields without
          // multiplying VictoriaLogs streams.
          loki.write "vl" {
            external_labels = {
              cluster = "k8s-prod",
            }

            endpoint {
              url                 = "http://victoria-logs-single-server.observability.svc.cluster.local:9428/insert/loki/api/v1/push?message_fields_prefix=msg.&_msg_field=msg.message,msg.msg,msg.log,msg.event,msg.record.message&_stream_fields=cluster,namespace,service_name,pod,container,node"
              max_backoff_retries = 15
            }
          }

    serviceMonitor:
      enabled: true   # converted for vmagent; retained KPS also scrapes during the rollback soak
