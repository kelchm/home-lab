---
# Alloy exposes only its operational HTTP endpoint. Log reads are node-local
# hostPath access and log writes are outbound, so no workload needs ingress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alloy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: alloy
      app.kubernetes.io/name: alloy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP
  egress:
    # discovery.kubernetes reads the pod list from the API server.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # Dual-write push to the surviving VictoriaLogs path and the temporarily
    # retained Loki rollback sink.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: victoria-logs-single
            app.kubernetes.io/instance: victoria-logs-single
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: loki
            app.kubernetes.io/instance: loki
            app.kubernetes.io/component: single-binary
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
