---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: json-exporter
spec:
  dependsOn:
    - name: victoria-metrics-k8s-stack
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: json-exporter
      namespace: observability
  interval: 1h
  path: ./kubernetes/apps/observability/json-exporter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
