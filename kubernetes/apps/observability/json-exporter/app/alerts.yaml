---
# T-Mobile (WAN1) state read from the 5G gateway. Series carry
# job="tmobile-api", instance="tmobile-gateway" and no cluster label. Signal
# strength has no rule until a week of baseline exists.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: tmobile
spec:
  groups:
    - name: tmobile
      rules:
        # A scrape that succeeds without the registration series means the
        # gateway's JSON no longer matches the module. Info: no notifying rule
        # reads the gateway, because UniFiWANDown reports a WAN1 outage.
        - alert: TMobileMetricsMissing
          expr: |
            up{job="tmobile-api"} == 0
            or absent(up{job="tmobile-api"})
            or (up{job="tmobile-api"} == 1 unless on (job, instance) tmobile_registration_info{job="tmobile-api"})
          for: 10m
          labels:
            severity: info
          annotations:
            summary: T-Mobile gateway metrics are unavailable
            description: >-
              The json-exporter is not scraped, cannot fetch
              http://192.168.12.1/TMI/v1/gateway?get=all, or the response no
              longer has the fields its tmobile module reads. A gateway that
              is off or rebooting also shows as UniFiWANDown for WAN1.
              After a gateway firmware update, compare the endpoint's JSON with
              the module in the json-exporter HelmRelease.
