---
# vmagent asks the exporter to probe the gateway; the exporter answers 503
# when the gateway does not respond, so `up` covers both.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: json-exporter-tmobile
spec:
  jobName: tmobile-api
  scrapeClass: other-systems
  targetEndpoints:
    - targets:
        - json-exporter.observability.svc.cluster.local:7979
      labels:
        instance: tmobile-gateway
        platform: tmobile
      path: /probe
      params:
        module: [tmobile]
        target: ["http://192.168.12.1/TMI/v1/gateway?get=all"]
      interval: 30s
      scrapeTimeout: 10s
