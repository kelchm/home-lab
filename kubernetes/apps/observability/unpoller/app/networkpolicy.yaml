---
# Egress to the UniFi console only; the namespace baseline covers the rest.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unpoller
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unpoller
  egress:
    # The console answers on the interface of the asking VLAN, so match the name.
    - toFQDNs:
        - matchName: unifi.home.kelch.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
