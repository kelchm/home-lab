---
# Read-only view of the UniFi console: gateway, WAN, switch, port, PoE and
# access-point state. The account holds the Network View Only role.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpoller
  annotations:
    secret.reloader.stakater.com/reload: unpoller-credentials
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unpoller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unpoller
    spec:
      automountServiceAccountToken: false
      # ndots:1 so the console name resolves as an absolute name — see the
      # cloudflare-dns HelmRelease for the ndots/search-path interaction that
      # breaks Cilium toFQDNs rules otherwise.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: unpoller
          image: ghcr.io/unpoller/unpoller:v5.6.3@sha256:64c59d7915555e0335a4603cf40297f20ebea1b5f8710748ff157f5ff421d715
          args: ["--config", "/config/up.conf"]
          ports:
            - name: metrics
              containerPort: 9130
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: credentials
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: unpoller-config
        - name: credentials
          secret:
            secretName: unpoller-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: unpoller
spec:
  selector:
    app.kubernetes.io/name: unpoller
  ports:
    - name: metrics
      port: 9130
      targetPort: metrics
