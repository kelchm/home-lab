# Prometheus output only. DPI, country traffic, events, alarms, IDS and syslog
# stay at their upstream default of off.
[poller]
  quiet = true

[prometheus]
  http_listen = "0.0.0.0:9130"
  interval = "60s"
  # Keep series for ports that are down or disabled.
  dead_ports = true

[influxdb]
  disable = true

[unifi]
  dynamic = false

[unifi.defaults]
  url = "https://unifi.home.kelch.io"
  user = "unpoller-sa"
  pass = "file:///secrets/password"
  sites = ["all"]
  verify_ssl = true
  # Neighbouring access points the console can see.
  save_rogue = true
