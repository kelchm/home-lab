---
# UniFi network state read through Unpoller. Series carry job="unifi-api" and
# no cluster label; devices are identified by their UniFi name.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: unifi
spec:
  groups:
    - name: unifi
      rules:
        # Unpoller serves its last good poll from cache, so a console it can no
        # longer read shows as a growing cache age rather than a failed scrape.
        - alert: UniFiMetricsMissing
          expr: |
            max(unpoller_prometheus_cache_age_seconds{job="unifi-api"}) > 300
            or sum(up{job="unifi-api"}) == 0
            or absent(up{job="unifi-api"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: UniFi metrics are stale or missing
            description: >-
              Unpoller has not read the console for over five minutes, or is
              not being scraped. Check the unpoller pod's log, the unpoller-sa
              account and reachability of unifi.home.kelch.io:443.

        - alert: UniFiDeviceDown
          expr: max by (subsystem) (unpoller_site_disconnected{job="unifi-api"}) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $value }} UniFi {{ $labels.subsystem }} device(s) disconnected"
            description: >-
              The console counts adopted devices in the {{ $labels.subsystem }}
              subsystem that are not connected. The UniFi Devices page names them.

        # Both WANs are load-balanced, so each is ACTIVE as configured; BACKUP
        # or DISCONNECTED means the gateway has stopped balancing onto it.
        - alert: UniFiWANNotActive
          expr: unpoller_wan_interface_state{job="unifi-api"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.wan_interface }} is {{ $labels.state }}"
            description: >-
              The gateway is not balancing traffic onto {{ $labels.wan_interface }}.
              Check the load-balancing mode and failover priorities on the
              UniFi Internet page.

        # The gateway's own health check (last_wan_status). The interface
        # state below stays ACTIVE through an outage, link up or down.
        - alert: UniFiWANDown
          expr: unpoller_device_wan_status{job="unifi-api"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ with printf "unpoller_wan_interface_state{job=\"unifi-api\", wan_networkgroup=%q}" $labels.wan_networkgroup | query }}{{ . | first | label "wan_interface" }}{{ else }}{{ $labels.wan_networkgroup }}{{ end }}
              is offline
            description: >-
              The gateway's health check reports this WAN {{ $labels.status }};
              all traffic runs on the remaining WAN. Check the modem or dish,
              its own metrics, and the UniFi Internet page.

        # Escalation of the rule above. Losing both WANs cannot be delivered
        # from here; the Watchdog heartbeat to healthchecks.io covers that.
        - alert: UniFiWANOutageExtended
          expr: unpoller_device_wan_status{job="unifi-api"} == 0
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: >-
              {{ with printf "unpoller_wan_interface_state{job=\"unifi-api\", wan_networkgroup=%q}" $labels.wan_networkgroup | query }}{{ . | first | label "wan_interface" }}{{ else }}{{ $labels.wan_networkgroup }}{{ end }}
              has been offline for over an hour
            description: >-
              The lab has been on one WAN for an hour. Power-cycle the modem or
              dish, check the provider's status, and check the UniFi Internet
              page for the interface's last error.

        # Share of the gateway's pings to ping.ui.com answered on each WAN port,
        # at the 10% loss line of StarlinkPingDropSustained. eth9 is WAN and
        # eth8 is WAN2; an offline WAN is left to UniFiWANDown.
        - alert: UniFiWANPacketLoss
          expr: |
            label_replace(label_replace(
              avg_over_time(unpoller_device_wan_availability_percent{job="unifi-api"}[15m]) < 90,
              "wan_networkgroup", "WAN", "port", "eth9"), "wan_networkgroup", "WAN2", "port", "eth8")
            unless on (name, wan_networkgroup) unpoller_device_wan_status{job="unifi-api"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ with printf "unpoller_wan_interface_state{job=\"unifi-api\", wan_networkgroup=%q}" $labels.wan_networkgroup | query }}{{ . | first | label "wan_interface" }}{{ else }}{{ $labels.port }}{{ end }}
              answers {{ printf "%.0f" $value }}% of pings
            description: >-
              The gateway's pings to ping.ui.com over {{ $labels.port }} have
              averaged under 90% answered for 15 minutes, so this WAN's share
              of load-balanced flows is degraded while it still reads online.
              Compare the modem's or dish's own metrics.

        # 45 minutes outlasts T-Mobile's daily rise, which has stayed above 75 ms for up to half an hour.
        - alert: UniFiWANLatencyHigh
          expr: |
            label_replace(label_replace(
              avg_over_time(unpoller_device_wan_latency_seconds{job="unifi-api"}[15m]) > 0.075,
              "wan_networkgroup", "WAN", "port", "eth9"), "wan_networkgroup", "WAN2", "port", "eth8")
            unless on (name, wan_networkgroup) unpoller_device_wan_status{job="unifi-api"} == 0
            unless on (name, port) avg_over_time(unpoller_device_wan_availability_percent{job="unifi-api"}[15m]) < 90
          for: 45m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ with printf "unpoller_wan_interface_state{job=\"unifi-api\", wan_networkgroup=%q}" $labels.wan_networkgroup | query }}{{ . | first | label "wan_interface" }}{{ else }}{{ $labels.port }}{{ end }}
              averages {{ $value | humanizeDuration }} to its pings
            description: >-
              The gateway's pings to ping.ui.com over {{ $labels.port }} have
              averaged over 75 ms for 45 minutes while this WAN reads online
              and answers them. Check the WAN's traffic and the modem's or
              dish's own metrics; a saturating transfer or a degraded link can
              be moved off it on the UniFi Internet page.

        # The expected uplink speed of every device; any device not named here
        # must reach 1 Gb/s. The two switch LAGs report their aggregate, so one
        # member down reads as 10000. The gateway's uplink is a WAN, covered above.
        - alert: UniFiUplinkSpeedDegraded
          expr: |
            label_replace(unpoller_device_uplink_speed_mbps{job="unifi-api", name=~"Core Switch|Lab Switch"} < 20000, "expected_mbps", "20000", "", "")
            or label_replace(unpoller_device_uplink_speed_mbps{job="unifi-api", name="Core Aggregation"} < 10000, "expected_mbps", "10000", "", "")
            or label_replace(unpoller_device_uplink_speed_mbps{job="unifi-api", name=~"Basement AP|USW Flex 2.5G 8 PoE"} < 2500, "expected_mbps", "2500", "", "")
            or label_replace(unpoller_device_uplink_speed_mbps{job="unifi-api", name!~"Core Switch|Lab Switch|Core Aggregation|Basement AP|USW Flex 2.5G 8 PoE|Gateway DMP"} < 1000, "expected_mbps", "1000", "", "")
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.name }} uplink is at {{ $value }} Mb/s, expected {{ $labels.expected_mbps }}"
            description: >-
              A link negotiated below its expected speed, or a LAG member is
              down. Check the cable or transceiver at both ends and the switch
              port; the USW dashboard shows per-port speed and SFP readings.

        # Errors must pass both a count and a share of frames, so a busy link's
        # background errors and a quiet port's single error both stay silent.
        - alert: UniFiPortErrors
          expr: |
            (
              increase(unpoller_device_port_receive_errors_total{job="unifi-api"}[1h])
              + increase(unpoller_device_port_transmit_errors_total{job="unifi-api"}[1h])
            ) > 60
            and
              (
                increase(unpoller_device_port_receive_errors_total{job="unifi-api"}[1h])
                + increase(unpoller_device_port_transmit_errors_total{job="unifi-api"}[1h])
              )
              / (
                increase(unpoller_device_port_receive_packets_total{job="unifi-api"}[1h])
                + increase(unpoller_device_port_transmit_packets_total{job="unifi-api"}[1h])
              )
              > 2e-6
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.name }} port {{ $labels.port_num }} ({{ $labels.port_name }}) had {{ printf "%.0f" $value }} errors in the last hour'
            description: >-
              More than two frames in a million failed on this port. Check the
              cable, DAC or transceiver at both ends and the far end's own
              error counters.

        # The console's own port-anomaly detection; the series exists only
        # while it reports one.
        - alert: UniFiPortAnomaly
          expr: unpoller_port_anomaly_count{job="unifi-api"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ with printf "unpoller_device_info{job=\"unifi-api\", mac=%q}" $labels.device_mac | query }}{{ . | first | label "name" }}{{ else }}{{ $labels.device_mac }}{{ end }}
              port {{ $labels.port_idx }} reports {{ $labels.anomaly_type }}
            description: >-
              The console counts {{ $value }} {{ $labels.anomaly_type }} events
              on this port. The port's page in UniFi Network shows when they
              occurred.

        - alert: UniFiDHCPPoolFilling
          expr: unpoller_dhcp_utilization_percent{job="unifi-api"} > 80
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.network }} DHCP pool is {{ printf "%.0f" $value }}% used'
            description: >-
              New clients on {{ $labels.network }} get no address once the
              pool is full. Find stale leases or enlarge the pool in the
              network's settings.

        - alert: UniFiDeviceTemperatureHigh
          expr: unpoller_device_temperature_celsius{job="unifi-api"} > 70
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.name }} {{ $labels.temp_area }}{{ $labels.tag }} temperature is {{ $value }} C'
            description: >-
              Check the device's fan level, its airflow and the rack's
              temperature.

        - alert: UniFiDeviceCPUHigh
          expr: unpoller_device_cpu_utilization_ratio{job="unifi-api"} > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.name }} CPU is at {{ $value | humanizePercentage }}"
            description: '{{ $labels.name }} has used over 90% of its CPU for 15 minutes. Check its load in the UniFi console.'

        - alert: UniFiDeviceMemoryHigh
          expr: unpoller_device_memory_utilization_ratio{job="unifi-api"} > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.name }} memory is at {{ $value | humanizePercentage }}"
            description: '{{ $labels.name }} has used over 90% of its memory for 15 minutes. Check it in the UniFi console; a restart may be needed.'
