---
# Namespace baseline permits peers, DNS/API egress and kubelet probes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-syslog
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-syslog
  ingress:
    - fromCIDR:
        - 10.32.30.1/32
      toPorts:
        - ports:
            - port: '5514'
              protocol: UDP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: '9429'
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: victoria-logs-single
      toPorts:
        - ports:
            - port: '9428'
              protocol: TCP
