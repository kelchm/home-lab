---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: unifi-syslog
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: unifi-syslog
  podMetricsEndpoints:
    - port: http
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: unifi-syslog
