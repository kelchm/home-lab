---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifi-syslog
  annotations:
    # Keep received-but-undelivered rows available after a Git rollback.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      # 1 GiB queue budget plus chunk, metadata and filesystem headroom.
      storage: 3Gi
