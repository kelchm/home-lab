---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Plugins are discovered at startup. This hashed ConfigMap reference changes
# the Pod template on edits, unlike the stable sidecar dashboard ConfigMaps.
configMapGenerator:
  - name: grafana-aurora-plugin
    files:
      - ./module.js
      - ./plugin.json
      - ./apps.yaml
    options:
      immutable: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
