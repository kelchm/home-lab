---
# Grafana: admin-gateway UI access, the MCP integration edge, and node-level
# debugging in; datasources, Kanidm OIDC via the services gateway, plugin
# install, API access for the sidecars, and DNS out.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: grafana
  ingress:
    # Admin gateway (grafana.home.kelch.io) and node-level kubectl
    # port-forward handoffs. The service maps 80 to container port 3000;
    # Cilium evaluates this rule against the selected backend endpoint.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: traefik-admin-network
            app.kubernetes.io/name: traefik
            io.cilium.k8s.policy.serviceaccount: traefik-admin
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # grafana-mcp (ai namespace) talks to the Grafana HTTP API. Pair the
    # workload label with its dedicated ServiceAccount identity so a
    # compromised pod cannot gain access merely by forging an app label.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: grafana-mcp
            io.cilium.k8s.policy.serviceaccount: grafana-mcp
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    # Grafana itself and both sidecars resolve service and OIDC names.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The dashboard sidecar has a ClusterRole and watches every namespace.
    - toEntities:
        - kube-apiserver
    # Datasources: VictoriaMetrics, Alertmanager, Prometheus, VictoriaLogs,
    # and Loki. The service maps 80/8428/8429/9093/9428/3100 to the
    # container ports below; Cilium evaluates these rules against the
    # selected backend endpoints.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmsingle
            app.kubernetes.io/instance: victoria-metrics-k8s-stack
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmalertmanager
            app.kubernetes.io/instance: victoria-metrics-k8s-stack
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
            prometheus: kube-prometheus-stack-prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: victoria-logs-single
            app.kubernetes.io/instance: victoria-logs-single
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: loki
            app.kubernetes.io/instance: loki
            app.kubernetes.io/component: single-binary
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    # OIDC (auth_url/token_url/api_url point at auth.home.kelch.io, which
    # resolves to the services gateway LoadBalancer IP and terminates on the
    # traefik-services pods).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: traefik-services-network
            app.kubernetes.io/name: traefik
            io.cilium.k8s.policy.serviceaccount: traefik-services
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # GF_INSTALL_PLUGINS downloads the pinned datasource plugins from
    # grafana.com at pod start. Everything else is denied, including
    # lateral movement into pod, Service, node, LAN, storage, loopback,
    # link-local, CGNAT, or reserved space. IPv6 is disabled cluster-wide;
    # add equivalent IPv6 policy before enabling it.
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 0.0.0.0/8
            - 10.0.0.0/8
            - 100.64.0.0/10
            - 127.0.0.0/8
            - 169.254.0.0/16
            - 172.16.0.0/12
            - 192.0.0.0/24
            - 192.0.2.0/24
            - 192.168.0.0/16
            - 198.18.0.0/15
            - 198.51.100.0/24
            - 203.0.113.0/24
            - 224.0.0.0/4
            - 240.0.0.0/4
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
