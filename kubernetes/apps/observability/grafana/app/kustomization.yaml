---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./networkpolicy.yaml
  - ./helmrepository.yaml
  - ./helmrelease.yaml
  - ./secret.sops.yaml
  - ./oauth2-client.yaml
  - ./httproute.yaml

configMapGenerator:
  # grafana.com 10347 revision 5; datasource, API/node scope, CPU ratios, instant gauges, alert coverage.
  - name: grafana-dashboard-proxmox
    files:
      - proxmox.json=./proxmox-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platforms/Proxmox
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: grafana-dashboard-hosts
    files:
      - hosts.json=./hosts-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Overview
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: grafana-dashboard-spark-tensorfold
    files:
      - spark-tensorfold.json=./spark-tensorfold-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Services/AI
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: grafana-dashboard-sparks
    files:
      - sparks.json=./sparks-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platforms/Sparks
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: grafana-dashboard-synology
    files:
      - synology.json=./synology-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platforms/Synology
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: grafana-dashboard-glkvm
    files:
      - glkvm.json=./glkvm-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platforms/GLKVM
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: grafana-dashboard-node-hardware
    files:
      - node-hardware.json=./node-hardware-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platforms/Kubernetes
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: grafana-dashboard-longhorn
    files:
      - longhorn.json=./longhorn-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platforms/Kubernetes
  - name: grafana-dashboard-ntp
    files:
      - ntp.json=./ntp-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Services/Network
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: grafana-dashboard-observability-pipeline
    files:
      - observability-pipeline.json=./observability-pipeline-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Services/Observability
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: grafana-dashboard-home
    files:
      - home.json=./home-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Overview
        kustomize.toolkit.fluxcd.io/substitute: disabled
  # grafana.com 24838 revision 1; remove __inputs, clear database id and fixed datasource selection.
  - name: grafana-dashboard-grafana-internal-metrics
    files:
      - grafana-internal-metrics.json=./dashboards/grafana-internal-metrics.json
    options:
      annotations:
        grafana_folder: Services/Observability
        kustomize.toolkit.fluxcd.io/substitute: disabled
      labels:
        grafana_dashboard: "1"
# Hash suffix disabled so dashboard edits update the ConfigMap in place; the
# Grafana sidecar removes a dashboard file when a renamed predecessor is pruned.
generatorOptions:
  disableNameSuffixHash: true
