---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./networkpolicy.yaml
  - ./helmrepository.yaml
  - ./helmrelease.yaml
  - ./secret.sops.yaml
  - ./oauth2-client.yaml
  - ./httproute.yaml

configMapGenerator:
  - name: grafana-dashboard-node-hardware
    files:
      - node-hardware.json=./node-hardware-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Hardware
  - name: grafana-dashboard-kubernetes-logs
    files:
      - kubernetes-logs.json=./kubernetes-logs-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Observability
