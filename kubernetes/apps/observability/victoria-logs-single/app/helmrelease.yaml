---
# VictoriaLogs single-node — the surviving Kubernetes log backend. Alloy uses
# its Loki-compatible ingestion endpoint; operators query it through Grafana or
# the OIDC-protected native VMUI.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-single
spec:
  chart:
    spec:
      chart: victoria-logs-single
      version: 0.13.9
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  interval: 1h
  values:
    # The chart bundles a Vector subchart. We use Alloy instead — disable.
    vector:
      enabled: false

    server:
      retentionPeriod: 30d
      # Start removing the oldest partitions before the PVC is exhausted. The
      # effective retention is whichever limit (age or disk pressure) comes first.
      retentionMaxDiskUsagePercent: 80
      persistentVolume:
        enabled: true
        size: 30Gi
        storageClassName: longhorn
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      serviceMonitor:
        enabled: true   # converted for vmagent; retained KPS also scrapes during the rollback soak

    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"
