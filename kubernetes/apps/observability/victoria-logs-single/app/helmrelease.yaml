---
# VictoriaLogs single-node receives native ingestion from vlagent and syslog
# from the UniFi console. Operators query it through Grafana or the
# OIDC-protected native VMUI.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-single
spec:
  chart:
    spec:
      chart: victoria-logs-single
      version: 0.13.10
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  interval: 1h
  values:
    # vlagent is managed separately; disable the bundled Vector collector.
    vector:
      enabled: false

    server:
      retentionPeriod: 30d
      # Start removing the oldest partitions before the PVC is exhausted. The
      # effective retention is whichever limit (age or disk pressure) comes first.
      retentionMaxDiskUsagePercent: 80
      persistentVolume:
        enabled: true
        size: 30Gi
        storageClassName: longhorn
      resources:
        requests:
          cpu: 100m
          memory: 2Gi
        limits:
          memory: 4Gi
      serviceMonitor:
        enabled: true   # converted for vmagent; retained KPS also scrapes during the rollback soak
      # UniFi console export, published by syslog-service.yaml. RFC3164
      # timestamps carry no zone, so _time is the arrival time and the sender's
      # stamp, read in the console's zone, stays in `timestamp`. remote_ip
      # records the sending address.
      extraArgs:
        syslog.timezone: America/New_York
      syslog:
        udp:
          - name: syslog-udp
            value: :5514
            useLocalTimestamp: true
            useRemoteIP: true

    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Services/Observability
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ConfigMap
              name: victoria-logs-single-vector-k8s-monitoring
            patch: |
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: victoria-logs-single-vector-k8s-monitoring
              $patch: delete
