---
# UniFi syslog/CEF from the console, gateway and adopted devices into the
# Fluent Bit DaemonSet. Every node's collector listens, so each node with a
# Ready pod advertises the address and the gateway spreads senders across
# them. externalTrafficPolicy Local keeps the sender's address through Service
# translation, so the CIDR rule in fluent-bit's networkpolicy.yaml can match
# it, and keeps each datagram on the node it reached. Renaming or moving this
# Service would recreate it and leave the address without a listener.
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-syslog
  labels:
    lb-pool: admin-prod
  annotations:
    lbipam.cilium.io/ips: "10.32.130.3"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/instance: fluent-bit
    app.kubernetes.io/name: fluent-bit
  ports:
    - name: syslog
      port: 514
      targetPort: syslog
      protocol: UDP
