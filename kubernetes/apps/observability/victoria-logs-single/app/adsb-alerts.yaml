---
# The ADS-B receiver exports no metrics; its journal is the only evidence that
# the SDR is wedging or the FlightAware feed has stopped
# (docs/runbooks/host-monitoring.md#ads-b). LogsQL rules: the datasource label
# routes them to vmalert-victoria-logs. Series carry no cluster label. Nothing
# depends on the feed, so neither rule notifies.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: adsb-logs
  labels:
    alerting.home.kelch.io/datasource: victorialogs
spec:
  groups:
    - name: adsb-logs
      type: vlogs
      interval: 1m
      labels:
        platform: pi
      rules:
        # dump1090-fa gives up after a sample stall and systemd restarts it, so
        # one is self-healing. The Pi 3 it replaced logged 3 or more in an hour
        # through most of its stalling hours.
        - alert: ADSBReceiverStalling
          expr: >-
            _time:1h {service.name="dump1090-fa"} "No samples received from the SDR"
            | stats by (host.name) count() as stalls
            | filter stalls:>=3
            | rename host.name as instance
          labels:
            severity: info
          annotations:
            summary: "The SDR on {{ $labels.instance }} stalled {{ $value }} times in an hour"
            description: >-
              dump1090-fa on {{ $labels.instance }} keeps receiving no samples
              from the RTL-SDR and restarting. Check the Pi's undervoltage alarm,
              the dongle's USB power and cable, and the kernel log for USB
              disconnects.

        # The host expected to feed FlightAware: only one may run piaware with
        # the feeder ID. piaware logs its received-message count every five
        # minutes; a quiet night still sees aircraft within an hour. The host
        # must have logged in both halves of the hour, so a host that has gone
        # dark or has just booted is left to NodeMetricsMissing. Upload and
        # login failures with messages still arriving are not covered.
        - alert: ADSBFeedSilent
          expr: >-
            _time:1h {host.name="ups-office"}
            | stats by (host.name)
                count() if ({service.name="piaware"} "msgs recv'd" -"(0 in last") as heartbeats,
                count() if (_time:30m offset 30m) as earlier,
                count() if (_time:30m) as later
            | filter heartbeats:=0 earlier:>0 later:>0
            | stats by (host.name) sum(heartbeats) as heartbeats
            | rename host.name as instance
          labels:
            severity: info
          annotations:
            summary: "piaware on {{ $labels.instance }} has received no aircraft messages for an hour"
            description: >-
              {{ $labels.instance }} has been logging for the last hour, but
              piaware has logged no received messages, or nothing at all.
              Check piaware and dump1090-fa, and whether the dongle is
              connected.
