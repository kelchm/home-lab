---
# VictoriaLogs datasource for the standalone Grafana sidecar.
#
# Type is `victoriametrics-logs-datasource` — the dedicated VL plugin
# installed alongside the Grafana chart in commit 1. The plugin handles
# LogsQL natively (VL's query language; not LogQL, not PromQL) and
# exposes VL-specific features. Loki dashboards from grafana.com don't
# transplant here because the query language is genuinely different.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-vl
  labels:
    grafana_datasource: "1"
data:
  vl.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        uid: victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs-single-server.observability.svc.cluster.local:9428
        jsonData:
          # Keep the reviewed default explicit and direct Grafana's query/time
          # handoff to the browser-reachable, OIDC-protected native VMUI.
          maxLines: 1000
          vmuiUrl: https://vlogs.home.kelch.io/select/vmui/
          # Collector records carry OpenTelemetry severity_number (ranges per the
          # OTel log data model). The level and msg.level rules color retained
          # vlagent and Alloy rows; the Kubernetes logs dashboard additionally
          # normalizes their text formats at query time.
          logLevelRules:
            - field: severity_number
              value: '^([1-4])$'
              level: trace
              operator: regex
              enabled: true
            - field: severity_number
              value: '^([5-8])$'
              level: debug
              operator: regex
              enabled: true
            - field: severity_number
              value: '^(9|10|11|12)$'
              level: info
              operator: regex
              enabled: true
            - field: severity_number
              value: '^(1[3-6])$'
              level: warning
              operator: regex
              enabled: true
            - field: severity_number
              value: '^(1[7-9]|20)$'
              level: error
              operator: regex
              enabled: true
            - field: severity_number
              value: '^(2[1-4])$'
              level: critical
              operator: regex
              enabled: true
            - field: level
              value: ^([cC][rR][iI][tT][iI][cC][aA][lL]|[cC][rR][iI][tT]|[aA][lL][eE][rR][tT]|[eE][mM][eE][rR][gG][eE][nN][cC][yY]|[eE][mM][eE][rR][gG]|[fF][aA][tT][aA][lL]|[pP][aA][nN][iI][cC])$
              level: critical
              operator: regex
              enabled: true
            - field: level
              value: ^([eE][rR][rR][oO][rR]|[eE][rR][rR]|[sS][eE][vV][eE][rR][eE])$
              level: error
              operator: regex
              enabled: true
            - field: level
              value: ^([wW][aA][rR][nN]|[wW][rR][nN]|[wW][aA][rR][nN][iI][nN][gG])$
              level: warning
              operator: regex
              enabled: true
            - field: level
              value: ^([iI][nN][fF][oO]|[iI][nN][fF]|[iI][nN][fF][oO][rR][mM][aA][tT][iI][oO][nN]|[iI][nN][fF][oO][rR][mM][aA][tT][iI][oO][nN][aA][lL]|[nN][oO][tT][iI][cC][eE])$
              level: info
              operator: regex
              enabled: true
            - field: level
              value: ^([dD][eE][bB][uU][gG]|[dD][bB][gG]|[vV][eE][rR][bB][oO][sS][eE])$
              level: debug
              operator: regex
              enabled: true
            - field: level
              value: ^([tT][rR][aA][cC][eE]|[tT][rR][cC])$
              level: trace
              operator: regex
              enabled: true
            - field: msg.level
              value: ^([cC][rR][iI][tT][iI][cC][aA][lL]|[cC][rR][iI][tT]|[aA][lL][eE][rR][tT]|[eE][mM][eE][rR][gG][eE][nN][cC][yY]|[eE][mM][eE][rR][gG]|[fF][aA][tT][aA][lL]|[pP][aA][nN][iI][cC])$
              level: critical
              operator: regex
              enabled: true
            - field: msg.level
              value: ^([eE][rR][rR][oO][rR]|[eE][rR][rR]|[sS][eE][vV][eE][rR][eE])$
              level: error
              operator: regex
              enabled: true
            - field: msg.level
              value: ^([wW][aA][rR][nN]|[wW][rR][nN]|[wW][aA][rR][nN][iI][nN][gG])$
              level: warning
              operator: regex
              enabled: true
            - field: msg.level
              value: ^([iI][nN][fF][oO]|[iI][nN][fF]|[iI][nN][fF][oO][rR][mM][aA][tT][iI][oO][nN]|[iI][nN][fF][oO][rR][mM][aA][tT][iI][oO][nN][aA][lL]|[nN][oO][tT][iI][cC][eE])$
              level: info
              operator: regex
              enabled: true
            - field: msg.level
              value: ^([dD][eE][bB][uU][gG]|[dD][bB][gG]|[vV][eE][rR][bB][oO][sS][eE])$
              level: debug
              operator: regex
              enabled: true
            - field: msg.level
              value: ^([tT][rR][aA][cC][eE]|[tT][rR][cC])$
              level: trace
              operator: regex
              enabled: true
        editable: false
