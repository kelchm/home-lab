---
# VictoriaLogs UI — expose only query/UI and OIDC callback paths. Ingestion,
# metrics, and administrative endpoints remain cluster-internal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vlogs
spec:
  hostnames: ["vlogs.home.kelch.io"]
  parentRefs:
    - name: gateway-admin
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /select/vmui/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /select
        # traefik-oidc-auth owns this callback and intercepts it before the
        # request reaches VictoriaLogs.
        - path:
            type: PathPrefix
            value: /oidc
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: kanidm-oidc
      backendRefs:
        - name: victoria-logs-single-server
          port: 9428
