---
# Default-deny VictoriaLogs ingress. Each in-cluster client is limited to its
# required HTTP surface; the node retains L4 access for health checks and
# kubectl port-forward handoffs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-logs-single
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: victoria-logs-single
      app.kubernetes.io/name: victoria-logs-single
      app.kubernetes.io/component: server
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: "/insert/loki/api/v1/push.*"
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: grafana
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: traefik-admin-network
            io.cilium.k8s.policy.serviceaccount: traefik-admin
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "/select/.*"
              - method: POST
                path: "/select/.*"
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "/metrics$"
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
