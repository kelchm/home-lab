---
# Kanidm exposes no metrics, so replication and sign-in failures are visible
# only in its log (docs/runbooks/logging.md#log-alerts). LogsQL rules: the
# datasource label routes them to vmalert-victoria-logs. The matched text
# comes from kanidm's source; routine errors such as "Invalid identity:
# NotAuthenticated" never match. They live here rather than with kanidm so
# identity's reconciliation never waits on the monitoring stack's CRDs.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: kanidm-logs
  labels:
    alerting.home.kelch.io/datasource: victorialogs
spec:
  groups:
    - name: kanidm-logs
      type: vlogs
      interval: 1m
      labels:
        cluster: k8s-prod
      rules:
        # Each consumer polls every supplier every 15 seconds and logs each
        # failed poll, so a lasting failure logs every minute; restarts log
        # for a minute or two. Counting minutes rather than errors keeps a
        # burst from holding the alert after recovery.
        - alert: KanidmReplicationFailing
          expr: >-
            _time:20m {k8s.namespace.name="identity", service.name="kanidm"}
            k8s.cluster.name:=k8s-prod severity_number:>=17
            _msg:~"(?i)supplier|consumer|replica|RUV"
            | stats by (k8s.pod.name, _time:1m) count() as failures
            | stats by (k8s.pod.name) count() as minutes
            | filter minutes:>=15
            | rename k8s.pod.name as pod
          labels:
            severity: warning
          annotations:
            summary: "Kanidm replication is failing on {{ $labels.pod }}"
            description: >-
              {{ $labels.pod }} logged replication errors in {{ $value }} of
              the last 20 minutes, so changes made on one replica may not be
              reaching the others. A node that has been down that long also
              causes this; otherwise read the pod's replication errors in
              VictoriaLogs. "must be refreshed" needs a manual consumer
              refresh.

        # A failed credential logs "Result::Denied" at error level and
        # "Auth result: Denied" at info; a softlocked account logs only the
        # latter and an unknown account "Auth result: NoMatchingEntries".
        # Each line starts with its request ID, so attempts are counted once.
        # In the 30 days to October 19, 2026: one unknown account, nothing else.
        - alert: KanidmSignInsRejected
          expr: >-
            _time:15m {k8s.namespace.name="identity", service.name="kanidm"}
            k8s.cluster.name:=k8s-prod
            ("Result::Denied" OR "Auth result: Denied" OR "Auth result: NoMatchingEntries")
            | extract "<request> " from _msg
            | stats count_uniq(request) as denials
            | filter denials:>=5
          labels:
            severity: warning
          annotations:
            summary: "Kanidm rejected {{ $value }} sign-in attempts in 15 minutes"
            description: >-
              Kanidm rejected {{ $value }} sign-in attempts in 15 minutes:
              wrong credentials, a softlocked account or an unknown account
              name. The request line that shares a denial's leading ID gives
              the client address; for browser sign-ins that is Traefik, so
              match the time in Traefik's access log for auth.home.kelch.io.
              Treat an unknown source as a compromised device.
