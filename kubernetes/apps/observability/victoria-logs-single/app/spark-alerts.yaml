---
# An allocation failure is in the kernel log and nowhere else: the engine can
# report nothing, or wedge (docs/runbooks/logging.md#log-alerts). LogsQL rules:
# the datasource label routes them to vmalert-victoria-logs. Series carry no
# cluster label.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: spark-logs
  labels:
    alerting.home.kelch.io/datasource: victorialogs
spec:
  groups:
    - name: spark-logs
      type: vlogs
      interval: 1m
      labels:
        platform: spark
      rules:
        # A warning because one or two isolated lines have been harmless on
        # other pairs. Repeats mean the engine is going down.
        - alert: NodeGPUMemoryExhausted
          expr: >-
            _time:15m {service.name="kernel"} service.namespace:=spark "NV_ERR_NO_MEMORY"
            | stats by (host.name) count() as failures
            | rename host.name as instance
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} logged {{ $value }} GPU memory failures in 15 minutes"
            description: >-
              The kernel on {{ $labels.instance }} logged NV_ERR_NO_MEMORY. A
              failed allocation latches the engine broken, so check /health
              on spark-1. Restart the model if it reports a fault or the
              failures repeat.

        # Native Zig TensorFold logs disk prompt-cache verification failures
        # (`--learn-conversations` with `TF_IMPRINT_VERIFY=1`) either through
        # the default threaded writer (`warning: prompt cache: imprint: writing
        # ... failed (VerifyFailed)`) or synchronous `error: imprint verify:`.
        - alert: InferenceDiskCacheVerifyFailed
          expr: >-
            _time:15m {service.name="inference"} service.namespace:=spark event.name:=inference.disk_cache.verify_failed
            | stats by (host.name, inference.model) count() as failures
            | rename host.name as instance, inference.model as model
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} failed {{ $value }} disk prompt-cache checks for {{ $labels.model }}"
            description: >-
              Native TensorFold reported a disk prompt-cache verification
              mismatch or read error on {{ $labels.instance }}. Inspect the
              inference logs for imprint verify or VerifyFailed lines and check
              the host disk before trusting saved conversation states.
