---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pve-exporter
spec:
  # Suspended while the pve-exporter-credentials Secret does not exist.
  suspend: true
  dependsOn:
    - name: victoria-metrics-k8s-stack
  interval: 1h
  path: ./kubernetes/apps/observability/pve-exporter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: true
