---
# Node log collector: Kubernetes container stdout/stderr, Talos service and
# kernel logs, and UniFi syslog, normalized onto the OpenTelemetry log data
# model and delivered to VictoriaLogs over OTLP. The pipeline lives in the
# fluent-bit-config ConfigMap (config/), not chart values.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
spec:
  chart:
    spec:
      chart: fluent-bit
      version: 0.58.3
      sourceRef:
        kind: HelmRepository
        name: fluent
  interval: 1h
  values:
    image:
      repository: fluent/fluent-bit
      tag: 5.1.5@sha256:2740f387f6e68fab66d28e4fa6a853387b9cab6ffb4cb78958f69bba4eb0e7b4

    existingConfigMap: fluent-bit-config
    # The chart checksums only its own ConfigMap.
    annotations:
      reloader.stakater.com/auto: "true"

    testFramework:
      enabled: false

    # The Lua mapping converts timestamps with os.time, and names the node on
    # Talos records.
    env:
      - name: TZ
        value: UTC
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName

    # UniFi syslog, published by the victoria-logs-syslog Service, and Talos
    # logs, published by the fluent-bit-talos Service.
    extraPorts:
      - name: syslog
        port: 5140
        containerPort: 5140
        protocol: UDP
      - name: talos
        port: 5170
        containerPort: 5170
        protocol: TCP

    tolerations:
      - operator: Exists
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    # Above the pipeline's 30-second flush grace.
    terminationGracePeriodSeconds: 60

    # Health_Check stays off: a backend outage must not restart the collector.
    livenessProbe:
      httpGet:
        path: /
        port: http
    readinessProbe:
      httpGet:
        path: /
        port: http

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi

    securityContext:
      runAsUser: 0
      runAsGroup: 0
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault

    # /var/log/containers symlinks resolve into /var/log/pods. Tail positions
    # and the filesystem buffer persist in /var/lib/fluent-bit.
    daemonSetVolumes:
      - name: containers
        hostPath:
          path: /var/log/containers
          type: Directory
      - name: pods
        hostPath:
          path: /var/log/pods
          type: Directory
      - name: state
        hostPath:
          path: /var/lib/fluent-bit
          type: DirectoryOrCreate
    daemonSetVolumeMounts:
      - name: containers
        mountPath: /var/log/containers
        readOnly: true
      - name: pods
        mountPath: /var/log/pods
        readOnly: true
      - name: state
        mountPath: /var/lib/fluent-bit

    serviceMonitor:
      enabled: false

    dashboards:
      enabled: true
      labelKey: grafana_dashboard
      labelValue: "1"
      annotations:
        grafana_folder: Services/Observability
