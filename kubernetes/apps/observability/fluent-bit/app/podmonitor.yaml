---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: fluent-bit
      app.kubernetes.io/name: fluent-bit
  podMetricsEndpoints:
    - port: http
      path: /api/v2/metrics/prometheus
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: fluent-bit
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
    # Tail input truncation counters exist only on the v1 endpoint; keep just
    # those so no counter is scraped twice.
    - port: http
      path: /api/v1/metrics/prometheus
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: fluent-bit
        # Keeps this target's up and scrape series apart from the v2 target's.
        - targetLabel: endpoint
          replacement: http-v1
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: fluentbit_input_(long_line_skipped|long_line_truncated|multiline_truncated)_total
          action: keep
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fluent-bit-events
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: fluent-bit-events
      app.kubernetes.io/name: fluent-bit
  podMetricsEndpoints:
    - port: http
      path: /api/v2/metrics/prometheus
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: fluent-bit-events
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
