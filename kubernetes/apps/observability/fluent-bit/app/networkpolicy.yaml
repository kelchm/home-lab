---
# Namespace baseline already permits observability peers, DNS and API access.
# This records the collector's required flows; Cilium allow rules are additive.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fluent-bit
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: '2020'
              protocol: TCP
    # UniFi syslog through the victoria-logs-syslog LoadBalancer. The gateway
    # sources traffic to BGP-routed VIPs from its VLAN 30 interface; adopted
    # switches and APs send from their Default network management addresses.
    - fromCIDR:
        - 10.32.30.1/32
        - 10.32.1.0/24
      toPorts:
        - ports:
            - port: '5140'
              protocol: UDP
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: victoria-logs-single
      toPorts:
        - ports:
            - port: '9428'
              protocol: TCP
