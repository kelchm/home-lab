[PARSER]
    Name   json_payload
    Format json

# RFC 3164 as UniFi sends it: the priority is absent on CEF lines, and one
# datagram is one message even when it spans lines (switch driver messages).
# The header timestamp carries no zone, so the record keeps its arrival time.
[PARSER]
    Name   unifi_syslog
    Format regex
    Regex  \A(?:<(?<pri>[0-9]{1,3})>)?(?:[A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2} (?<host>[^ ]+) )?(?<message>[\s\S]*)
