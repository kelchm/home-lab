# Kubernetes container stdout/stderr, Talos service and kernel logs, and UniFi
# syslog → OpenTelemetry-shaped records → VictoriaLogs OTLP. Mapping:
# normalize.lua and unifi.lua.
# Operations: docs/runbooks/logging.md.

[SERVICE]
    Flush                     1
    Grace                     30
    Daemon                    Off
    Log_Level                 warn
    Parsers_File              /fluent-bit/etc/conf/parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    storage.path              /var/lib/fluent-bit/storage
    storage.sync              full
    # ChunkIO finalizes a chunk's CRC only on sync, so On discards every chunk
    # being written when the collector is killed.
    storage.checksum          Off
    storage.backlog.mem_limit 16M
    # Chunks held in memory (up to ~2 MiB each) under the 256Mi limit.
    storage.max_chunks_up     16
    storage.metrics           On
    # Retry buffered chunks at least every 30 s (default backoff cap: 2000 s).
    scheduler.cap             30

# Current files only: matching kubelet-rotated files replays them as duplicates.
# Read_from_Head keeps the start of every newly discovered file (new pods).
[INPUT]
    Name              tail
    Alias             pods
    Tag               kube.*
    Path              /var/log/containers/*.log
    multiline.parser  cri
    DB                /var/lib/fluent-bit/tail.db
    DB.sync           full
    Read_from_Head    On
    Refresh_Interval  5
    Rotate_Wait       30
    Buffer_Chunk_Size 64k
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    storage.type      filesystem

[FILTER]
    Name                kubernetes
    Match               kube.*
    Buffer_Size         0
    Labels              On
    Annotations         On
    Owner_References    On
    Merge_Log           Off
    K8S-Logging.Parser  Off
    K8S-Logging.Exclude Off

[FILTER]
    Name          lua
    Match         kube.*
    Script        /fluent-bit/etc/conf/normalize.lua
    Call          capture

[FILTER]
    Name         parser
    Match        kube.*
    Key_Name     log
    Parser       json_payload
    Reserve_Data Off

[FILTER]
    Name          lua
    Match         kube.*
    Script        /fluent-bit/etc/conf/normalize.lua
    Call          normalize
    Type_Int_Key  severity_number code.line.number thread.id
    # JSON null reaches Lua as flb_null rather than a hole in arrays and maps.
    Enable_Flb_Null On

# Each tail tag is one container file, so every chunk carries one resource.
[OUTPUT]
    Name                     opentelemetry
    Alias                    victorialogs
    Match                    kube.*
    Host                     victoria-logs-single-server.observability.svc.cluster.local
    Port                     9428
    Logs_URI                 /insert/opentelemetry/v1/logs
    Header                   VL-Stream-Fields service.name,k8s.namespace.name,k8s.pod.name,k8s.container.name,k8s.node.name
    # VictoriaLogs fills an empty instrumentation scope with "unknown".
    Header                   VL-Ignore-Fields scope.name,scope.version
    Logs_Body_Key            $body
    Logs_Body_Key_Attributes Off
    Retry_Limit              no_limits
    storage.total_limit_size 4G

# UniFi console, gateway and adopted-device syslog through the
# victoria-logs-syslog LoadBalancer, which preserves the sender's address.
[INPUT]
    Name               syslog
    Alias              unifi
    Tag                unifi
    Mode               udp
    Listen             0.0.0.0
    Port               5140
    Parser             unifi_syslog
    Source_Address_Key source_address
    storage.type       filesystem

# One tag per device, by hostname or else sender address: the OTLP output
# takes a chunk's resource from its first record.
[FILTER]
    Name                 rewrite_tag
    Match                unifi
    Rule                 $host ^. unifi.$host false
    Rule                 $source_address ^udp://([^:]+): unifi.$1 false
    Emitter_Name         unifi_devices
    Emitter_Storage.type filesystem

[FILTER]
    Name          lua
    Match         unifi*
    Script        /fluent-bit/etc/conf/unifi.lua
    Call          normalize
    Type_Int_Key  severity_number network.peer.port
    Time_as_Table On

[OUTPUT]
    Name                     opentelemetry
    Alias                    unifi
    Match                    unifi*
    Host                     victoria-logs-single-server.observability.svc.cluster.local
    Port                     9428
    Logs_URI                 /insert/opentelemetry/v1/logs
    # The CEF fields keep the stream filters in unifi-alerts.yaml selective.
    Header                   VL-Stream-Fields service.name,cef.device_product,cef.device_event_class_id
    Header                   VL-Ignore-Fields scope.name,scope.version
    Logs_Body_Key            $body
    Logs_Body_Key_Attributes Off
    Retry_Limit              no_limits
    storage.total_limit_size 256M

# Talos service and kernel logs from this node's machined, as json_lines over
# TCP through the fluent-bit-talos Service (internalTrafficPolicy Local).
# Talos lines reach 64 KiB, and Go's JSON encoding writes some bytes as six;
# a message over Buffer_Size closes the connection.
[INPUT]
    Name          tcp
    Alias         talos
    Tag           talos
    Listen        0.0.0.0
    Port          5170
    Format        json
    Buffer_Size   512K
    storage.type  filesystem

# No per-service tags: an emitter pauses this input at storage.max_chunks_up,
# and a paused tcp input closes every connection, losing what Talos wrote.
[FILTER]
    Name          lua
    Alias         talos
    Match         talos
    Script        /fluent-bit/etc/conf/normalize.lua
    Call          talos_normalize
    Type_Int_Key  severity_number code.line.number thread.id kernel.seq kernel.clock
    Time_as_Table On
    Enable_Flb_Null On

[OUTPUT]
    Name                     opentelemetry
    Alias                    talos
    Match                    talos
    Host                     victoria-logs-single-server.observability.svc.cluster.local
    Port                     9428
    Logs_URI                 /insert/opentelemetry/v1/logs
    Header                   VL-Stream-Fields service.name,k8s.node.name
    Header                   VL-Ignore-Fields scope.name,scope.version
    Logs_Body_Key            $body
    Logs_Body_Key_Attributes Off
    Retry_Limit              no_limits
    storage.total_limit_size 256M
