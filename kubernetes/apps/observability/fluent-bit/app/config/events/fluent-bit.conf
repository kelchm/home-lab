# Kubernetes events from the API server's watch → OpenTelemetry-shaped records
# → VictoriaLogs OTLP. Mapping: events.lua.
# Operations: docs/runbooks/logging.md#kubernetes-events.

[SERVICE]
    Flush                 1
    Grace                 30
    Daemon                Off
    Log_Level             warn
    HTTP_Server           On
    HTTP_Listen           0.0.0.0
    HTTP_Port             2020
    storage.path          /var/lib/fluent-bit/storage
    storage.sync          full
    # As in the node collectors: On discards chunks being written at a kill.
    storage.checksum      Off
    # Chunks held in memory (up to ~2 MiB each) under the 128Mi limit.
    storage.max_chunks_up 16
    storage.metrics       On
    scheduler.cap         30

# No DB: it keeps each event once by uid, dropping a repeated event's later
# counts. Without it, a new process re-sends the events the API server holds.
# Retention is effectively off: the input dates an event series by its
# creation, and the API server's one-hour TTL, renewed on every write, already
# bounds what a list returns. Beyond about 56 years the cutoff underflows and
# drops every event.
[INPUT]
    Name                kubernetes_events
    Alias               events
    Tag                 events
    kube_retention_time 3650d
    storage.type        filesystem

[FILTER]
    Name          lua
    Match         events
    Script        /fluent-bit/etc/conf/events.lua
    Call          normalize
    Type_Int_Key  severity_number k8s.event.count
    Time_as_Table On

[OUTPUT]
    Name                     opentelemetry
    Alias                    events
    Match                    events
    Host                     victoria-logs-single-server.observability.svc.cluster.local
    Port                     9428
    Logs_URI                 /insert/opentelemetry/v1/logs
    Header                   VL-Stream-Fields service.name,k8s.namespace.name
    Header                   VL-Ignore-Fields scope.name,scope.version
    Logs_Body_Key            $body
    Logs_Body_Key_Attributes Off
    Retry_Limit              no_limits
    storage.total_limit_size 256M
