---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - podmonitor.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: fluent-bit-config
    files:
      - config/fluent-bit.conf
      - config/parsers.conf
      - config/normalize.lua
generatorOptions:
  disableNameSuffixHash: true
