---
# On gateway-services because the Workloads VLAN cannot reach gateway-admin.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metrics-ingest
spec:
  hostnames: ["metrics-ingest.home.kelch.io"]
  parentRefs:
    - name: gateway-services
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: vmauth-metrics-ingest
          port: 8427
