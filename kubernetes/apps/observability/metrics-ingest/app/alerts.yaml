---
# PVE nodes, Sparks, the NAS and Pis. Series keep the `instance` (node) and `platform`
# (type) their ingestion token gives them; this group adds no cluster label. The CPU
# and NVMe temperature rules also read the k8s-prod nodes' node-exporter, whose
# series carry their own `cluster`.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: hosts
spec:
  groups:
    - name: hosts
      rules:
        # A node is enrolled once it has reported; one that falls silent keeps
        # alerting for a week, after which it counts as retired.
        - alert: NodeMetricsMissing
          expr: time() - tlast_over_time(up{job=~"(pve|spark|synology|pi)-node"}[7d]) > 600
          labels:
            severity: warning
          annotations:
            summary: No metrics from {{ $labels.instance }} for {{ $value | humanizeDuration }}
            description: >-
              Check the node, its collector containers, its token and the
              ingestion endpoint. Samples queued on the node replay with their
              original timestamps once delivery resumes.

        - alert: NodeCollectorDown
          expr: up{job=~"(pve|spark|synology|pi)-(node|gpu|snmp|smartctl|vmagent|deployer|blackbox-exporter|fluent-bit)"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Collector {{ $labels.job }} is down on {{ $labels.instance }}
            description: 'The {{ $labels.job }} scrape on {{ $labels.instance }} has failed for ten minutes, so the rules that read it see nothing while the machine itself still reports. Check that collector''s container on the host.'

        - alert: NodeFilesystemSpaceLow
          expr: |
            node_filesystem_avail_bytes{job=~"(pve|spark|synology|pi)-node", fstype!~"tmpfs|overlay|squashfs|ramfs|efivarfs|nfs.*|cifs|fuse.*"}
            / node_filesystem_size_bytes{job=~"(pve|spark|synology|pi)-node", fstype!~"tmpfs|overlay|squashfs|ramfs|efivarfs|nfs.*|cifs|fuse.*"}
            < 0.10
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} has {{ $value | humanizePercentage }} free"
            description: 'Less than 10% of {{ $labels.mountpoint }} on {{ $labels.instance }} has been free for 30 minutes. Find what is growing before the filesystem fills.'

        # Available memory is low by design on a Spark with a model loaded, so
        # this uses stall time rather than a free-memory threshold.
        - alert: NodeMemoryStalled
          expr: rate(node_pressure_memory_stalled_seconds_total{job=~"(pve|spark|pi)-node"}[5m]) > 0.10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} is stalled on memory {{ $value | humanizePercentage }} of the time"
            description: 'Tasks on {{ $labels.instance }} spent over 10% of the last five minutes waiting for memory, by pressure stall information; memory use alone is not the signal. Check which processes are reclaiming or swapping.'

        # Headroom to the drive's own warning temperature, above which it throttles.
        - alert: NodeNVMeCompositeTemperatureCritical
          expr: |
            (
              node_hwmon_temp_max_celsius{job=~"node-exporter|(pve|spark)-node"}
              - node_hwmon_temp_celsius{job=~"node-exporter|(pve|spark)-node"}
            )
            * on (instance, chip, sensor) group_left (label)
              node_hwmon_sensor_label{job=~"node-exporter|(pve|spark)-node", label="Composite"}
            < 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: NVMe on {{ $labels.instance }} is {{ printf "%.0f" $value }} C from its warning temperature
            description: 'The NVMe drive on {{ $labels.instance }} has been within 5 C of its own warning temperature for five minutes. Above it, the drive throttles and raises a SMART warning. Check airflow around the drive.'

        # Pods are covered by Kubernetes; this catches the kernel killing a process on the host itself.
        - alert: NodeOOMKillDetected
          expr: increase(node_vmstat_oom_kill{job=~"(pve|spark|pi)-node"}[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: The kernel killed a process for memory on {{ $labels.instance }}
            description: Find the process with `journalctl -k | grep -i "killed process"` on the host, and check that it came back.

        # Headroom to each CPU's own limit: the critical temperature the PVE hosts report;
        # 95 C for the k8s-prod nodes' Ryzen, which reports none, read from the hotter of
        # its CPU (Tctl) and integrated GPU (edge) sensors; and 85 C, where a Pi 5 throttles.
        - alert: NodeCPUTemperatureCritical
          expr: |
            min by (cluster, instance, job, platform) (
              (node_hwmon_temp_crit_celsius{job="pve-node"} - node_hwmon_temp_celsius{job="pve-node"})
              * on (instance, chip, sensor) group_left
                node_hwmon_sensor_label{job="pve-node", label="Package id 0"}
              or
              (95 - node_hwmon_temp_celsius{job="node-exporter"})
              * on (instance, chip, sensor) group_left
                node_hwmon_sensor_label{job="node-exporter", label=~"Tctl|edge"}
              or
              (85 - node_hwmon_temp_celsius{job="pi-node"})
              * on (instance, chip) group_left
                node_hwmon_chip_names{job="pi-node", chip_name="cpu_thermal"}
            ) < 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: CPU on {{ $labels.instance }} is {{ printf "%.0f" $value }} C from its limit
            description: 'The CPU on {{ $labels.instance }} has been within 5 C of its limit for five minutes: the critical temperature a PVE host reports, 95 C for a k8s-prod node, or 85 C, where a Pi 5 throttles. Check cooling and load.'

        # The Pi firmware's undervoltage alarm; node-exporter scales it as millivolts, so a set alarm reads 0.001.
        - alert: NodeSupplyVoltageLow
          expr: node_hwmon_in_lcrit_alarm_volts{job="pi-node", chip=~".*firmware_raspberrypi_hwmon", sensor="in0"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} is running undervolted"
            description: 'The Pi firmware on {{ $labels.instance }} has reported undervoltage for 15 minutes. An undervolted Pi throttles its CPU. Check the power supply and its cable: a long or thin USB cable drops voltage.'

        # Read over the window rather than held with for:, so an evaluator restart doesn't reset the wait.
        - alert: NodeSecurityUpdatesPending
          expr: |
            apt_security_upgrades_pending{job=~"(pve|spark)-node"} > 0
            and min_over_time(apt_security_upgrades_pending{job=~"(pve|spark)-node"}[3d]) > 0
            and apt_security_upgrades_pending{job=~"(pve|spark)-node"} offset 3d > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} has had security updates waiting for three days"
            description: 'Packages from a security archive have had upgrades available on {{ $labels.instance }} for three days; {{ $value }} are waiting now. Install them, then reboot the host if they need it.'

        - alert: NodePackageListsStale
          expr: time() - apt_package_lists_refreshed_timestamp_seconds{job=~"(pve|spark)-node"} > 2 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} hasn't refreshed its package lists for {{ $value | humanizeDuration }}"
            description: 'Its pending-update counts may be out of date. Check the daily refresh (pve-daily-update on PVE, apt-daily on a Spark) and the apt-metrics container.'

        # A Spark's GB10 publishes a temperature limit only for its GPU; slowing for heat is the chip at that limit.
        - alert: NodeGPUThermalThrottling
          expr: |
            max by (instance, platform) (
              {__name__=~"nvidia_smi_clocks_event_reasons_(hw|sw)_thermal_slowdown", job="spark-gpu"}
            ) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: GPU on {{ $labels.instance }} is thermally throttled
            description: 'The GPU on {{ $labels.instance }} has been slowing its clocks for heat for five minutes. Check the Spark''s airflow and its workload.'

        - alert: NodeMetricsDropped
          expr: increase(vm_persistentqueue_bytes_dropped_total{job=~"(pve|spark|synology|pi)-vmagent"}[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} discarded queued metrics"
            description: >-
              The 1 GiB on-disk queue filled while the ingestion endpoint was
              unreachable, so the oldest samples were dropped.

        # Each host's Fluent Bit keeps its journal cursor and buffers up to 256 MiB on disk, so
        # an unreachable endpoint delays its logs; only a full buffer loses them.
        - alert: NodeLogDeliveryFailing
          expr: increase(fluentbit_output_retries_total{job=~"(pve|spark)-fluent-bit"}[10m]) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} cannot deliver its logs"
            description: >-
              Its Fluent Bit has been retrying for 30 minutes and is buffering
              the journal on disk. Check the ingestion endpoint and the
              fluent-bit container's log on the node.

        - alert: NodeLogsDropped
          expr: increase(fluentbit_output_dropped_records_total{job=~"(pve|spark)-fluent-bit"}[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} discarded log records"
            description: >-
              Its Fluent Bit dropped records it could not deliver, which
              happens when its 256 MiB on-disk buffer is full or VictoriaLogs
              rejects them. Check the fluent-bit container's log on the node.

        - alert: NodeLogsSilent
          expr: increase(fluentbit_input_records_total{job=~"(pve|spark)-fluent-bit", name="journal"}[2h]) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} has read nothing from its journal for two hours"
            description: >-
              A running host writes to its journal every few minutes, so its
              Fluent Bit has likely lost the journal. Check the fluent-bit
              container's log and its journal mounts on the node.

        - alert: NodeDeployFailing
          expr: increase(doco_cd_deployment_errors_total{job=~"(pve|spark)-deployer"}[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} cannot deploy {{ $labels.deployment }} from Git"
            description: >-
              The node keeps running its last deployed collectors. Check the
              doco-cd container log on the node.

    # DSM's own assessment through SNMP. Status codes are from the Synology MIBs.
    - name: nas
      rules:
        - alert: NASRAIDDegraded
          expr: raidStatus{job="synology-snmp"} == 11 or raidStatus{job="synology-snmp"} == 12
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.raidName }} on {{ $labels.instance }} is {{ if eq $value 12.0 }}crashed{{ else }}degraded{{ end }}"
            description: 'DSM reports {{ $labels.raidName }} as degraded or crashed, so it has lost redundancy or data. Check Storage Manager before replacing any disk.'

        - alert: NASDiskHealthWarning
          expr: diskHealthStatus{job="synology-snmp"} == 2
          labels:
            severity: warning
          annotations:
            summary: DSM reports a health warning for {{ $labels.diskID }} on {{ $labels.instance }}
            description: 'DSM''s health status for {{ $labels.diskID }} is Warning. Check the disk''s SMART details in Storage Manager and plan a replacement.'

        - alert: NASDiskTemperatureHigh
          expr: diskTemperature{job="synology-snmp"} > 50
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.diskID }} on {{ $labels.instance }} is at {{ $value }} C"
            description: '{{ $labels.diskID }} has been above 50 C for 15 minutes. Check the NAS fans and the room temperature.'

        # upgradeAvailable is 1 when an update is available; 2 none, 3-5 checking or unknown. Every sample of the
        # last week and the one a week ago must be 1.
        - alert: NASDSMUpdatePending
          expr: |
            max_over_time(upgradeAvailable{job="synology-snmp"}[7d]) == 1
            and upgradeAvailable{job="synology-snmp"} offset 7d == 1
          labels:
            severity: warning
          annotations:
            summary: DSM on {{ $labels.instance }} has had an update waiting for a week
            description: 'DSM has offered an update for seven days. Read the release notes, check the backups are current, and install it from Control Panel.'

        - alert: NASHardwareFault
          expr: |
            label_replace(
              {__name__=~"systemStatus|powerStatus|systemFanStatus|cpuFanStatus", job="synology-snmp"},
              "component", "$1", "__name__", "(.+)Status"
            ) == 2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: DSM reports a {{ $labels.component }} failure on {{ $labels.instance }}
            description: 'DSM has reported a failed {{ $labels.component }} for five minutes. Check the system status in DSM.'

        # NUT status flags from the UPS DSM is attached to: OB on battery, LB low battery.
        - alert: UPSOnBattery
          expr: upsInfoStatus{job="synology-snmp", upsInfoStatus=~"(.* )?OB( .*)?"} == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: The UPS on {{ $labels.instance }} is on battery
            description: 'The network-rack UPS, read by the NAS over SNMP, has been on battery for a minute: its mains power has failed.'

        - alert: UPSBatteryLow
          expr: upsInfoStatus{job="synology-snmp", upsInfoStatus=~"(.* )?LB( .*)?"} == 1
          labels:
            severity: critical
          annotations:
            summary: The UPS on {{ $labels.instance }} reports a low battery
            description: 'The network-rack UPS, read by the NAS over SNMP, reports a low battery and may cut power soon.'

    # NUT status flags and runtime from the UPS a Pi monitors, through nut_exporter.
    - name: pi-ups
      rules:
        - alert: UPSOnBattery
          expr: network_ups_tools_ups_status{job="pi-nut", flag="OB"} == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: The {{ $labels.ups }} UPS on {{ $labels.instance }} is on battery
            description: 'The {{ $labels.ups }} UPS has been on battery for a minute: its mains power has failed.'

        - alert: UPSRuntimeLow
          expr: |
            network_ups_tools_battery_runtime{job="pi-nut"} < 300
            and on (instance, platform, ups)
            network_ups_tools_ups_status{job="pi-nut", flag="OB"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: The {{ $labels.ups }} UPS on {{ $labels.instance }} has {{ $value | humanizeDuration }} of battery left
            description: 'The {{ $labels.ups }} UPS is on battery with under five minutes of runtime left at its present load.'

        - alert: UPSBatteryLow
          expr: network_ups_tools_ups_status{job="pi-nut", flag="LB"} == 1
          labels:
            severity: critical
          annotations:
            summary: The {{ $labels.ups }} UPS on {{ $labels.instance }} reports a low battery
            description: 'The {{ $labels.ups }} UPS reports a low battery and may cut power soon.'

        # A UPS that has reported in the last week but sent no status for five
        # minutes, which also covers its collector being down: NUT errors and
        # stale driver data fail the whole scrape. Only while the Pi itself
        # reports: a Pi that has gone dark is NodeMetricsMissing's.
        - alert: UPSMetricsMissing
          expr: |
            max by (instance, platform, ups) (tlast_over_time(up{job="pi-nut"}[7d]))
            unless on (instance, platform, ups)
            max by (instance, platform, ups) (tlast_over_time(network_ups_tools_ups_status{job="pi-nut"}[5m]))
            and on (instance)
            max by (instance) (present_over_time(up{job="pi-node"}[2m]))
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: No status from the {{ $labels.ups }} UPS on {{ $labels.instance }} for over five minutes
            description: 'The UPS has reported in the last week, but NUT on {{ $labels.instance }} has sent no status for five minutes, so the on-battery and runtime alerts cannot fire. Check the NUT driver and the UPS''s USB connection.'
