---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./vmauth.yaml
  - ./vmusers.yaml
  - ./tokens.sops.yaml
  - ./httproute.yaml
  - ./networkpolicy.yaml
  - ./alerts.yaml

configMapGenerator:
  # grafana.com 21394 revision 13; datasource provisioning.
  - name: grafana-dashboard-stock-vmauth
    files:
      - stock-vmauth.json=./dashboards/stock-vmauth.json
    options:
      annotations:
        grafana_folder: Services/Observability
        kustomize.toolkit.fluxcd.io/substitute: disabled
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true
