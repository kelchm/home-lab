---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: pi-probes
spec:
  groups:
    - name: pi-probes
      rules:
        # Exporter failures belong to NodeCollectorDown, not every destination.
        - alert: ProbeFailed
          expr: |
            (
              probe_success{job="pi-blackbox"} == 0
              or on (instance, platform, probe)
              up{job="pi-blackbox"} == 0
            )
            and on (instance, platform)
            (up{job="pi-blackbox-exporter"} == 1)
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Probe {{ $labels.probe }} is failing from {{ $labels.instance }}"
            description: "{{ $labels.target }} failed the {{ $labels.module }} probe. Check the destination, DNS and the routed path from VLAN 20."
            runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/host-monitoring.md#service-probes

        # Expected inventory from rpi-nixos hosts/ups-compute-rack/probes.nix.
        # Update this list with intentional target additions/removals there.
        # A failed scrape belongs to ProbeFailed; an exporter outage belongs
        # to NodeCollectorDown. Neither should also report a vanished probe.
        - alert: ProbeMetricsMissing
          expr: |
            (
              absent_over_time(probe_success{job="pi-blackbox",instance="ups-compute-rack",platform="pi",probe="gateway-admin"}[5m])
              or absent_over_time(probe_success{job="pi-blackbox",instance="ups-compute-rack",platform="pi",probe="gateway-services"}[5m])
              or absent_over_time(probe_success{job="pi-blackbox",instance="ups-compute-rack",platform="pi",probe="kanidm"}[5m])
              or absent_over_time(probe_success{job="pi-blackbox",instance="ups-compute-rack",platform="pi",probe="jellyfin"}[5m])
              or absent_over_time(probe_success{job="pi-blackbox",instance="ups-compute-rack",platform="pi",probe="grafana"}[5m])
              or absent_over_time(probe_success{job="pi-blackbox",instance="ups-compute-rack",platform="pi",probe="homepage"}[5m])
              or absent_over_time(probe_success{job="pi-blackbox",instance="ups-compute-rack",platform="pi",probe="cloudflare-tunnel"}[5m])
              or absent_over_time(probe_success{job="pi-blackbox",instance="ups-compute-rack",platform="pi",probe="athena-dsm"}[5m])
              or absent_over_time(probe_success{job="pi-blackbox",instance="ups-compute-rack",platform="pi",probe="kvm-compute-rack"}[5m])
              or absent_over_time(probe_success{job="pi-blackbox",instance="ups-compute-rack",platform="pi",probe="unifi-console"}[5m])
              or absent_over_time(probe_success{job="pi-blackbox",instance="ups-compute-rack",platform="pi",probe="k8s-gateway"}[5m])
              or absent_over_time(probe_success{job="pi-blackbox",instance="ups-compute-rack",platform="pi",probe="unifi-gateway"}[5m])
            )
            unless on (instance, platform, probe)
            (up{job="pi-blackbox"} == 0)
            and on (instance, platform)
            (up{job="pi-blackbox-exporter"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Probe {{ $labels.probe }} stopped reporting from {{ $labels.instance }}"
            description: "No probe_success samples arrived for {{ $labels.probe }} for at least ten minutes and the Pi exporter is up. Check this Pi's vmagent target list and blackbox probe configuration in rpi-nixos."
            runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/host-monitoring.md#service-probes

        - alert: ProbeSlow
          expr: |
            (avg_over_time(probe_duration_seconds{job="pi-blackbox"}[5m]) > 2)
            and on (instance, platform, probe)
            (probe_success{job="pi-blackbox"} == 1)
            and on (instance, platform, probe)
            (up{job="pi-blackbox"} == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Probe {{ $labels.probe }} is slow from {{ $labels.instance }}"
            description: "{{ $labels.target }} has averaged over two seconds for ten minutes. Check DNS, network latency and service response time."
            runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/host-monitoring.md#service-probes

        # Internal certificates live 160 h and renew with 53 h left; 36 h left means renewal has failed for about 17 h.
        - alert: ProbeCertificateExpiring
          expr: |
            (probe_ssl_earliest_cert_expiry{job="pi-blackbox",probe!~"athena-dsm|kvm-compute-rack|unifi-console"} - time() < 36 * 3600)
            and on (instance, platform, probe)
            (probe_success{job="pi-blackbox"} == 1)
            and on (instance, platform, probe)
            (up{job="pi-blackbox"} == 1)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate for {{ $labels.probe }} expires in {{ $value | humanizeDuration }}"
            description: "Check certificate renewal for {{ $labels.target }}. Public tunnel probes see Cloudflare's edge certificate; internal HTTPS probes see Traefik's certificate."
            runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/host-monitoring.md#service-probes

        # Hosts that renew their own 90-day certificates (Athena DSM, the GLKVM,
        # the UniFi console)
        # renew about 30 days before expiry; 14 days left means renewal has
        # been failing for over two weeks.
        - alert: HostCertificateExpiring
          expr: |
            (probe_ssl_earliest_cert_expiry{job="pi-blackbox",probe=~"athena-dsm|kvm-compute-rack|unifi-console"} - time() < 14 * 24 * 3600)
            and on (instance, platform, probe)
            (probe_success{job="pi-blackbox"} == 1)
            and on (instance, platform, probe)
            (up{job="pi-blackbox"} == 1)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate for {{ $labels.probe }} expires in {{ $value | humanizeDuration }}"
            description: "{{ $labels.target }} has less than 14 days of served certificate validity. Check the host's own ACME renewal: the Athena ACME runbook for athena-dsm, devices/glkvm/README.md#tls for kvm-compute-rack, the UniFi console's certificate settings for unifi-console."
            runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/host-monitoring.md#service-probes
