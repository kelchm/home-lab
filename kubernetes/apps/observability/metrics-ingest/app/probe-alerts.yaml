---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: pi-probes
spec:
  groups:
    - name: pi-probes
      rules:
        # Exporter failures belong to HostCollectorDown, not every destination.
        - alert: PiProbeFailed
          expr: |
            (
              probe_success{job="pi-blackbox"} == 0
              or on (instance, platform, probe)
              up{job="pi-blackbox"} == 0
            )
            and on (instance, platform)
            (up{job="pi-blackbox-exporter"} == 1)
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Probe {{ $labels.probe }} is failing from {{ $labels.instance }}"
            description: "{{ $labels.target }} failed the {{ $labels.module }} probe. Check the destination, DNS and the routed path from VLAN 20."
            runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/host-monitoring.md#service-probes

        - alert: PiProbeSlow
          expr: |
            (avg_over_time(probe_duration_seconds{job="pi-blackbox"}[5m]) > 2)
            and on (instance, platform, probe)
            (probe_success{job="pi-blackbox"} == 1)
            and on (instance, platform, probe)
            (up{job="pi-blackbox"} == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Probe {{ $labels.probe }} is slow from {{ $labels.instance }}"
            description: "{{ $labels.target }} has averaged over two seconds for ten minutes. Check DNS, network latency and service response time."
            runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/host-monitoring.md#service-probes

        # Internal certificates live 160 h and renew with 53 h left; 36 h left means renewal has failed for about 17 h.
        - alert: PiProbeCertificateExpiring
          expr: |
            (probe_ssl_earliest_cert_expiry{job="pi-blackbox"} - time() < 36 * 3600)
            and on (instance, platform, probe)
            (probe_success{job="pi-blackbox"} == 1)
            and on (instance, platform, probe)
            (up{job="pi-blackbox"} == 1)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate for {{ $labels.probe }} expires in {{ $value | humanizeDuration }}"
            description: "Check certificate renewal for {{ $labels.target }}. Public tunnel probes see Cloudflare's edge certificate; internal HTTPS probes see Traefik's certificate."
            runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/host-monitoring.md#service-probes
