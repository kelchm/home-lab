---
# One user per host. The token decides `instance` (the node) and `platform`
# (its type): VMAuth adds them to every sample and a host cannot override
# them, so collector configs carry no identity. `spec.name` labels VMAuth's own
# per-user metrics with the host instead of a token hash. A host that also
# sends its journal gets a second route, which stamps the same identity on
# every log record as `host.name` and `service.namespace` and sets the stream
# fields; VMAuth drops a host's own `extra_fields` and `_stream_fields`, and
# VictoriaLogs' `extra_fields` override fields in the record. The route also
# overwrites the tenant headers, so every record lands in the default tenant.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: spark-1
  labels:
    homelab.kelch.io/vmauth: metrics-ingest
spec:
  name: spark-1
  tokenRef:
    name: metrics-ingest-tokens
    key: SPARK_1_TOKEN
  targetRefs:
    - crd:
        kind: VMSingle
        name: victoria-metrics-k8s-stack
        namespace: observability
      paths:
        - /api/v1/write
      query_args:
        - name: extra_label
          values:
            - instance=spark-1
            - platform=spark
    - static:
        url: http://victoria-logs-single-server.observability.svc:9428
      paths:
        - /insert/opentelemetry/v1/logs
      query_args:
        - name: extra_fields
          values:
            - host.name=spark-1,service.namespace=spark
        - name: _stream_fields
          values:
            - host.name,service.name
      headers:
        - "AccountID: 0"
        - "ProjectID: 0"
