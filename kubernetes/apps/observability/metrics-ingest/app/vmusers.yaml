---
# One user per host. The token decides `instance` (the node) and `platform`
# (its type): VMAuth adds them to every sample and a host cannot override
# them, so collector configs carry no identity. `spec.name` labels VMAuth's own
# per-user metrics with the host instead of a token hash.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: spark-1
  labels:
    homelab.kelch.io/vmauth: metrics-ingest
spec:
  name: spark-1
  tokenRef:
    name: metrics-ingest-tokens
    key: SPARK_1_TOKEN
  targetRefs:
    - crd:
        kind: VMSingle
        name: victoria-metrics-k8s-stack
        namespace: observability
      paths:
        - /api/v1/write
      query_args:
        - name: extra_label
          values:
            - instance=spark-1
            - platform=spark
