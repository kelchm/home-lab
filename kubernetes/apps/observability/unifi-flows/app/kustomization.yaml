---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./deployment.yaml
  - ./networkpolicy.yaml
  - ./scrape.yaml
  - ./alerts.yaml
configMapGenerator:
  - name: unifi-flows
    files:
      - collector.py
  - name: grafana-dashboard-unifi-flows
    files:
      - unifi-flows.json=./dashboards/unifi-flows.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platforms/UniFi
        kustomize.toolkit.fluxcd.io/substitute: disabled
