---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smartctl-exporter
spec:
  chart:
    spec:
      chart: prometheus-smartctl-exporter
      version: 0.19.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-smartctl-exporter
  interval: 1h
  values:
    image:
      tag: v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6

    # Each cluster node has one physical NVMe controller. Longhorn iSCSI
    # volumes expose synthetic SCSI health and are not physical disks.
    config:
      devices:
        - /dev/nvme0;nvme

    # smartctl needs raw block-device access. The chart runs as root in a
    # privileged container and mounts the host's /dev at /hostdev.
    tolerations:
      - effect: NoSchedule
        operator: Exists

    # The workload does not call the Kubernetes API. Avoid the chart's legacy
    # PSP RoleBinding, which is unnecessary on modern Kubernetes.
    rbac:
      create: false

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

    serviceMonitor:
      enabled: true
      interval: 60s
      scrapeTimeout: 30s
      relabelings:
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: instance
        - action: replace
          targetLabel: platform
          replacement: k8s

    # This chart group covers every platform and has no cluster filter.
    prometheusRules:
      enabled: true
      rules:
        smartCTLDeviceStatus:
          enabled: true
          alert: DriveHealthFailing
          expr: drive:health_status == 0
          for: 5m
          annotations:
            summary: Drive reports failing health
            description: >-
              Device {{ $labels.device }} on {{ $labels.instance }} is failing
              its SMART or DSM health check.
          labels:
            severity: critical
        smartCTLDeviceMediaErrors:
          enabled: true
          alert: SmartCTLDeviceMediaErrors
          expr: smartctl_device_media_errors > 0
          for: 5m
          annotations:
            summary: Device has uncorrectable media errors
            description: >-
              Device {{ $labels.device }} on {{ $labels.instance }} reports
              {{ $value }} uncorrectable media errors.
          labels:
            severity: critical
        smartCTLDeviceCriticalWarning:
          enabled: true
          alert: SmartCTLDeviceCriticalWarning
          expr: smartctl_device_critical_warning != 0
          for: 5m
          annotations:
            summary: NVMe controller reports a critical warning
            description: >-
              Device {{ $labels.device }} on {{ $labels.instance }} reports
              critical-warning bitmask {{ $value }}.
          labels:
            severity: critical
        smartCTLDeviceAvailableSpareUnderThreshold:
          enabled: true
          alert: SmartCTLDeviceAvailableSpareUnderThreshold
          expr: smartctl_device_available_spare < smartctl_device_available_spare_threshold
          for: 15m
          annotations:
            summary: NVMe available spare is below its threshold
            description: >-
              Device {{ $labels.device }} on {{ $labels.instance }} has only
              {{ $value }}% spare capacity available.
          labels:
            severity: warning
        smartCTLDeviceWearHigh:
          enabled: true
          alert: SmartCTLDeviceWearHigh
          expr: smartctl_device_percentage_used >= 80
          for: 15m
          annotations:
            summary: NVMe wear estimate is high
            description: >-
              Device {{ $labels.device }} on {{ $labels.instance }} has used
              {{ $value }}% of its estimated endurance.
          labels:
            severity: warning
        # These chart defaults are intentionally disabled: node-exporter
        # already covers temperature, and link-speed changes are not a drive
        # health signal for this deployment.
        smartCTLDDeviceTemperature:
          enabled: false
        smartCTLDInterfaceSlow:
          enabled: false
