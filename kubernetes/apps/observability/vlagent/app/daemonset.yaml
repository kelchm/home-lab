---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vlagent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vlagent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vlagent
    spec:
      serviceAccountName: vlagent
      # Explicit per-node cutover; unlabelled nodes remain on Alloy.
      nodeSelector:
        logging.home.kelch.io/collector: vlagent
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 60
      containers:
        - name: vlagent
          # Unmodified upstream build including output_stream (#1791).
          image: victoriametrics/vlagent:heads-master-0-gff8635e43@sha256:7492cfbb1468432ca9db753bf9c3e4478b298f72945adaa902254627e9e3dba9
          args:
            - -kubernetesCollector
            - -loggerFormat=json
            - -remoteWrite.url=http://victoria-logs-single-server.observability.svc.cluster.local:9428/insert/native
            - -tmpDataPath=/var/lib/vlagent
            - -remoteWrite.tmpDataPath=/var/lib/vlagent/queue
            # 4 GiB per node; sizing and disk-overhead allowance in runbook.
            - -remoteWrite.maxDiskUsagePerURL=4294967296
            - -kubernetesCollector.checkpointsPath=/var/lib/vlagent/checkpoints.json
            - -kubernetesCollector.logsPath=/var/log/containers
            - '-kubernetesCollector.extraFields={"cluster":"k8s-prod"}'
            - -kubernetesCollector.streamFields=cluster,kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name,kubernetes.pod_node_name
            - -kubernetesCollector.msgField=message,msg,log,event,record.message
            - -kubernetesCollector.decolorizeFields=_msg
            - -kubernetesCollector.includePodLabels=true
            - -kubernetesCollector.includePodAnnotations=false
            - -kubernetesCollector.includeNodeLabels=false
            - -kubernetesCollector.includeNodeAnnotations=false
            - -kubernetesCollector.includeNamespaceLabels=false
            - -kubernetesCollector.includeNamespaceAnnotations=false
          ports:
            - name: http
              containerPort: 9429
          readinessProbe:
            httpGet:
              path: /health
              port: http
          # Do not restart a collector just because its backend is unavailable.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 768Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: container-logs
              mountPath: /var/log/containers
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: data
              mountPath: /var/lib/vlagent
      volumes:
        - name: container-logs
          hostPath:
            path: /var/log/containers
            type: Directory
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: data
          hostPath:
            path: /var/lib/vlagent
            type: DirectoryOrCreate
