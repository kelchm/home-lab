---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vlagent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vlagent
  podMetricsEndpoints:
    - port: http
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: vlagent
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
