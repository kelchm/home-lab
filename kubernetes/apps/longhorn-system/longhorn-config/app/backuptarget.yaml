---
# Default BackupTarget CR. The chart auto-creates a `default` BackupTarget
# at bootstrap with an empty URL; we take ownership here so the URL is
# Flux-managed and survives chart upgrades. It lives in the longhorn-config
# Kustomization because the Longhorn HelmRelease installs its CRD.
#
# Network path: instance-manager pods carry a storage-network attachment
# using 10.32.25.128/28 and an explicit 10.32.25.5/32 route to the NAS
# over lhnet1 (2.5GbE). Strict rp_filter requires that return route too.
# A replacement NAS must reuse 10.32.25.5 or get a reviewed explicit route
# in the storage-network NAD before changing this target.
#
# Restore drill / opt-out / DR sketch: docs/runbooks/longhorn-backup-restore.md
apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata:
  name: default
  namespace: longhorn-system
spec:
  backupTargetURL: nfs://10.32.25.5:/volume1/backups-k8s-prod/longhorn
  credentialSecret: ""
  pollInterval: 5m0s
