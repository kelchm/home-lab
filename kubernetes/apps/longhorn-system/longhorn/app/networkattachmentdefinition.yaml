---
# Secondary network attached to Longhorn instance-manager and manager pods so
# replica traffic, same-node iSCSI and NFS backups ride VLAN 25 (2.5GbE
# storage NIC). Whereabouts coordinates IP allocation across nodes from .128/28
# (cluster #1 storage-pod range; see docs/architecture.md). CIDR-aligned
# per-cluster /28s let one ACL/firewall rule scope to all of a cluster's
# storage-VLAN pods (see architecture.md "Reading rule").
#
# Why bridge, not macvlan/ipvlan: Longhorn's iSCSI flow requires the
# host's iscsiadm to reach the engine's iSCSI target running inside a
# Multus-attached pod on the same node. macvlan and ipvlan L2 both block
# host-to-same-host-pod communication at the kernel level — host's
# parent-NIC stack and the slave's namespace stack are isolated even
# though they sit on the same physical port. With bridge CNI, pods get
# veth into the host's br-storage Linux bridge (configured per-node via
# Talos `machine.network.interfaces[].bridge`), and host + pods share
# one L2 broadcast domain. Same-host iscsiadm just works.
#
# `master`: br-storage is created by Talos. The desired source config binds
# its only member, the storage NIC, by MAC through `bridgePort`. Per-node
# application and live acceptance are tracked in #731; merging source alone
# does not change the nodes. The bridge carries the host's 10.32.25.X/24 IP.
#
# `isGateway: false`, `ipMasq: false`: the bridge is a pure L2 endpoint;
# no NAT, no acting as gateway. Default route stays on the pod's primary
# Cilium interface.
#
# Peer boundary (#1120). The bridge also carries CNPG backup pods, and VLAN 25
# reaches the NAS, PVE hosts and Sparks. Longhorn's control and data
# listeners do not authenticate callers, and Cilium policy does not see this
# interface, so the attachment confines itself:
#   - The /28 mask puts only the Longhorn pool on-link. The /32 routes add the
#     NAS (backup target) and the three node storage addresses, which the
#     host's iscsiadm uses to reach the same-node engine.
#   - Strict rp_filter drops IPv4 from any source not routed back through
#     this interface and stops answering its ARP requests. The kernel
#     applies the larger of the `all` and interface values, and 2 (loose)
#     would pass everything, so `all` is pinned to 0 as on the nodes.
#   - IPv6 is disabled on the interface. Nothing here uses it, and its
#     link-local address would otherwise bypass the IPv4 filter.
# The NAS and the nodes stay trusted. Anything that can forge packets on
# VLAN 25 (root on a VLAN 25 host, or a pod with NET_RAW on a storage
# attachment) can still impersonate an allowed address. A new node's storage
# address, or any other VLAN 25 peer Longhorn must reach, needs a route here
# first. Pods pick up changes when they are recreated; Longhorn does not
# recreate them for a NAD edit. tuning comes from kube-system/cni-tuning.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: storage-network
  namespace: longhorn-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "storage-network",
      "plugins": [
        {
          "type": "bridge",
          "bridge": "br-storage",
          "isGateway": false,
          "ipMasq": false,
          "ipam": {
            "type": "whereabouts",
            "range": "10.32.25.128/28",
            "routes": [
              { "dst": "10.32.25.5/32" },
              { "dst": "10.32.25.11/32" },
              { "dst": "10.32.25.12/32" },
              { "dst": "10.32.25.13/32" }
            ]
          }
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv4.conf.all.rp_filter": "0",
            "net.ipv4.conf.IFNAME.rp_filter": "1",
            "net.ipv6.conf.IFNAME.disable_ipv6": "1"
          }
        }
      ]
    }
