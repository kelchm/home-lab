---
# The chart's own longhorn-manager NetworkPolicy admits ingress only from other
# Longhorn pods in this namespace, which also blocks the metrics port, so every
# scrape of the chart's ServiceMonitor times out without this.
#
# Port 9500 is the longhorn-manager REST API, not a metrics listener. /metrics
# is one path on it and /v1/volumes on the same port serves mutating actions
# such as attach and detach, with no authentication -- Longhorn treats network
# reachability as its authorization boundary. An L4 rule would therefore hand
# the scrapers full control of storage, so the HTTP rule narrows them to the
# one path they need.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-manager-metrics
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-manager
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
---
# Homepage's Longhorn widget reads node storage from the same unauthenticated
# REST API, so it gets the same treatment: one read path, nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-manager-homepage
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-manager
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homepage
            app.kubernetes.io/name: homepage
            io.cilium.k8s.policy.serviceaccount: homepage
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /v1/nodes
