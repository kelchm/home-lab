---
# The chart's own longhorn-manager NetworkPolicy admits ingress only from other
# Longhorn pods in this namespace, which also blocks the metrics port, so every
# scrape of the chart's ServiceMonitor times out without this.
#
# Port 9500 is the longhorn-manager REST API, not a metrics listener. /metrics
# is one path on it and /v1/volumes on the same port serves mutating actions
# such as attach and detach, with no authentication -- Longhorn treats network
# reachability as its authorization boundary. An L4 rule would therefore hand
# the scrapers full control of storage, so the HTTP rule narrows them to the
# one path they need.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-manager-metrics
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-manager
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
---
# The UI's nginx forwards /v1 to the longhorn-manager API on 9500, and the
# chart's longhorn-manager NetworkPolicy admits the UI pods. Neither has
# authentication, so a direct connection to the UI controls every volume and
# backup. The OIDC middleware on the admin gateway is the only login, so only
# the admin Traefik instance may reach the UI. Egress is unrestricted.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-ui
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: traefik-admin-network
            io.cilium.k8s.policy.serviceaccount: traefik-admin
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
