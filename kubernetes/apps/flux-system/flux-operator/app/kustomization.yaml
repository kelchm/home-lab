---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./podmonitor.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml

configMapGenerator:
  # controlplaneio-fluxcd/flux-operator 4746bb3266ae4fd398079e71dcdbdbc563213196; clear database id and fixed datasource selection; byte units on the Memory stats; workqueue name in the Queued Reconciliations legend.
  - name: grafana-dashboard-flux-performance
    files:
      - flux-performance.json=./dashboards/flux-performance.json
      - flux-k8s-api-performance.json=./dashboards/flux-k8s-api-performance.json
    options:
      annotations:
        grafana_folder: Platforms/Kubernetes
        kustomize.toolkit.fluxcd.io/substitute: disabled
      labels:
        grafana_dashboard: "1"
  # fluxcd/flux2-monitoring-example 830b4b9478c6a7afab801a0bb42c4b86d16496dc; clear database id and fixed datasource selection; byte units on the Memory gauge and core units on CPU Usage.
  - name: grafana-dashboard-flux-control-plane
    files:
      - flux-control-plane.json=./dashboards/flux-control-plane.json
    options:
      annotations:
        grafana_folder: Platforms/Kubernetes
        kustomize.toolkit.fluxcd.io/substitute: disabled
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true
