---
# In-cluster HTTP MCP server. MCPHub uses http://pcbparts.dev/mcp through its
# pod-only alias to this Service. No Gateway. The original internal endpoint
# http://pcbparts-mcp.ai.svc.cluster.local:8080/mcp remains available.
#
# Read-only component search: keyless JLCPCB in-stock DB + EasyEDA footprint
# checks. Complements digikey-mcp with JLCPCB/LCSC pricing and assembly stock.
# Image serves streamable-http at /mcp on 0.0.0.0:8080 with no command override.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pcbparts-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: pcbparts-mcp
  interval: 1h
  values:
    controllers:
      pcbparts-mcp:
        containers:
          app:
            image:
              # No semver tags published; pin the immutable main-<sha>-<date>
              # tag. amd64-only image — all k8s-prod nodes are amd64.
              repository: ghcr.io/averyy/pcbparts-mcp
              tag: main-f5738b5-20261106@sha256:aa4a3b39067681d913808d4b0d7751ac95878794582927c005e813dae893de44
            env:
              # Every client arrives from the single MCPHub pod IP, so the
              # per-IP limiter is one global bucket; raise it from the default.
              RATE_LIMIT_REQUESTS: "500"
              # MCPHub resolves pcbparts.dev to this private Service so short PDF
              # links use upstream's public resolver. Keep the internal name too.
              # Temporary workaround and removal trigger: ../../mcphub/README.md.
              MCP_ALLOWED_HOSTS: pcbparts-mcp.ai.svc.cluster.local,pcbparts.dev
              # Light up the DigiKey cross-reference tools by reusing the
              # existing digikey-mcp client-credentials (2-legged, no refresh
              # token).
              DIGIKEY_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: digikey-mcp-secrets
                    key: CLIENT_ID
              DIGIKEY_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: digikey-mcp-secrets
                    key: CLIENT_SECRET
            # MOUSER_API_KEY (Mouser Search API) lights up the Mouser tools.
            envFrom:
              - secretRef:
                  name: pcbparts-mcp-secrets
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        # Image USER is appuser (non-numeric); pin numeric UID so kubelet's
        # runAsNonRoot admission check passes pre-start.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: pcbparts-mcp
        # Coupled to MCPHub's pod-only hostAliases; reserve the existing IP so
        # a recreated Service cannot silently move. See ../../mcphub/README.md.
        clusterIP: 10.43.125.172
        ports:
          http:
            primary: true
            port: *port
          http-alias:
            port: 80
            targetPort: *port
