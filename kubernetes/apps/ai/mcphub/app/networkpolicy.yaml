---
# MCPHub receives only admin-gateway traffic and may resolve/reach only the
# exact in-cluster MCP backends declared in its static settings file.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcphub
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mcphub
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: traefik-admin-network
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: digikey-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: flux-operator-mcp
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: grafana-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: hackernews-mcp
      toPorts:
        - ports:
            - port: "3010"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: kubernetes-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: lemon-manuals-mcp
      toPorts:
        - ports:
            - port: "8787"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: markitdown-mcp
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: open-meteo-mcp
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: pcbparts-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: playwright-stealth-mcp
      toPorts:
        - ports:
            - port: "8931"
              protocol: TCP
---
# Reciprocal ingress grants are separate, additive policies so the existing
# backend policies and MetaMCP access remain untouched.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcphub-to-digikey-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: digikey-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: mcphub
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
