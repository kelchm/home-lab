---
# Parallel MCP gateway evaluation. MetaMCP remains deployed and unchanged.
# MCPHub reads its complete, immutable file-mode configuration from the
# SOPS-managed Secret. Capability groups and workload-scoped bearer keys are
# documented in ../README.md. There is no PostgreSQL, Redis, dashboard, or
# client OAuth.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcphub
spec:
  chartRef:
    kind: OCIRepository
    name: mcphub
  interval: 1h
  values:
    controllers:
      mcphub:
        replicas: 1
        # MCP transports keep in-memory sessions. Recreate prevents two pods
        # from splitting those sessions during an update.
        strategy: Recreate
        annotations:
          secret.reloader.stakater.com/reload: mcphub-settings
        containers:
          app:
            image:
              repository: docker.io/samanhappy/mcphub
              # v1.0.33 release, pinned to its multi-architecture OCI index.
              tag: 1.0.34@sha256:9362500c060e98f8b5bc9bfb4b80b2046811d0f4f4c1c2b0c1dab08bc14115bf
            env:
              NODE_ENV: production
              PORT: "3000"
              # Keep the SSE transport's required messages endpoint below the
              # only externally exposed /sse prefix; httproute.yaml rewrites
              # the public MCP and SSE paths to this internal base path.
              BASE_PATH: /sse
              MCPHUB_SETTING_PATH: /config/mcp_settings.json
              USE_DB: "false"
              DISABLE_WEB: "true"
              # There is no dashboard route, but also reject mutations if one
              # is reached accidentally from inside the cluster.
              READONLY: "true"
              TRUST_PROXY: "1"
              HOME: /tmp
              NPM_CONFIG_USERCONFIG: /tmp/.npmrc
              JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: mcphub-settings
                    key: JWT_SECRET
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  # MCPHub's /health returns 200 even when upstream startup
                  # aborts before the transport routes are registered. A
                  # successful OPTIONS response proves Express registered the
                  # POST route; a pre-registration 404 keeps the pod unready.
                  # This avoids creating sessions or logging failed auth probes.
                  exec:
                    command: &transportProbeCommand
                      - node
                      - -e
                      - >-
                        fetch('http://127.0.0.1:3000/sse/mcp/homelab-read',
                        {method:'OPTIONS'})
                        .then(async(response)=>{const ok=response.status===200&&
                        response.headers.get('allow')?.includes('POST');
                        await response.text();if(!ok)process.exitCode=1})
                        .catch(()=>{process.exitCode=1})
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 3000
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *transportProbeCommand
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Makes the emptyDir-backed /tmp writable to the non-root process.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: mcphub
        ports:
          http:
            port: *port
    persistence:
      settings:
        type: secret
        name: mcphub-settings
        # Keep JWT_SECRET available only through the environment reference.
        # MCPHub needs only the JSON settings file on disk.
        items:
          - key: mcp_settings.json
            path: mcp_settings.json
        globalMounts:
          - path: /config
            readOnly: true
      tmp:
        type: emptyDir
        sizeLimit: 128Mi
        globalMounts:
          - path: /tmp
