---
# LAN-only MCP transports via the admin gateway. MCPHub's native SSE transport
# advertises ${BASE_PATH}/messages to clients. With BASE_PATH=/sse, the more
# specific /sse/messages rule passes that companion endpoint through while the
# general /sse rule rewrites public /sse/<group> to internal /sse/sse/<group>.
# The dashboard, management API, OAuth, discovery, and root paths do not match.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcphub
spec:
  hostnames: ["mcphub.home.kelch.io"]
  parentRefs:
    - name: gateway-admin
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /sse/mcp
      backendRefs: &backendRefs
        - name: mcphub
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /sse/messages
      backendRefs: *backendRefs
    - matches:
        - path:
            type: PathPrefix
            value: /sse
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /sse/sse
      backendRefs: *backendRefs
