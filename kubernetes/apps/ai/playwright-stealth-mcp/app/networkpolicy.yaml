---
# Default-deny shape: only MCP gateways in the ai namespace reach the
# playwright-stealth-mcp HTTP transport. Public-only HTTP(S) egress and DNS are
# supplied by the namespace-level ai-public-web-egress policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: playwright-stealth-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: playwright-stealth-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: metamcp
      toPorts:
        - ports:
            - port: "8931"
              protocol: TCP
