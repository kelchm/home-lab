---
# Default-deny shape: only MCPHub in the ai namespace reaches the
# open-meteo-mcp HTTP transport. Public-only HTTP(S) egress and DNS are supplied
# by the namespace-level ai-public-web-egress policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: open-meteo-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: open-meteo-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: mcphub
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
