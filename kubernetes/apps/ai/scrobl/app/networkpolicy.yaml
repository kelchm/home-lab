---
# No listener or Kubernetes API access. Only resolve DNS and read Last.fm.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: scrobl
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: scrobl
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: ws.audioscrobbler.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
