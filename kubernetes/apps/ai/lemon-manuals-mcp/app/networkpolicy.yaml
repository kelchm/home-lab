---
# Only MetaMCP may reach the MCP transport. Egress is limited to DNS and the
# exact lemon-website backend used to fetch manual pages.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lemon-manuals-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lemon-manuals-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: metamcp
      toPorts:
        - ports:
            - port: "8787"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lemon-manuals
            app.kubernetes.io/name: lemon-website
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
