---
# In-cluster HTTP MCP server reached by metamcp via Service DNS at
# http://lemon-manuals-mcp.ai.svc.cluster.local:8787/mcp. Not on any Gateway.
#
# Browse/search over the self-hosted LEMON/CHARM manual archive: vehicle
# search answered in-process from the share's index.json files, page content
# fetched from lemon-website (lemon-manuals namespace) and converted to
# markdown. /healthz returns 200 only after both indexes parse.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lemon-manuals-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: lemon-manuals-mcp
  interval: 1h
  values:
    controllers:
      lemon-manuals-mcp:
        containers:
          app:
            image:
              repository: ghcr.io/kelchm/lemon-manuals-mcp
              tag: sha-853c03a
            env:
              PORT: "8787"
              LEMON_BASE_URL: http://lemon-website.lemon-manuals.svc.cluster.local:8080
              LEMON_INDEX_JSON: /data/lemon/index.json
              CHARM_INDEX_JSON: /data/charm/index.json
              LEMON_SEARCH_DB: /search/manual-search.sqlite
              # Large FTS imports spill temporary work to disk. The root
              # filesystem is read-only, so keep SQLite temp files beside the
              # persistent index on the writable search volume.
              SQLITE_TMPDIR: /search
              TMPDIR: /search
            # The first search of an unindexed manual ingests its whole page tree,
            # which pins the single-threaded event loop for minutes. The previous
            # 3s/6 budget killed the pod mid-ingest, losing the rebuild and any
            # in-flight request. Readiness shares the budget deliberately: at one
            # replica, dropping out of the Service has no failover to offer and
            # only turns a slow request into a failed one.
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8787
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
            resources:
              requests:
                # Request a full core so a contended node cannot starve an ingest down
                # to the old 50m share. Idle draw stays ~10m.
                cpu: "1"
                # Steady state measured ~660Mi, above the previous 512Mi request,
                # which made the pod an eviction candidate under node memory pressure.
                memory: 1Gi
              limits:
                # SQLite/Bun indexing has been observed consuming several cores and
                # saturating its 8-core control-plane node. Preserve some burst room
                # without allowing one manual ingest to monopolize the host.
                cpu: "2"
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        # Image USER is bun (UID 1000); share files are world-readable.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: lemon-manuals-mcp
        ports:
          http:
            port: *port
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: lemon-manuals
        globalMounts:
          - path: /data
            readOnly: true
      search:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        # Keep this volume out of the Longhorn backup set. The index is a
        # derived artifact rebuilt from the read-only lemon-manuals share, so
        # 100 GiB of it on the NFS backup target buys nothing but re-index
        # time. `source` opts the PVC into label sync; `no-backup` names a
        # group no RecurringJob claims, which is what displaces the implicit
        # `default` group. Both labels are required — see
        # docs/runbooks/longhorn-backup-restore.md.
        labels:
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/no-backup: enabled
        # The packed source pages are about 61 GiB. Start at 100 GiB and
        # expand the Longhorn volume if prewarming approaches its headroom.
        size: 100Gi
        retain: true
        globalMounts:
          - path: /search
