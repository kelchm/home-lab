---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lemon-manuals-mcp
spec:
  dependsOn:
    - name: csi-driver-nfs
      namespace: kube-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: lemon-manuals-mcp
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/lemon-manuals-mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
