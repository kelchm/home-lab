---
# MetaMCP may only receive LAN UI/API traffic from the admin gateway and
# scheduled health traffic from the functional probe. Downstream MCPs opt in
# with homelab.kelch.io/metamcp-backend=true; the central policy only carries
# the small union of MCP ports rather than duplicating every server identity.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metamcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: metamcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: traefik-admin-network
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: grafana-mcp-functional-probe
      toPorts:
        - ports:
            - port: "12008"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            cnpg.io/cluster: metamcp-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            homelab.kelch.io/metamcp-backend: "true"
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "3001"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8931"
              protocol: TCP
            - port: "9090"
              protocol: TCP
    # auth.home.kelch.io resolves to this Kubernetes LoadBalancer Service.
    # Cilium evaluates L4 policy after Service translation, so select the
    # Service and allow Traefik's effective websecure container port.
    - toServices:
        - k8sService:
            serviceName: traefik-services
            namespace: network
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
