---
# MetaMCP may only receive LAN UI/API traffic from the admin gateway and
# scheduled health traffic from the functional probe. Each downstream rule
# identifies the exact Kubernetes Services and effective endpoint port MetaMCP
# may use; grouping is only used when services share the same port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metamcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: metamcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: traefik-admin-network
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: grafana-mcp-functional-probe
      toPorts:
        - ports:
            - port: "12008"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            cnpg.io/cluster: metamcp-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toServices:
        - k8sService:
            serviceName: digikey-mcp
            namespace: ai
        - k8sService:
            serviceName: grafana-mcp
            namespace: ai
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toServices:
        - k8sService:
            serviceName: kubernetes-mcp
            namespace: ai
        - k8sService:
            serviceName: pcbparts-mcp
            namespace: ai
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toServices:
        - k8sService:
            serviceName: markitdown-mcp
            namespace: ai
      toPorts:
        - ports:
            - port: "3001"
              protocol: TCP
    - toServices:
        - k8sService:
            serviceName: open-meteo-mcp
            namespace: ai
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toServices:
        - k8sService:
            serviceName: playwright-stealth-mcp
            namespace: ai
      toPorts:
        - ports:
            - port: "8931"
              protocol: TCP
    - toServices:
        - k8sService:
            serviceName: flux-operator-mcp
            namespace: ai
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # auth.home.kelch.io resolves to this Kubernetes LoadBalancer Service.
    # Cilium evaluates L4 policy after Service translation, so select the
    # Service and allow Traefik's effective websecure container port.
    - toServices:
        - k8sService:
            serviceName: traefik-services
            namespace: network
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
