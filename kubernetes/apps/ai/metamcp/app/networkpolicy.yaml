---
# MetaMCP may only receive LAN UI/API traffic from the admin gateway. Egress
# owns the exact backend identities; each backend's reciprocal ingress policy
# owns its MCP port. Cilium requires both directions to allow a connection.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metamcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: metamcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: traefik-admin-network
      toPorts:
        - ports:
            - port: "12008"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            cnpg.io/cluster: metamcp-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - digikey-mcp
                - flux-operator-mcp
                - grafana-mcp
                - kubernetes-mcp
                - lemon-manuals-mcp
                - markitdown-mcp
                - open-meteo-mcp
                - pcbparts-mcp
                - playwright-stealth-mcp
    # auth.home.kelch.io resolves to this Kubernetes LoadBalancer Service.
    # Cilium evaluates L4 policy after Service translation, so select the
    # Service and allow Traefik's effective websecure container port.
    - toServices:
        - k8sService:
            serviceName: traefik-services
            namespace: network
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # metamcp.home.kelch.io resolves to the admin gateway. The in-process
    # MCP inspector (/mcp-proxy) connects to APP_URL from inside the pod,
    # so this hairpin has to be allowed the same way Kanidm is. Inbound
    # still arrives from traefik-admin onto :12008. Do not register
    # MetaMCP's own endpoints as MCP servers; idle-init would open extra
    # aggregator sessions through this path.
    - toServices:
        - k8sService:
            serviceName: traefik-admin
            namespace: network
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
