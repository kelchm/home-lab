---
# Default-deny shape: only MCP gateways in the ai namespace reach the dbhub-mcp
# HTTP transport, and dbhub itself reaches nothing but DNS and metamcp-db.
# Cilium requires both directions, so metamcp's egress and metamcp-db's ingress
# carry the reciprocal rules.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dbhub-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dbhub-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: metamcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            cnpg.io/cluster: metamcp-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
