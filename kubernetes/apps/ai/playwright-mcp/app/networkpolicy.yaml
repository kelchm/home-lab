---
# This vanilla backend is retained for comparison/rollback but is not registered
# with MetaMCP. Deny all ingress so the reciprocal policy cannot imply that it is
# an approved dependency. Public-only HTTP(S) egress and DNS are supplied by the
# namespace-level ai-public-web-egress policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: playwright-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: playwright-mcp
  ingress: []
