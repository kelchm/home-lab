---
# In-cluster HTTP MCP server reached by MCPHub via Service DNS at
# http://kubernetes-mcp.ai.svc.cluster.local:8080/mcp. Not on any Gateway.
#
# Read-only Kubernetes introspection for the CRDs Flux doesn't model (Cilium,
# Longhorn, Kanidm, Traefik, cert-manager, CNPG). read_only refuses writes and
# disable_destructive drops delete/update tools; the durable boundary is the
# read-only ServiceAccount in rbac.yaml. Runtime settings are TOML only; the
# mounted file replaces the image's default /etc/kubernetes-mcp-server/config.toml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: kubernetes-mcp
  interval: 1h
  values:
    controllers:
      kubernetes-mcp:
        containers:
          app:
            image:
              # quay tags are v-prefixed.
              repository: quay.io/containers/kubernetes_mcp_server
              tag: v0.1.1@sha256:d616331a99184d42f7471eac5ae257192e7065bb684ad115cc95c2e76cfbc2d1
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
        serviceAccount:
          name: kubernetes-mcp
    defaultPodOptions:
      # Required: this app is a Kubernetes-API client and app-template defaults
      # this to false, which would leave the in-cluster client unauthenticated.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    configMaps:
      config:
        data:
          config.toml: |-
            port = "8080"
            read_only = true
            disable_destructive = true
    persistence:
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/kubernetes-mcp-server/config.toml
            subPath: config.toml
            readOnly: true
    service:
      app:
        controller: kubernetes-mcp
        ports:
          http:
            port: *port
