---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-mcp-functional-probe
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      ttlSecondsAfterFinished: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-mcp-functional-probe
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: probe
              image: docker.io/library/python:3.13.5-alpine3.22
              command: ["python", "/config/probe.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                # Verify the supported DB-backed setting through MetaMCP's
                # public read API without coupling pod startup to its schema.
                - name: SESSION_LIFETIME_HOST
                  value: metamcp.ai.svc.cluster.local
                - name: SESSION_LIFETIME_PORT
                  value: "12008"
                - name: EXPECTED_SESSION_LIFETIME_MS
                  value: "14400000"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 5m
                  memory: 24Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: grafana-mcp-functional-probe
