---
# Exercise the exact Service DNS/Host path MetaMCP uses, then call a tool that
# must reach the Grafana API. The session is deleted even on probe failure so
# the check does not become another source of retained MCP sessions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-mcp-functional-probe
data:
  probe.py: |
    import http.client
    import json

    HOST = "grafana-mcp.ai.svc.cluster.local"
    PORT = 8000
    PATH = "/mcp"
    BASE_HEADERS = {
        "Accept": "application/json, text/event-stream",
        "Content-Type": "application/json",
    }


    def rpc(connection, payload, session_id=None, expected=(200,)):
        headers = dict(BASE_HEADERS)
        if session_id:
            headers["Mcp-Session-Id"] = session_id
        connection.request("POST", PATH, json.dumps(payload), headers)
        response = connection.getresponse()
        body = response.read().decode("utf-8")
        if response.status not in expected:
            raise RuntimeError(f"HTTP {response.status}: {body[:500]}")
        return response, json.loads(body) if body else None


    connection = http.client.HTTPConnection(HOST, PORT, timeout=15)
    session_id = None
    try:
        response, initialized = rpc(
            connection,
            {
                "jsonrpc": "2.0",
                "id": 1,
                "method": "initialize",
                "params": {
                    "protocolVersion": "2025-06-18",
                    "capabilities": {},
                    "clientInfo": {
                        "name": "grafana-mcp-functional-probe",
                        "version": "1.0",
                    },
                },
            },
        )
        session_id = response.getheader("Mcp-Session-Id")
        if not session_id or initialized.get("error"):
            raise RuntimeError(f"MCP initialize failed: {initialized}")

        rpc(
            connection,
            {"jsonrpc": "2.0", "method": "notifications/initialized"},
            session_id,
            expected=(200, 202),
        )
        _, result = rpc(
            connection,
            {
                "jsonrpc": "2.0",
                "id": 2,
                "method": "tools/call",
                "params": {"name": "list_datasources", "arguments": {}},
            },
            session_id,
        )
        if result.get("error") or result.get("result", {}).get("isError"):
            raise RuntimeError(f"list_datasources failed: {result}")

        content = result.get("result", {}).get("content", [])
        payload = json.loads(content[0]["text"]) if content else {}
        if not isinstance(payload.get("datasources"), list):
            raise RuntimeError(f"Grafana returned no datasource list: {result}")
        print(f"Grafana MCP functional probe passed ({payload['total']} datasources)")
    finally:
        if session_id:
            headers = dict(BASE_HEADERS)
            headers["Mcp-Session-Id"] = session_id
            connection.request("DELETE", PATH, headers=headers)
            response = connection.getresponse()
            response.read()
            if response.status != 200:
                raise RuntimeError(f"MCP session cleanup returned HTTP {response.status}")
        connection.close()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-mcp-functional-probe
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      ttlSecondsAfterFinished: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-mcp-functional-probe
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: probe
              image: docker.io/library/python:3.13.5-alpine3.22
              command: ["python", "/config/probe.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 5m
                  memory: 24Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: grafana-mcp-functional-probe
