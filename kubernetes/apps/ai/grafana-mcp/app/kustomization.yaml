---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./secret.sops.yaml
  - ./functional-probe.yaml
  - ./alerts.yaml
  - ./networkpolicy.yaml
  - ./helmrelease.yaml

configMapGenerator:
  - name: grafana-mcp-functional-probe
    files:
      - probe.py

generatorOptions:
  disableNameSuffixHash: true
