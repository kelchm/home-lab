---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-mcp-reliability
spec:
  groups:
    - name: ai-mcp-reliability
      rules:
        - alert: GrafanaMCPFunctionalProbeFailed
          expr: |
            (
              time() - kube_cronjob_status_last_successful_time{namespace="ai", cronjob="grafana-mcp-functional-probe"} > 600
            )
            or
            (
              (
                kube_job_status_failed{namespace="ai", job_name=~"grafana-mcp-functional-probe-.*"} > 0
                and on (namespace, job_name)
                time() - kube_job_status_start_time{namespace="ai", job_name=~"grafana-mcp-functional-probe-.*"} < 600
              )
              unless on (namespace, job_name)
              kube_job_status_succeeded{namespace="ai", job_name=~"grafana-mcp-functional-probe-.*"} > 0
            )
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: AI/MCP functional probe is failing
            description: The latest Grafana functional probe failed or no successful initialize/list_datasources/delete cycle has completed in the last 10 minutes.

        # last_successful_time does not exist until the first success and can
        # disappear if the CronJob or kube-state-metrics coverage is lost. Give
        # a fresh rollout two schedules before treating absence as a failure.
        - alert: GrafanaMCPFunctionalProbeMissing
          expr: absent(kube_cronjob_status_last_successful_time{namespace="ai", cronjob="grafana-mcp-functional-probe"})
          for: 12m
          labels:
            severity: critical
          annotations:
            summary: AI/MCP functional probe has no success metric
            description: The scheduled Grafana functional probe has not produced a success metric for 12 minutes.
