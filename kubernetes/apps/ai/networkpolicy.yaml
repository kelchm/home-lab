---
# Workloads that intentionally fetch untrusted remote content may use public
# HTTP(S), but cannot use that capability for lateral movement into pod,
# Service, node, LAN, storage, loopback, link-local, CGNAT, or reserved space.
# IPv6 is disabled cluster-wide; add equivalent IPv6 policy before enabling it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ai-public-web-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - digikey-mcp
          - markitdown-mcp
          - open-meteo-mcp
          - pcbparts-mcp
          - playwright-mcp
          - playwright-stealth-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 0.0.0.0/8
            - 10.0.0.0/8
            - 100.64.0.0/10
            - 127.0.0.0/8
            - 169.254.0.0/16
            - 172.16.0.0/12
            - 192.0.0.0/24
            - 192.0.2.0/24
            - 192.168.0.0/16
            - 198.18.0.0/15
            - 198.51.100.0/24
            - 203.0.113.0/24
            - 224.0.0.0/4
            - 240.0.0.0/4
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
