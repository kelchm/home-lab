---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Multus runs as a meta-CNI alongside Cilium. Pods get Cilium primary; pods
# annotated with k8s.v1.cni.cncf.io/networks gain a secondary interface from
# the referenced NetworkAttachmentDefinition. See docs/architecture.md for
# the storage-VLAN allocation feeding Longhorn instance-manager pods.
#
# Talos quirks (ref: docs.siderolabs.com/kubernetes-guides/cni/multus):
#   - Pin the image off the moving `snapshot-thick` tag.
#   - host-run-netns hostPath must be /var/run/netns; upstream's /run/netns
#     leaves new pods unable to attach (cluster-crippling).
#   - 50Mi memory limit OOMs under load; local burst headroom is 384Mi.
resources:
  # renovate: cni-source=k8snetworkplumbingwg/multus-cni tag=v4.3.2
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/1d81062afcb32eb7290fa28bcbc482c3d0c5cae9/deployments/multus-daemonset-thick.yml
  - ./cni-ready-untaint.yaml
  - ./cni-tuning.yaml

images:
  - name: ghcr.io/k8snetworkplumbingwg/multus-cni
    newTag: v4.3.2-thick@sha256:109b885d8752fe7a7bc3b2371750bfad6789b8b8e2d0b0820b337386ba9b93c9

patches:
  - path: ./patches/host-run-netns.yaml
    target:
      kind: DaemonSet
      name: kube-multus-ds
  - path: ./patches/resources.yaml
    target:
      kind: DaemonSet
      name: kube-multus-ds
  - path: ./patches/daemon-config.yaml
    target:
      kind: ConfigMap
      name: multus-daemon-config
