---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system

components:
  - ../../components/pod-quota
  - ../../components/sops

resources:
  - ./namespace.yaml
  - ./cilium/ks.yaml
  - ./cilium-bgp/ks.yaml
  - ./coredns/ks.yaml
  - ./csi-driver-nfs/ks.yaml
  - ./generic-device-plugin/ks.yaml
  - ./metrics-server/ks.yaml
  - ./multus/ks.yaml
  - ./reloader/ks.yaml
  - ./spegel/ks.yaml
  - ./whereabouts/ks.yaml

# kube-system normally runs about 36 pods. Keep enough room for a complete
# replacement set during control-plane and CNI recovery.
patches:
  - target:
      kind: ResourceQuota
      name: pod-count
    patch: |-
      - op: replace
        path: /spec/hard/count~1pods
        value: "100"
