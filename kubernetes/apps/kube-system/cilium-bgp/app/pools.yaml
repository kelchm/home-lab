---
# admin-prod — operator-facing LBs (Traefik admin gateway, k8s-gateway DNS,
# rare per-service admin IPs). Coexists with the legacy L2 `admin` pool
# (10.32.30.30/24) until step 12 of the migration.
#
# Pool /24 skeleton (per docs/architecture.md): .1 anchor (traefik-admin),
# .2-.10 specials/mnemonics (.2 = k8s-gateway), .30-.99 per-service.
# .100-.254 are reserved DHCP elsewhere; not allocated here.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: admin-prod
spec:
  allowFirstLastIPs: "No"
  blocks:
    - start: "10.32.130.1"
      stop: "10.32.130.99"
  serviceSelector:
    matchLabels:
      lb-pool: admin-prod
---
# services-prod — household-facing LBs. Coexists with the legacy L2 `services`
# pool (10.32.40.30/24) until step 12 of the migration. Pool /24 skeleton:
# .1 anchor (traefik-services), .2-.10 specials, .30-.99 per-service IPs.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: services-prod
spec:
  allowFirstLastIPs: "No"
  blocks:
    - start: "10.32.140.1"
      stop: "10.32.140.99"
  serviceSelector:
    matchLabels:
      lb-pool: services-prod
---
# shared-prod — port-scoped services reachable across client trust zones.
# Unlike admin/services, this pool is not covered by a pool-wide IoT/Guest
# deny. Every tenant needs its own UniFi source+port rules before allocation.
# .30 is Visionect: IoT devices use TCP/11113 and Main operators use HTTPS.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: shared-prod
spec:
  allowFirstLastIPs: "No"
  blocks:
    - start: "10.32.150.30"
      stop: "10.32.150.99"
  serviceSelector:
    matchLabels:
      lb-pool: shared-prod
