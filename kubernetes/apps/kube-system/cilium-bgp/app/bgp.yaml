---
# BGP cluster config — runs the speaker on every Linux node, peering with the
# UniFi gateway from each node's VLAN 30 interface.
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: prod
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: prod
      localASN: 65020
      peers:
        - name: unifi-gateway
          peerASN: 65000
          peerAddress: 10.32.30.1
          peerConfigRef:
            name: unifi-gateway
---
# Per-peer config: timers match UniFi (3s keepalive / 9s hold), MD5 auth from
# the bgp-md5 Secret.
#
# Graceful restart stays off. With it on, a rebooting node most likely stayed
# an ECMP next hop until it came back (82-85s outages in #222; the gateway's
# routes were not read). Every node advertises the externalTrafficPolicy
# Cluster Services; Local ones, such as iot/vss, only from nodes with an
# endpoint. Without graceful restart, a node that closes its session is
# withdrawn at once, and a node that dies once the 9s hold time expires. The
# cost: a cilium-agent restart also withdraws that node until its session
# returns. That disrupts connections hashed to it, and possibly some on other
# nodes as the gateway rehashes, and drops an externalTrafficPolicy Local IP
# whose only endpoint is there.
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPPeerConfig
metadata:
  name: unifi-gateway
spec:
  authSecretRef: bgp-md5
  timers:
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
    connectRetryTimeSeconds: 5
  gracefulRestart:
    enabled: false
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
# Advertise allocated LoadBalancer VIPs as /32s for Services labeled with the
# BGP-era pool names. The UniFi peer applies a matching per-pool /32-only
# prefix-list so an accidental covering route is rejected at the boundary.
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPAdvertisement
metadata:
  name: lb-services
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - key: lb-pool
            operator: In
            values:
              - admin-prod
              - services-prod
              - shared-prod
