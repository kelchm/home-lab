---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    autoDirectNodeRoutes: true
    bgpControlPlane:
      enabled: true
    bpf:
      masquerade: true
    cni:
      # Required for pairing with Multus CNI
      exclusive: false
      # Write the Cilium conflist into Multus's private source directory instead
      # of containerd's live CNI directory, so 00-multus.conf is the only config
      # containerd can ever load. Multus reads this path as its master CNI
      # (multusAutoconfigDir) and republishes it into /etc/cni/net.d.
      #
      # Without this, /etc/cni/net.d holds a standalone-valid Cilium conflist,
      # and any window where Multus has not yet written 00-multus.conf lets
      # containerd create sandboxes with Cilium alone — pods that requested a
      # Multus attachment come up silently missing it.
      #
      # This is the hostPath of the agent's etc-cni-netd volume (type
      # DirectoryOrCreate), and matches the multus-conf-dir hostPath the
      # upstream thick DaemonSet already mounts.
      confPath: /etc/cni/multus/net.d
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    # eno+ covers the physical NIC; eno+.40 includes the VLAN 40 sub-interface so Cilium
    # selects it for L2 announcements (address-less interfaces are skipped by auto-discovery).
    devices: "eno+ eno+.40"
    dashboards:
      enabled: true
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    gatewayAPI:
      enabled: false
    hubble:
      enabled: false
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: "10.42.0.0/16"
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: true
    loadBalancer:
      algorithm: maglev
      mode: "snat"
    localRedirectPolicies:
      enabled: true
    operator:
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      replicas: 1
      rollOutPods: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    socketLB:
      enabled: true
      hostNamespaceOnly: true
    # Chart default is 2, which would take two of three nodes' datapath down at once.
    updateStrategy:
      rollingUpdate:
        maxUnavailable: 1
    upgradeCompatibility: "1.19"
