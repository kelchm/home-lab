---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cilium-policy-drops
spec:
  groups:
    - name: cilium
      labels:
        cluster: k8s-prod
      rules:
        - alert: CiliumPolicyDrops
          expr: |
            sum by (source_namespace, source, destination_namespace, destination, traffic_direction) (
              rate(hubble_drop_total{reason="POLICY_DENIED"}[10m])
            ) > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Cilium policy is dropping {{ $labels.source_namespace }}/{{ $labels.source }} -> {{ $labels.destination_namespace }}/{{ $labels.destination }} ({{ $labels.traffic_direction }})
            description: Sustained policy-denied drops for 15 minutes. Ports are not in the metric; get them with `kubectl -n kube-system exec <cilium-agent-pod> -c cilium-agent -- hubble observe --verdict DROPPED --since 10m`.

    # Each node advertises load-balancer IPs to the gateway (10.32.30.1) over
    # its own session; losing all three takes every one off the LAN. Alert
    # delivery leaves through node egress, not a load-balancer IP.
    - name: cilium-bgp
      labels:
        cluster: k8s-prod
      rules:
        - alert: CiliumBGPSessionDown
          expr: cilium_bgp_control_plane_session_state{cluster="k8s-prod"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: BGP session from {{ $labels.node }} to {{ $labels.neighbor }} is down
            description: >-
              The gateway no longer routes load-balancer traffic through
              {{ $labels.node }}, so an IP only that node advertises, such as a
              service with externalTrafficPolicy Local whose pods all run there,
              is unreachable. Check `cilium-dbg shell -- bgp/peers` in the
              node's cilium-agent and the gateway's BGP status.

        - alert: CiliumBGPAllSessionsDown
          expr: sum(cilium_bgp_control_plane_session_state{cluster="k8s-prod"}) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Every BGP session to the gateway is down
            description: >-
              The gateway has no route to any load-balancer IP, so Traefik and
              every other load-balancer service are unreachable from the LAN.
              Check the gateway's BGP status and `cilium-dbg shell -- bgp/peers`
              on each node.
