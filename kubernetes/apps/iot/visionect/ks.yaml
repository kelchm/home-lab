---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: visionect
spec:
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
    - name: cnpg-operator
      namespace: cnpg-system
    - name: cilium-bgp
      namespace: kube-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: visionect
      namespace: iot
  interval: 1h
  path: ./kubernetes/apps/iot/visionect/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: iot
  wait: false
