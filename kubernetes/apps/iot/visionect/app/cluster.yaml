---
# VSS stores device inventory, settings, sessions, and event/status history in
# PostgreSQL. Keep PostgreSQL 17 for the initial migration from the source 17.2
# server; upgrading the database or VSS is deliberately a later change.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: visionect-db
  annotations:
    # A rebuilt cluster recovers from, then archives into, the same archive.
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 2
  # Keep a streaming standby on another node and switch over before replacing the primary.
  primaryUpdateMethod: switchover
  affinity:
    podAntiAffinityType: required
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-system-trixie
  storage:
    # The source is 2 GiB with ~6.4M history rows. Leave useful growth
    # headroom; Longhorn volumes can be expanded later if retention is kept
    # indefinite.
    size: 30Gi
    # Two storage replicas per instance; existing volumes are changed separately after HA acceptance.
    storageClass: longhorn
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 3Gi
  monitoring:
    customQueriesConfigMap:
      - name: visionect-db-monitoring
        key: queries
  # Backups go out over the storage VLAN.
  inheritedMetadata:
    annotations:
      k8s.v1.cni.cncf.io/networks: cnpg-system/storage-network
  postgresql:
    parameters:
      # Bound slot-retained WAL if a standby stops; archiving still has its own disk budget.
      max_slot_wal_keep_size: 10GB
    # The storage interface is outside Cilium policy. Apps use IPv4; reject all IPv6 clients.
    pg_hba:
      - host all all 10.32.25.0/24 reject
      - host all all ::/0 reject
  # Read only when the Cluster is created: a rebuild restores the newest backup.
  bootstrap:
    recovery:
      source: visionect-db
      database: koala
      owner: visionect
  externalClusters:
    - name: visionect-db
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: visionect-db
          serverName: visionect-db-pg17
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: visionect-db
        # One archive per PostgreSQL major: a major upgrade must change this suffix.
        serverName: visionect-db-pg17
