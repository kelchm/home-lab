---
# CloudNativePG cluster chart rule (charts/cluster/prometheus_rules/cluster-offline.yaml at f8b22d4e0041),
# rendered for this cluster as the chart does, with the selector scoped to k8s-prod
# and counting only instances whose PostgreSQL is up.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: visionect-db-alert-rules
spec:
  groups:
    - name: cloudnative-pg/visionect-db
      labels:
        cluster: k8s-prod
      rules:
        - alert: CNPGClusterOffline
          annotations:
            summary: CNPG Cluster has no running instances!
            description: |-
              CloudNativePG Cluster "iot/visionect-db" has no ready instances.

              Having an offline cluster means your applications will not be able to access the database, leading to
              potential service disruption and/or data loss.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterOffline.md
          expr: |
            (count(cnpg_collector_up{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"} == 1) OR on() vector(0)) == 0
          for: 5m
          labels:
            severity: critical
            namespace: iot
            cnpg_cluster: visionect-db
        # spec.instances=2 requires one streaming standby. CI checks this expectation.
        # The primary-only query confirms streaming; aggregate exporters to one database alert.
        - alert: CNPGStreamingStandbyMissing
          expr: |
            max by (cluster, namespace) (cnpg_collector_up{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"} == 1)
            unless on (cluster, namespace)
            max by (cluster, namespace) (cnpg_ha_streaming_replicas{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"} >= 1)
          for: 10m
          labels:
            severity: warning
            namespace: iot
            cnpg_cluster: visionect-db
          annotations:
            summary: Database iot/visionect-db has no confirmed streaming standby
            description: A database instance is reporting up without confirmation of a streaming standby for 10 minutes. Check replication and exporter health before maintenance; another database failure could interrupt the application or lose unreceived transactions.
            runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/cnpg-backup-restore.md#streaming-standby-is-missing
        - alert: CNPGHAReplicationSlotInvalidated
          expr: |
            max by (cluster, namespace) (cnpg_ha_slots_invalidated{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"}) > 0
          for: 5m
          labels:
            severity: warning
            namespace: iot
            cnpg_cluster: visionect-db
          annotations:
            summary: Database iot/visionect-db has an invalidated HA replication slot
            description: A physical HA slot has been invalidated for 5 minutes. A streaming standby can still be using this slot on PostgreSQL 17 without retaining WAL. Check slot validity before maintenance and follow the lost-standby runbook; do not drop an active slot or rebuild a primary.
            runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/cnpg-backup-restore.md#a-lost-standby
