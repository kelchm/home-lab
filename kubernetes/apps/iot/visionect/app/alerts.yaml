---
# CloudNativePG cluster chart rule (charts/cluster/prometheus_rules/cluster-offline.yaml at f8b22d4e0041),
# rendered for this cluster as the chart does, with the selector scoped to k8s-prod
# and counting only instances whose PostgreSQL is up.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: visionect-db-alert-rules
spec:
  groups:
    - name: cloudnative-pg/visionect-db
      labels:
        cluster: k8s-prod
      rules:
        - alert: CNPGClusterOffline
          annotations:
            summary: CNPG Cluster has no running instances!
            description: |-
              CloudNativePG Cluster "iot/visionect-db" has no ready instances.

              Having an offline cluster means your applications will not be able to access the database, leading to
              potential service disruption and/or data loss.
            runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterOffline.md
          expr: |
            (count(cnpg_collector_up{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"} == 1) OR on() vector(0)) == 0
          for: 5m
          labels:
            severity: critical
            namespace: iot
            cnpg_cluster: visionect-db
        # spec.instances=2 requires one streaming standby. CI checks this expectation.
        # Keep pod/instance out of the result so exporter duplicates and role changes
        # retain one alert identity per database. Missing HA data is unconfirmed,
        # but a down/unobservable primary belongs to TargetDown/CNPGClusterOffline.
        - alert: CNPGStreamingStandbyMissing
          expr: |
            max by (cluster, namespace) (
              (cnpg_collector_up{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"} == 1)
              and (time() - timestamp(cnpg_collector_up{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"}) < 120)
              and on (cluster, namespace, pod, instance) (up{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"} == 1)
              and on (cluster, namespace, pod, instance) (time() - timestamp(up{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"}) < 120)
              unless on (cluster, namespace, pod, instance) (
                (cnpg_pg_replication_in_recovery{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"} == 1)
                and (time() - timestamp(cnpg_pg_replication_in_recovery{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"}) < 120)
                and on (cluster, namespace, pod, instance) (time() - cnpg_last_update_timestamp{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"} < 120)
              )
            )
            unless on (cluster, namespace)
            max by (cluster, namespace) (
              (cnpg_ha_streaming_replicas{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"} >= 1)
              and (time() - timestamp(cnpg_ha_streaming_replicas{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"}) < 120)
              and on (cluster, namespace, pod, instance) (cnpg_pg_replication_in_recovery{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"} == 0)
              and on (cluster, namespace, pod, instance) (time() - timestamp(cnpg_pg_replication_in_recovery{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"}) < 120)
              and on (cluster, namespace, pod, instance) (time() - cnpg_last_update_timestamp{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"} < 120)
              and on (cluster, namespace, pod, instance) (cnpg_collector_up{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"} == 1)
              and on (cluster, namespace, pod, instance) (time() - timestamp(cnpg_collector_up{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"}) < 120)
              and on (cluster, namespace, pod, instance) (up{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"} == 1)
              and on (cluster, namespace, pod, instance) (time() - timestamp(up{cluster="k8s-prod",namespace="iot",pod=~"visionect-db-([1-9][0-9]*)$"}) < 120)
            )
          for: 10m
          labels:
            severity: warning
            namespace: iot
            cnpg_cluster: visionect-db
          annotations:
            summary: Database iot/visionect-db has no confirmed streaming standby
            description: For 10 minutes, a reachable database instance has no confirmed primary with the required streaming standby. Replication reports fewer than one streaming standby, or its role/streaming metrics are missing or stale. Database redundancy is at risk if the primary fails. Check replication and exporter collection errors before maintenance.
            runbook_url: https://github.com/kelchm/home-lab/blob/main/docs/runbooks/cnpg-backup-restore.md#streaming-standby-is-missing
