---
# After Longhorn's 07:00 and 08:00 UTC jobs and before the 10:00 UTC off-site run.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: visionect-db
spec:
  schedule: "0 30 8 * * *"
  # The first base backup runs when this is created.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: visionect-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
