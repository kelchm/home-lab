---
# Photon: self-hosted reverse geocoder for Dawarich, US index only.
#
# Dawarich's points are all in the US, so the prebuilt US index (about 10.6 GB
# compressed, rebuilt weekly) is enough. Coordinates never leave the cluster:
# Dawarich has no internet egress, and Photon's only external destination is
# the index mirror. Nothing here is personal data; the index can be
# downloaded again, so its volume is not backed up.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: photon
spec:
  chartRef:
    kind: OCIRepository
    name: photon
  interval: 1h
  values:
    controllers:
      photon:
        # One RWO index volume.
        strategy: Recreate
        containers:
          app:
            image:
              # renovate: datasource=docker depName=docker.io/rtuszik/photon-docker
              repository: docker.io/rtuszik/photon-docker
              tag: 2.5.0@sha256:c5babeb0ac396b485822036cf3c69e54fb6c79d699328a4e042e11bbd6f73f1a
            env:
              REGION: usa
              # Download the refreshed index beside the current one and swap,
              # so lookups keep working during an update. Needs room for two
              # indexes plus the compressed download.
              UPDATE_STRATEGY: PARALLEL
              UPDATE_INTERVAL: 30d
              JAVA_PARAMS: -Xmx3g
              LOG_LEVEL: INFO
            probes:
              # The first start downloads and unpacks the index before Photon
              # listens; allow three hours.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &status
                    path: /status
                    port: &port 2322
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 360
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *status
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *status
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 4Gi
              limits:
                # 3 GiB heap plus OpenSearch's off-heap use. Measure after
                # the backfill and adjust.
                memory: 6Gi
    defaultPodOptions:
      securityContext:
        # The image's photon user. Running as it directly skips the
        # entrypoint's root-only ownership changes.
        runAsNonRoot: true
        runAsUser: 9011
        runAsGroup: 9011
        fsGroup: 9011
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: photon
        ports:
          http:
            port: *port
    persistence:
      # Index, download staging and update state. Regenerable, so excluded
      # from Longhorn's nightly backups (docs/runbooks/longhorn-backup-restore.md).
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 50Gi
        accessMode: ReadWriteOnce
        labels:
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/no-backup: enabled
        globalMounts:
          - path: /photon/data
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
