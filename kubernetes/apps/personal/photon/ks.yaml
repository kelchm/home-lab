---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: photon
spec:
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: photon
      namespace: personal
  interval: 1h
  path: ./kubernetes/apps/personal/photon/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: personal
  # The first start downloads and unpacks the US index before Photon serves.
  timeout: 3h
  wait: false
