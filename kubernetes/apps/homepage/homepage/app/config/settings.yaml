---
title: home-lab
theme: dark
color: slate
headerStyle: clean
statusStyle: dot
useEqualHeights: true
target: _self
# Renovate owns version bumps; this also keeps api.github.com out of egress.
disableUpdateCheck: true

quicklaunch:
  searchDescriptions: true
  hideInternetSearch: false
  provider: google

# Group order, left to right. Groups not listed here would sort after these.
layout:
  Media:
    icon: mdi-play-circle-outline
    style: row
    columns: 3
  Home:
    icon: mdi-home-outline
  Infrastructure:
    icon: mdi-server-network
  Observability:
    icon: mdi-chart-line
