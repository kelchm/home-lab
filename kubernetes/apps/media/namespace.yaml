---
apiVersion: v1
kind: Namespace
metadata:
  name: media
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # qBittorrent's Gluetun sidecar requires NET_ADMIN and /dev/net/tun.
    # Relax enforcement only. Talos' restricted warn/audit defaults remain in
    # effect so this exception does not suppress security telemetry.
    pod-security.kubernetes.io/enforce: privileged
