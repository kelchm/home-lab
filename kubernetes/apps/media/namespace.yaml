---
apiVersion: v1
kind: Namespace
metadata:
  name: media
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # qBittorrent's Gluetun sidecar requires NET_ADMIN and /dev/net/tun.
    # Keep that exception explicit; other namespaces inherit Talos' baseline
    # enforcement and restricted warn/audit defaults.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
