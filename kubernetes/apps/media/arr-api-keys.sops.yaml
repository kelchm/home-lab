# Shared *arr API keys consumed by helper apps in the media namespace
# (Unpackerr via secretKeyRef, Recyclarr via secretKeyRef + !env_var,
# Exportarr and qbittorrent-exporter via secretKeyRef). Bazarr and Seerr do
# not consume env vars — their *arr connections are configured in their own
# UIs; the keys live here only as a single source-of-truth for rotation.
#
# Each value is the app's own API key (<app> UI → Settings → General → API
# Key). Prowlarr, Bazarr and qBittorrent (QBITTORRENT_API_KEY, the Web UI API
# key) were copied from the Homepage widget Secret, which holds the same
# values. A rotation updates both Secrets.
#
# Change a value without exposing it in process arguments:
#   sops set --value-stdin kubernetes/apps/media/arr-api-keys.sops.yaml \
#     '["stringData"]["<APP>_API_KEY"]'   # stdin: the JSON-quoted key
