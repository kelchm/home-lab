---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./secret.sops.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml

configMapGenerator:
  # rebelcore/jellyfin_grafana dashboards/jellyfin.json at a14c4a046160f861a93e4a847bb1916f715ccaa2 (Release 1.6.0). Local patches use the data_source variable, read current state with instant queries, replace per-user and per-title panels with aggregates, and set a 1m Min interval on range panels. The README lists each patch.
  - name: grafana-dashboard-jellyfin
    files:
      - jellyfin.json=./dashboards/jellyfin.json
    options:
      annotations:
        grafana_folder: Services/Media
        kustomize.toolkit.fluxcd.io/substitute: disabled
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true
