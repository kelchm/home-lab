# The exporter's copy of the Jellyfin API key named "homepage", which
# homepage-secret (HOMEPAGE_VAR_JELLYFIN_KEY) also holds. Jellyfin API keys
# are unrestricted administrators; the exporter's Cilium egress policy limits
# what this pod can do with it. A rotation updates both Secrets, then restarts
# deploy/jellyfin-exporter (see the exporter README).
