# Change the value without exposing it in process arguments:
#   sops set --value-stdin kubernetes/apps/media/jellyfin-exporter/app/secret.sops.yaml \
#     '["stringData"]["JELLYFIN_TOKEN"]'   # stdin: the JSON-quoted key
