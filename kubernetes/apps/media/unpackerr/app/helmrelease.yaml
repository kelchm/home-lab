---
# Unpackerr — polls *arr APIs for completed downloads, extracts RAR/7z
# archives in-place inside the downloads tree. No Web UI or HTTPRoute; its
# web server serves only metrics.
# Watches the downloads dir; *arr does the library import after extract.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  chartRef:
    kind: OCIRepository
    name: unpackerr
  interval: 1h
  values:
    controllers:
      unpackerr:
        strategy: Recreate
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/unpackerr/unpackerr
              repository: ghcr.io/unpackerr/unpackerr
              tag: v1.0.1@sha256:22b4693fbeaae4bd927905d63b59b8f67b4a1446682d965ac876c61a48976658
            env:
              TZ: America/New_York
              UN_LOG_LEVEL: info
              UN_WEBSERVER_METRICS: "true"
              UN_WEBSERVER_LISTEN_ADDR: 0.0.0.0:5656
              UN_SONARR_0_URL: http://sonarr.media.svc.cluster.local:8989
              UN_SONARR_0_PATHS_0: /data/.downloads
              UN_RADARR_0_URL: http://radarr.media.svc.cluster.local:7878
              UN_RADARR_0_PATHS_0: /data/.downloads
              UN_LIDARR_0_URL: http://lidarr.media.svc.cluster.local:8686
              UN_LIDARR_0_PATHS_0: /data/.downloads
              UN_SONARR_0_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: arr-api-keys
                    key: SONARR_API_KEY
              UN_RADARR_0_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: arr-api-keys
                    key: RADARR_API_KEY
              UN_LIDARR_0_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: arr-api-keys
                    key: LIDARR_API_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  # /metrics gathers application stats; timing out catches an
                  # unresponsive process or HTTP server while the port stays open.
                  httpGet:
                    path: /metrics
                    port: 5656
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1043
        runAsGroup: 65537
        supplementalGroups: [65537]
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: unpackerr
        ports:
          metrics:
            port: 5656
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            path: /metrics
            interval: 30s
    persistence:
      media:
        type: persistentVolumeClaim
        existingClaim: media-library
        advancedMounts:
          unpackerr:
            app:
              - path: /data/.downloads
                subPath: .downloads
