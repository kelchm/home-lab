---
# Each exporter holds one Starr app's full API key, and /metrics is
# unauthenticated, so only vmagent may scrape it. Egress is default-denied
# except DNS and the one app the exporter reads; each app's own policy admits
# that exporter by label and ServiceAccount identity. vmagent's egress to 9707
# is in the victoria-metrics-k8s-stack policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: exportarr
specs:
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: exportarr
        app.kubernetes.io/controller: sonarr
    ingress: &ingress
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: observability
              app.kubernetes.io/name: vmagent
              io.cilium.k8s.policy.serviceaccount: vmagent-victoria-metrics-k8s-stack
        toPorts:
          - ports:
              - port: "9707"
                protocol: TCP
    egress:
      - &dns
        toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
      # Cilium evaluates L4 policy against the backend endpoint, so these are
      # container ports.
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: media
              app.kubernetes.io/name: sonarr
        toPorts:
          - ports:
              - port: "8989"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: exportarr
        app.kubernetes.io/controller: radarr
    ingress: *ingress
    egress:
      - *dns
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: media
              app.kubernetes.io/name: radarr
        toPorts:
          - ports:
              - port: "7878"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: exportarr
        app.kubernetes.io/controller: lidarr
    ingress: *ingress
    egress:
      - *dns
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: media
              app.kubernetes.io/name: lidarr
        toPorts:
          - ports:
              - port: "8686"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: exportarr
        app.kubernetes.io/controller: prowlarr
    ingress: *ingress
    egress:
      - *dns
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: media
              app.kubernetes.io/name: prowlarr
        toPorts:
          - ports:
              - port: "9696"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: exportarr
        app.kubernetes.io/controller: bazarr
    ingress: *ingress
    egress:
      - *dns
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: media
              app.kubernetes.io/name: bazarr
        toPorts:
          - ports:
              - port: "6767"
                protocol: TCP
