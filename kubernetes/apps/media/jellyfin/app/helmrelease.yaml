---
# Jellyfin — media server. User-facing (not admin), runs on gateway-services
# (no kanidm-oidc middleware — Jellyfin's native auth is mature and clients
# expect it for federated logins from mobile apps / TVs). The shared media
# library is mounted readOnly — Jellyfin should never write into it; *arr
# apps own library writes.
#
# Transcoding is software-only: Jellyfin UI → Dashboard → Playback has
# Hardware acceleration = None, with HEVC and AV1 encoding off. VAAPI
# encode on the Vega 11 iGPU (Ryzen 705 G4) wedged the GPU until a hard
# power cycle, so it stays off until a revisit criterion in #63 is met:
# https://github.com/kelchm/home-lab/issues/63
# The render node is still exposed (unused): Talos runs cgroup v2, where
# a bare hostPath device mount leaves open() returning EPERM, because
# kubelet only wires the device-allow list for a pod that requests an
# extended resource from a registered device plugin.
# squat/generic-device-plugin (kube-system) exposes /dev/dri/renderD128
# as devic.es/dri, requested below.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: jellyfin
  interval: 1h
  values:
    controllers:
      jellyfin:
        strategy: Recreate
        containers:
          app:
            image:
              # renovate: datasource=docker depName=docker.io/jellyfin/jellyfin
              # home-operations doesn't ship jellyfin; using upstream official.
              repository: docker.io/jellyfin/jellyfin
              tag: 12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
            env:
              TZ: America/New_York
              # Jellyfin uses this for its own self-URL in API responses,
              # mobile-app discovery, etc.
              JELLYFIN_PublishedServerUrl: https://jellyfin.home.kelch.io
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
                devic.es/dri: 1
              limits:
                memory: 4Gi
                devic.es/dri: 1
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1044
        runAsGroup: 65537
        fsGroup: 1044
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 20Gi
        accessMode: ReadWriteOnce
        advancedMounts:
          jellyfin:
            app:
              - path: /config
      # Media library — readOnly: Jellyfin should never write into the
      # library (*arr apps own library writes). Defense-in-depth.
      media:
        type: persistentVolumeClaim
        existingClaim: media-library
        advancedMounts:
          jellyfin:
            app:
              - path: /data/tv
                subPath: tv
                readOnly: true
              - path: /data/movies
                subPath: movies
                readOnly: true
              - path: /data/music
                subPath: music
                readOnly: true
              - path: /data/books
                subPath: books
                readOnly: true
              - path: /data/audiobooks
                subPath: audiobooks
                readOnly: true
      # Transcoding scratch space — Jellyfin writes intermediate files
      # here during live transcodes. Keep on local node fs (not NFS) for
      # speed. sizeLimit caps worst-case usage to prevent node-disk
      # pressure if a transcode runs away; ~5 GB per 1080p stream buffer,
      # 50 GiB allows ~10 concurrent without eviction risk.
      transcodes:
        type: emptyDir
        sizeLimit: 50Gi
        advancedMounts:
          jellyfin:
            app:
              - path: /transcodes
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: Jellyfin
          gethomepage.dev/href: https://jellyfin.home.kelch.io
          gethomepage.dev/icon: jellyfin.svg
          gethomepage.dev/description: Media server
          gethomepage.dev/weight: "10"
          gethomepage.dev/widget.type: jellyfin
          gethomepage.dev/widget.url: http://jellyfin.media.svc.cluster.local:8096
          # Version 2 calls Jellyfin's current API paths; Jellyfin no longer serves /emby/.
          gethomepage.dev/widget.version: "2"
          gethomepage.dev/widget.enableBlocks: "true"
          gethomepage.dev/widget.enableNowPlaying: "false"
          gethomepage.dev/widget.enableMediaControl: "false"
          gethomepage.dev/widget.fields: '["movies", "series", "episodes"]'
          # Escaped from Helm's tpl; Homepage fills it from homepage-secret.
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_JELLYFIN_KEY}}" }}'
        hostnames: ["jellyfin.home.kelch.io"]
        parentRefs:
          - name: gateway-services
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
