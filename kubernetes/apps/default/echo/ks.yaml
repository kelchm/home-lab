---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: echo
spec:
  # Renders a ServiceMonitor CR, so the CRDs must land first.
  dependsOn:
    - name: prometheus-operator-crds
      namespace: observability
  interval: 1h
  path: ./kubernetes/apps/default/echo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
