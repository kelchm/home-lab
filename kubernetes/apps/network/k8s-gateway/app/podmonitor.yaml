---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: k8s-gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-gateway
      app.kubernetes.io/instance: k8s-gateway
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: k8s-gateway
