---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflare-dns
spec:
  chartRef:
    kind: OCIRepository
    name: cloudflare-dns
  interval: 1h
  values:
    fullnameOverride: *app
    provider: cloudflare
    # ndots:1 makes the CF API hostname resolve as an absolute name. With
    # the default ndots:5, the resolver tries search-suffixed queries
    # first, CoreDNS autopath answers them server-side while keeping the
    # suffixed question name, and Cilium's DNS proxy caches the IPs under
    # api.cloudflare.com.network.svc.cluster.local. — so the network
    # policy's toFQDNs matchName never matches and egress is denied.
    dnsConfig:
      options:
        - name: ndots
          value: "1"
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret cloudflare-dns-secret
            key: api-token
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --gateway-name=gateway-public
    triggerLoopOnEvent: true
    policy: sync
    sources: ["crd", "gateway-httproute"]
    txtPrefix: k8s.
    txtOwnerId: default
    domainFilters: ["${SECRET_DOMAIN}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
