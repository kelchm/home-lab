---
# Cloudflare DNS policy declares cross-namespace and external flows only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflare-dns
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-dns
      app.kubernetes.io/instance: cloudflare-dns
  ingress:
    # Scraper metrics.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
            app.kubernetes.io/instance: victoria-metrics-k8s-stack
            io.cilium.k8s.policy.serviceaccount: vmagent-victoria-metrics-k8s-stack
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
            prometheus: kube-prometheus-stack-prometheus
            io.cilium.k8s.policy.serviceaccount: kube-prometheus-stack-prometheus
      toPorts:
        - ports:
            - port: "7979"
              protocol: TCP
  egress:
    # Cloudflare API — the sole public destination. Everything else is denied.
    # IPv6 is disabled cluster-wide; add equivalent IPv6 policy before enabling it.
    - toFQDNs:
        - matchName: api.cloudflare.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
