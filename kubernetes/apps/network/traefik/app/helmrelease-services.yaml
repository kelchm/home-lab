---
# traefik-services — fronts LAN household-facing apps (DMZ pattern).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-services
spec:
  chart:
    spec:
      chart: traefik
      version: 42.4.0
      sourceRef:
        kind: HelmRepository
        name: traefik
  dependsOn:
    - name: traefik-admin   # admin instance owns the CRDs
  install:
    crds: Skip
  upgrade:
    crds: Skip
  interval: 1h
  values:
    fullnameOverride: traefik-services
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    # One replica per node, required. A rollout replaces one pod at a time,
    # removing the old pod first (maxSurge 0), so it needs no spare node and
    # still completes while one of the three nodes is cordoned. The PDB above
    # already allows one replica down.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: traefik-services-network
            topologyKey: kubernetes.io/hostname
    deployment:
      replicas: 2
    providers:
      kubernetesGateway:
        enabled: true
        labelSelector: homelab.kelch.io/gateway-role=services
      kubernetesIngress:
        enabled: false
      # Scoped via labelSelector so this instance only picks up CRDs explicitly
      # opted in. Used today for TraefikService + ServersTransport that give
      # kanidm sticky-cookie LB across replicas (multi-step auth signs per-pod
      # state).
      kubernetesCRD:
        enabled: true
        labelSelector: homelab.kelch.io/traefik-role=services
    gateway:
      enabled: false
    gatewayClass:
      enabled: false
    service:
      enabled: true
      labels:
        lb-pool: services-prod
      annotations:
        lbipam.cilium.io/ips: 10.32.140.1
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Cluster
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    metrics:
      prometheus:
        enabled: true
        # Dedicated metrics Service; the chart's ServiceMonitor selects it.
        service:
          enabled: true
        # See helmrelease-admin.yaml for rationale.
        disableAPICheck: true
        serviceMonitor:
          enabled: true
          namespace: network
    log:
      level: INFO
      format: json
    accessLog:
      enabled: true
      format: json
