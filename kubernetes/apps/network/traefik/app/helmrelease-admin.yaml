---
# traefik-admin — fronts LAN-only operator UIs (Longhorn, Grafana, etc.).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-admin
spec:
  chart:
    spec:
      chart: traefik
      version: 41.1.1
      sourceRef:
        kind: HelmRepository
        name: traefik
  # traefik-admin owns the Traefik CRDs (chart bundles them as templates).
  # The other two instances Skip CRD management and depend on this one so
  # they install after CRDs are present.
  interval: 1h
  values:
    fullnameOverride: traefik-admin

    # OIDC RP plugin loaded via yaegi. Traefik downloads plugins once during
    # process startup and does not retry a failed install; it keeps serving
    # without the plugin, which drops every Middleware-protected router. Pin
    # via Renovate, never auto-merge bumps. The anchor keeps the init-container
    # availability check on exactly the same release as Traefik loads.
    experimental:
      plugins:
        traefik-oidc-auth:
          moduleName: github.com/sevensolutions/traefik-oidc-auth
          # renovate: datasource=github-releases depName=sevensolutions/traefik-oidc-auth
          version: &oidcPluginVersion v0.21.0

    deployment:
      replicas: 2
      # Restart the Deployment when kaniop rotates either OAuth2 client_secret
      # or we rotate the traefik-oidc-auth session encryption key. Env-from-
      # Secret doesn't propagate to running pods otherwise.
      annotations:
        secret.reloader.stakater.com/reload: arr-suite-kanidm-oauth2-credentials,ops-suite-kanidm-oauth2-credentials,traefik-oidc-session-key
      # Existing pods restart concurrently with CoreDNS after a cold boot, so
      # Flux dependsOn cannot order this runtime dependency. Block each Traefik
      # process until the exact plugin artifact is downloadable; this gates on
      # pod DNS, Service routing, external connectivity, and the plugin host.
      # The loop deliberately fails closed instead of starting an admin gateway
      # that silently omits every OIDC-protected route.
      initContainers:
        - name: wait-for-oidc-plugin
          image: mirror.gcr.io/curlimages/curl:8.16.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              plugin_url="https://plugins.traefik.io/public/download/github.com/sevensolutions/traefik-oidc-auth/$(OIDC_PLUGIN_VERSION)"
              echo "Waiting for $plugin_url"
              until curl --fail --silent --show-error --location \
                --connect-timeout 5 --max-time 20 \
                --output /dev/null "$plugin_url"; do
                echo "OIDC plugin artifact is not reachable; retrying in 5 seconds"
                sleep 5
              done
              echo "OIDC plugin artifact is reachable"
          env:
            - name: OIDC_PLUGIN_VERSION
              value: *oidcPluginVersion
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
    providers:
      kubernetesGateway:
        enabled: true
        labelSelector: homelab.kelch.io/gateway-role=admin
      kubernetesIngress:
        enabled: false
      # Enabled (admin instance only) so Gateway API HTTPRoute ExtensionRef
      # filters can resolve to traefik.io/Middleware (e.g. BasicAuth on
      # Longhorn UI). The other two Traefik instances keep this off — they
      # have no Middleware-protected routes.
      kubernetesCRD:
        enabled: true
        # HTTPRoutes in `media/` reference Middleware kanidm-oidc in `network/`
        # via ExtensionRef.
        allowCrossNamespace: true
    gateway:
      enabled: false
    gatewayClass:
      enabled: false
    service:
      enabled: true
      labels:
        lb-pool: admin-prod
      annotations:
        lbipam.cilium.io/ips: 10.32.130.1
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Cluster
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    metrics:
      prometheus:
        enabled: true
        # Skip the chart's `.Capabilities.APIVersions.Has
        # "monitoring.coreos.com/v1"` guard. On the live cluster the CRD is
        # supplied by kube-prometheus-stack, but flux-local renders charts
        # offline with no cluster context, so the guard's `fail` aborts the
        # render and breaks PR CI. This setting is the chart's documented
        # escape hatch (traefik/traefik-helm-chart PR #769, issue #679).
        disableAPICheck: true
        serviceMonitor:
          enabled: true
          namespace: network
    log:
      level: INFO
    accessLog:
      enabled: true

    # CLIENT_SECRET keys from the kaniop-emitted Secrets, one per OIDC
    # client. Env-var names are namespaced so additional clients can be
    # added without collision. OIDC_SESSION_SECRET is the traefik-oidc-auth
    # plugin's session-state encryption key — shared across both replicas
    # so cross-pod auth-flow handoffs work (without it each pod uses a
    # random default and the OAuth2 code exchange fails ~50% of the time).
    env:
      - name: ARR_SUITE_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: arr-suite-kanidm-oauth2-credentials
            key: CLIENT_SECRET
      - name: OPS_SUITE_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: ops-suite-kanidm-oauth2-credentials
            key: CLIENT_SECRET
      - name: OIDC_SESSION_SECRET
        valueFrom:
          secretKeyRef:
            name: traefik-oidc-session-key
            key: SESSION_SECRET
