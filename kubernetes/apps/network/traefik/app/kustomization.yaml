---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrepository.yaml
  - ./helmrelease-admin.yaml
  - ./helmrelease-public.yaml
  - ./helmrelease-services.yaml
  - ./gateways.yaml
  - ./oauth2-arr-suite.yaml
  - ./oauth2-ops-suite.yaml
  - ./secret-oidc-session-key.sops.yaml
  - ./networkpolicy.yaml

configMapGenerator:
  # grafana.com 17347 revision 9; datasource provisioning; exporter service label -> exported_service.
  - name: grafana-dashboard-stock-traefik
    files:
      - stock-traefik.json=./dashboards/stock-traefik.json
    options:
      annotations:
        grafana_folder: Platforms/Kubernetes
        kustomize.toolkit.fluxcd.io/substitute: disabled
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true
