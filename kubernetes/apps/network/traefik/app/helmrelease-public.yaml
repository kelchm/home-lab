---
# traefik-public — fronts Cloudflare-tunneled apps. ClusterIP only because
# the only consumer is the in-cluster cloudflared pod, which targets the
# Service via cluster DNS.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-public
spec:
  chart:
    spec:
      chart: traefik
      version: 42.4.0
      sourceRef:
        kind: HelmRepository
        name: traefik
  dependsOn:
    - name: traefik-admin   # admin instance owns the CRDs
  install:
    crds: Skip
  upgrade:
    crds: Skip
  interval: 1h
  values:
    fullnameOverride: traefik-public
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    # One replica per node, required. A rollout replaces one pod at a time,
    # removing the old pod first (maxSurge 0), so it needs no spare node and
    # still completes while one of the three nodes is cordoned. The PDB above
    # already allows one replica down.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: traefik-public-network
            topologyKey: kubernetes.io/hostname
    deployment:
      replicas: 2
    providers:
      kubernetesGateway:
        enabled: true
        # Filter to GatewayClasses with this label — partitions which
        # Traefik instance owns which Gateway when there are multiple.
        labelSelector: homelab.kelch.io/gateway-role=public
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        enabled: false
    # We author Gateways and GatewayClasses ourselves (gateways.yaml).
    gateway:
      enabled: false
    gatewayClass:
      enabled: false
    service:
      enabled: true
      # No lb-pool label, no lbipam annotation — Cilium does not L2-announce
      # ClusterIP services, which is what we want.
      spec:
        type: ClusterIP
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    metrics:
      prometheus:
        enabled: true
        # Dedicated metrics Service; the chart's ServiceMonitor selects it.
        service:
          enabled: true
        # See helmrelease-admin.yaml for rationale.
        disableAPICheck: true
        serviceMonitor:
          enabled: true
          namespace: network
    log:
      level: INFO
      format: json
    accessLog:
      enabled: true
      format: json
