# See k8s-prod-1/network-extras.yaml for context — same shape, different IPs.
machine:
  network:
    interfaces:
      - deviceSelector:
          hardwareAddr: "c4:65:16:9d:0a:2b"
          physical: true
        dhcp: false
        addresses:
          - "10.32.30.12/24"
        routes:
          - gateway: "10.32.30.1"
            network: 0.0.0.0/0
        mtu: 1500
        vip:
          ip: "10.32.30.8"
        vlans:
          - vlanId: 40
            mtu: 1500
            addresses:
              - "10.32.40.12/24"
      # 2.5GbE storage NIC — enslaved to br-storage by MAC via bridgePort (no IP).
      - deviceSelector:
          hardwareAddr: "00:e0:4c:68:04:69"
          physical: true
        dhcp: false
        mtu: 1500
        bridgePort:
          master: br-storage
      # Linux bridge owning the storage VLAN IP; its only port is the storage
      # NIC above, bound by MAC.
      - interface: br-storage
        bridge:
          stp:
            enabled: false
        addresses:
          - "10.32.25.12/24"
        mtu: 1500
        dhcp: false
