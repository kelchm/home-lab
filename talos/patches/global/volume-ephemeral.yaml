# Cap EPHEMERAL (/var) at 100 GiB to leave room on the system disk for the
# Longhorn user volume. Containerd's compressed content and unpacked snapshots
# dominate usage; kubelet image GC provides headroom within this fixed budget.
# See docs/runbooks/talos-ephemeral-storage.md for thresholds and verification.
#
# Note: VolumeConfig for system volumes only accepts STATE, EPHEMERAL, or
# IMAGE-CACHE. Changing maxSize on an existing install does not shrink the
# partition in place — the node must reset EPHEMERAL (talosctl reset
# --system-labels-to-wipe=EPHEMERAL --reboot) for the new size to take effect.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  minSize: 100GiB
  maxSize: 100GiB
