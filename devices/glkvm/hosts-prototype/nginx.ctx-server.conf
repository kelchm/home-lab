# Optional companion to the stock console; the firmware's main config stays intact.
location = /hosts {
    auth_request off;
    return 302 /hosts/;
}

location ^~ /hosts/ {
    auth_request off;
    alias /etc/kvmd/user/hosts-prototype/;
    index index.html;
    expires -1;
    # Location add_header replaces inheritance: retain the firmware ssl.conf HSTS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
}
