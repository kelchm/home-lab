worker_processes 4;

error_log stderr;

include /usr/share/kvmd/extras/*/nginx.ctx-main.conf;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_buffers 16 8k;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript image/svg+xml;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "MSIE [1-6]\.";

    types_hash_max_size 4096;
    server_names_hash_bucket_size 128;

    access_log off;

    include /etc/kvmd/nginx/mime-types.conf;
    default_type application/octet-stream;
    charset utf-8;

    sendfile on;
    tcp_nodelay on;
    tcp_nopush on;
    keepalive_timeout 10;
    client_max_body_size 8k;

    client_body_temp_path /tmp/kvmd-nginx/client_body_temp;
    fastcgi_temp_path /tmp/kvmd-nginx/fastcgi_temp;
    proxy_temp_path /tmp/kvmd-nginx/proxy_temp;
    scgi_temp_path /tmp/kvmd-nginx/scgi_temp;
    uwsgi_temp_path /tmp/kvmd-nginx/uwsgi_temp;

    include /etc/kvmd/nginx/kvmd.ctx-http.conf;
    include /usr/share/kvmd/extras/*/nginx.ctx-http.conf;

    server {
        listen 80;
        listen [::]:80;
        include /etc/kvmd/nginx/certbot.ctx-server.conf;

        location /same_check {
            proxy_pass http://kvmd;
            include /etc/kvmd/nginx/loc-proxy.conf;
            include /etc/kvmd/nginx/loc-cors.conf;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Keep the vendor UI available for firmware and appliance management.
    server {
        listen 8888 ssl;
        listen [::]:8888 ssl;
        http2 on;
        include /etc/kvmd/nginx/ssl.conf;
        include /etc/kvmd/nginx/gl.ctx-server.conf;
        include /usr/share/kvmd/extras/*/nginx.ctx-server.conf;

        location /connect {
            return 301 /;
        }
    }

    # Serve the bundled upstream PiKVM UI as the primary interface.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        include /etc/kvmd/nginx/ssl.conf;
        include /etc/kvmd/nginx/kvmd.ctx-server.conf;
        include /usr/share/kvmd/extras/*/nginx.ctx-server.conf;

        location /connect {
            return 301 /;
        }
    }
}
